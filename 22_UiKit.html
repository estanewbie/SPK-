// ---------- ALUR LH: dibuat -> audit -> (revisi) -> dokumen Code 3 / Code 7 / AGO -> selesai ----------

// Dokumen yang diperlukan LH (aturan yang sama dengan Pusat verifikasi dan pembuatan LH):
//  Code 3 bila ada Retur Bekas bernama; Code 7 bila catatan material MDU memuat "bekas" atau "ex"; AGO bila Code 3 atau Code 7 diperlukan.

window.lhDokumen = (lh) => {

// Pencarian LH yang seragam (Antrean PK dan Kelola PK): kelompok bidang per LH, disimpan sekali per objek LH.
// lhMatch(lh, teks) -> null bila ada kata yang tidak ditemukan di LH itu; bila cocok -> daftar bidang tempat kata ditemukan.
(() => {
  const cache = new WeakMap();
  const MAT = ['materialMdu', 'uraianPasang', 'uraianBongkar', 'returBaru', 'returBekas'];
  const groups = (lh) => {
    let g = cache.get(lh); if (g) return g;
    const d = lh.data || {};

// ---------- PERIODE TAMPILAN (Radar audit dan Pusat verifikasi) ----------
// Agar daftar kerja tidak menumpuk, kedua menu itu secara bawaan hanya menampilkan LH SEJAK 1 NOVEMBER 2026. Menu lain tetap menampilkan data lengkap.
// Data di periode lain TIDAK hilang: jumlahnya selalu ditampilkan (terutama yang belum diaudit) dan bisa dibuka lewat pilihan periode.
// Ubah MULAI bila batas awal bergeser. LH tanpa tanggal yang terbaca selalu ikut tampil (supaya tidak terlupakan).
window.Periode = (() => {
  const MULAI = new Date(2026, 10, 1).getTime();   // 1 November 2026
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const waktu = (l) => {

    if ((m = s.match(/^(\d{1,2})\s+([A-Za-z]+)\.?,?\s+(\d{4})/))) { const b = { jan: 0, feb: 1, mar: 2, apr: 3, mei: 4, may: 4, jun: 5, jul: 6, agu: 7, ags: 7, aug: 7, sep: 8, okt: 9, oct: 9, nov: 10, des: 11, dec: 11 }[m[2].slice(0, 3).toLowerCase()]; if (b !== undefined) return new Date(+m[3], b, +m[1]).getTime(); }

      .concat(Object.keys(bln).sort().reverse().map((k) => ({ v: k, label: nama(k) + ' (' + bln[k] + ' LH)' })))

  };

})();

// ---------- KEAMANAN PROSES: tidak ada pindah halaman atau tutup jendela saat data sedang diproses ----------
// Proses.mulai() dipanggil sebelum setiap penyimpanan/unggah ke server dan hasilnya dipanggil saat selesai.

  return new Promise((resolve) => {
    let fin = false; let tm = null;
    const end = (r) => { if (fin) return; fin = true; clearTimeout(tm); selesai(); resolve(r); };
    tm = setTimeout(() => end({ ok: false, timeout: true, message: 'Server tidak menjawab dalam ' + Math.max(1, Math.round(batas / 1000)) + ' detik, jadi hasilnya belum diketahui.' }), batas);
    try {
      if (typeof google === 'undefined' || !google.script || !google.script.run) return end({ ok: false, message: 'Aplikasi tidak terhubung ke server. Muat ulang halaman.' });
      window.__safeRunAktif = true;   // penanda: kunci layar sudah diatur di sini, penjaga otomatis tidak menghitung dua kali
      try {
        google.script.run
          .withSuccessHandler((res) => { if (res && res.status === 'success') end({ ok: true, res }); else end({ ok: false, res, message: (res && res.message) || 'Server menolak permintaan.' }); })
          .withFailureHandler((err) => end({ ok: false, message: String((err && err.message) || err || 'Koneksi ke server gagal.') }))[fn](...(args || []));
      } finally { window.__safeRunAktif = false; }
    } catch (e) { end({ ok: false, message: String((e && e.message) || e) }); }
  });
};

// Komponen bersama sesuai standar desain (DESIGN.md). Dipakai semua menu baru: window.UI.*
// Font Source Sans 3, bobot 400/500, tanpa kapital semua, warna dari palet DESIGN.md.
window.UI = (() => {
  const INK = '#3A62B0';
  const TONE = { ok: '#1B7A3E', warn: '#C77700', bad: '#B42318', info: '#3A62B0', mute: '#8A857C' };

  // Titik status + kata, bukan pil berhuruf kapital: <UI.Status tone="warn">Draf</UI.Status>
  const Status = ({ tone = 'mute', children }) => (
    <span className="inline-flex items-center gap-[7px] text-[13px]">
      <span className="w-[7px] h-[7px] rounded-full shrink-0" style={{ background: TONE[tone] || TONE.mute }}></span>{children}
    </span>
  );

  // kind: primary (biru tinta) | secondary (garis) | link (teks biru) | danger (garis merah)
  const Btn = ({ kind = 'secondary', className = '', children, ...p }) => {
    const base = 'inline-flex items-center justify-center gap-2 text-[13px] transition-colors disabled:opacity-40 disabled:cursor-not-allowed ';
    const k = {
      primary: 'h-8 px-4 rounded-lg bg-[#3A62B0] text-white font-medium hover:bg-[#2F5399]',
      secondary: 'h-8 px-3.5 rounded-lg border border-[#D9DDE9] bg-white text-[#23211E] hover:border-[#9C968A]',
      danger: 'h-8 px-3.5 rounded-lg border border-[#F0C4BF] bg-white text-[#B42318] hover:bg-[#FDF3F2]',
      link: 'text-[#3A62B0] hover:underline'
    }[kind];
    return <button className={base + k + ' ' + className} {...p}>{children}</button>;
  };

  // Tab teks biasa, aktif bergaris bawah biru tinta. tabs: [{key,label,badge?,disabled?}]
  const Tabs = ({ tabs, active, onChange }) => (
    <nav className="flex gap-7 border-b border-[#E6E9F2]">
      {tabs.map((t) => (
        <button key={t.key} disabled={t.disabled} onClick={() => onChange(t.key)}
          className={`h-9 -mb-px border-b-2 text-[13px] flex items-center ${active === t.key ? 'border-[#3A62B0] text-[#23211E] font-medium' : 'border-transparent text-[#6B665E] hover:text-[#23211E]'} ${t.disabled ? 'opacity-40 cursor-not-allowed' : ''}`}>
          {t.label}{t.badge ? <span className="ml-[7px] text-[#B42318]">{t.badge}</span> : null}
        </button>
      ))}
    </nav>
  );

  // Panel geser dari kanan (detail/edit tanpa pindah halaman)
  const Drawer = ({ open, title, onClose, footer, children, width = 420 }) => open ? (
    <div className="fixed inset-0 z-[85]">
      <div className="absolute inset-0 bg-[#23211E]/30" onClick={onClose}></div>
      <aside className="absolute right-0 top-0 bottom-0 max-w-full bg-white shadow-xl flex flex-col page-in" style={{ width }}>
        <div className="h-[52px] px-5 flex items-center justify-between border-b border-[#E6E9F2] shrink-0">
          <span className="text-[15px] font-medium">{title}</span>
          <button onClick={onClose} aria-label="Tutup" className="w-8 h-8 rounded-md text-[#6B665E] hover:bg-[#EEF0F7]"><i className="fa-solid fa-xmark"></i></button>
        </div>
        <div className="flex-1 overflow-y-auto p-5">{children}</div>
        {footer && <div className="px-5 py-3 border-t border-[#E6E9F2] shrink-0">{footer}</div>}
      </aside>
    </div>
  ) : null;

  const Empty = ({ children }) => <div className="py-10 text-center text-[#6B665E]">{children}</div>;

  // Lapisan penghalang layar selama ada proses (dipasang sekali di App). Menutup seluruh layar termasuk menu samping.
  const Blocker = () => {
    const [, tick] = React.useState(0);
    React.useEffect(() => window.Proses.subscribe(() => tick((x) => x + 1)), []);
    if (!window.Proses.sibuk()) return null;
    return (
      <div className="fixed inset-0 z-[300] flex items-center justify-center bg-[#23211E]/40" role="alertdialog" aria-live="assertive" aria-busy="true" data-testid="proses-berjalan">
        <div className="bg-white rounded-xl shadow-xl px-6 py-5 w-[360px] max-w-[90vw] text-center">
          <i className="fa-solid fa-circle-notch fa-spin text-[22px] text-[#3A62B0]"></i>
          <div className="text-[14px] font-medium mt-2">{window.Proses.label()}</div>
          <p className="text-[12px] text-[#6B665E] mt-1">Mohon tunggu. Jangan tutup atau pindah halaman sampai selesai.</p>
        </div>
      </div>);
  };
  // Penangkap galat tampilan: bila satu menu gagal digambar, hanya menu itu yang diganti pesan ramah. Data tidak tersentuh.
  class Guard extends React.Component {
    constructor(p) { super(p); this.state = { err: null }; }
    static getDerivedStateFromError(e) { return { err: e }; }
    componentDidCatch(e) { try { console.error('Galat tampilan ' + (this.props.nama || ''), e); } catch (x) { /* abaikan */ } }
    render() {
      if (!this.state.err) return this.props.children;
      return (
        <div className="bg-white border border-[#F0C4BF] rounded-xl px-6 py-8 text-center max-w-[560px] mx-auto mt-10" role="alert">
          <div className="text-[16px] font-medium text-[#B42318]">Menu {this.props.nama || 'ini'} sedang bermasalah</div>
          <p className="text-[13px] text-[#6B665E] mt-1">Tampilan gagal dimuat. Data di database tidak berubah. Coba muat ulang menu ini; bila masih sama, muat ulang halaman (Ctrl+F5).</p>
          <div className="mt-4 flex justify-center gap-2">
            <button className="h-8 px-4 rounded-lg bg-[#3A62B0] text-white hover:bg-[#2F5399]" onClick={() => this.setState({ err: null })}>Coba lagi</button>
            <button className="h-8 px-4 rounded-lg border border-[#D9DDE9] bg-white" onClick={() => { try { window.location.reload(); } catch (e) { /* abaikan */ } }}>Muat ulang halaman</button>
          </div>
        </div>);
    }
  }

  // Nama aksi yang mudah dibaca (kode di server -> kalimat)
  const JEJAK_LABEL = {
    'akses.masuk': 'Masuk aplikasi', 'akses.gagal': 'Gagal masuk', 'akses.keluar': 'Keluar aplikasi',
    'lh.buat': 'Membuat LH', 'lh.ubah': 'Mengubah LH', 'lh.revisi': 'Merevisi LH', 'lh.hapus': 'Menghapus LH', 'lh.pindah': 'Memindahkan LH', 'lh.rab': 'Status RAB LH',
    'audit.tandai': 'Menandai sudah diaudit', 'audit.batal': 'Membatalkan tanda audit', 'audit.temuan': 'Menulis temuan audit', 'audit.hapus_temuan': 'Menghapus temuan audit',
    'dokumen.unggah': 'Mengunggah dokumen', 'dokumen.cetak': 'Mencetak Code 3 atau Code 7', 'dokumen.cetak_manual': 'Mencetak Code 3/7 manual', 'code.penanda_simpan': 'Menyimpan penandatangan Code', 'code.penanda_hapus': 'Menghapus penandatangan Code', 'code.norm_simpan': 'Menyimpan nomor normalisasi', 'code.norm_hapus': 'Menghapus nomor normalisasi', 'code.norm_impor': 'Mengimpor nomor normalisasi', 'arsip.file_tambah': 'Menambah file arsip', 'arsip.file_hapus': 'Menghapus tautan file arsip', 'arsip.pindah': 'Memindahkan LH ke file arsip', 'arsip.pulih_rentang': 'Memulihkan LH dari file arsip',
    'pk.buat': 'Membuat PK', 'pk.ubah': 'Mengubah PK', 'pk.hapus': 'Menghapus PK', 'pk.alokasi': 'Memasukkan PK ke SPK', 'pk.keluarkan': 'Mengeluarkan PK dari SPK', 'pk.cetak': 'Status cetak PK',
    'spk.buat': 'Membuat SPK', 'spk.ubah': 'Mengubah SPK', 'spk.hapus': 'Menghapus SPK',
    'rab.buat': 'Menyimpan RAB', 'rab.kunci': 'Mengunci/membuka RAB', 'rab.upah': 'Mengubah upah RAB',
    'ktk.buat': 'Membuat KTK', 'ktk.simpan': 'Menyimpan KTK', 'ktk.pindah': 'Memindahkan KTK', 'ktk.folder': 'Mengubah folder KTK', 'ktk.template': 'Mengubah template KTK', 'ktk.kembalikan': 'Mengembalikan KTK ke Perlu dibuat KTK', 'ktk.hakfolder': 'Memindahkan hak akses folder KTK'
  };
  const jejakNama = (a) => JEJAK_LABEL[a] || (a && a.indexOf('logharian.') === 0 ? 'Log harian: ' + a.slice(10) : a) || '-';

  // Riwayat satu objek (mis. satu LH): siapa membuat, mengubah, mengaudit, mengunggah dokumen, dan kapan. Dimuat dari server.
  const RiwayatLh = ({ id, objek = 'LH', auth, ringkasLokal }) => {
    const [st, setSt] = React.useState({ s: 'muat', data: [], ringkas: null, msg: '' });
    React.useEffect(() => {
      let batal = false; setSt({ s: 'muat', data: [], ringkas: null, msg: '' });
      if (!id) return undefined;
      window.safeRun('jejakRiwayat', [{ t: (auth && auth.t) || '', as: (auth && auth.as) || '' }, { objek, id: String(id), batas: 100 }], { label: 'Memuat riwayat ' + id, tanpaBlokir: true }).then((o) => {
        if (batal) return;
        if (o.ok && o.res && o.res.status === 'success') setSt({ s: 'ok', data: o.res.data || [], ringkas: o.res.ringkas || null, msg: '' });
        else setSt({ s: 'galat', data: [], ringkas: null, msg: (o.res && o.res.message) || o.message || 'Riwayat tidak bisa dimuat.' });
      });
      return () => { batal = true; };
    }, [id, auth && auth.t]);
    const r = st.ringkas || ringkasLokal || null;
    return (
      <div data-testid="riwayat-lh" className="text-[13px]">
        <div className="text-[12px] text-[#6B665E] mb-1.5">Riwayat pengerjaan</div>
        {r && (
          <div className="mb-2 text-[#23211E]" data-testid="riwayat-ringkas">
            <div>Dibuat oleh {r.dibuatOleh ? <span>ID <b className="font-medium">{r.dibuatOleh}</b>{r.dibuatTgl ? ' pada ' + r.dibuatTgl : ''}</span> : <span className="text-[#8A857C]">tidak tercatat (dibuat sebelum pencatatan aktif)</span>}</div>
            {r.diubahOleh ? <div>Terakhir diubah oleh ID <b className="font-medium">{r.diubahOleh}</b>{r.diubahTgl ? ' pada ' + r.diubahTgl : ''}</div> : null}
            {r.auditOleh ? <div>Diaudit oleh ID <b className="font-medium">{r.auditOleh}</b>{r.auditTgl ? ' pada ' + r.auditTgl : ''}</div> : null}
          </div>)}
        {st.s === 'muat' && <div className="text-[#6B665E]"><i className="fa-solid fa-circle-notch fa-spin mr-2"></i>Memuat riwayat...</div>}
        {st.s === 'galat' && <div className="text-[#B42318]" role="alert">{st.msg}</div>}
        {st.s === 'ok' && !st.data.length && <div className="text-[#8A857C]">Belum ada kejadian tercatat untuk {objek} ini.</div>}
        {st.s === 'ok' && st.data.length > 0 && (
          <ol className="border-l border-[#E6E9F2] ml-1.5">
            {st.data.map((e) => (
              <li key={e.id} className="pl-3 pb-2.5 relative">
                <span className="absolute -left-[4px] top-[6px] w-[7px] h-[7px] rounded-full" style={{ background: e.hasil === 'gagal' ? TONE.bad : TONE.ok }}></span>
                <div className="text-[#23211E]">{jejakNama(e.aksi)}{e.hasil === 'gagal' ? <span className="text-[#B42318]"> (ditolak)</span> : null}</div>
                <div className="text-[12px] text-[#6B665E]">ID {e.user}{e.nama ? ' · ' + e.nama : ''}{e.peran ? ' · ' + e.peran : ''}{e.loginAsli && e.loginAsli !== e.user ? ' · login ' + e.loginAsli : ''} · {e.waktu}</div>
                {e.ket ? <div className="text-[12px] text-[#8A857C]">{e.ket}</div> : null}
              </li>))}
          </ol>)}
      </div>);
  };

  return { INK, Status, Btn, Tabs, Drawer, Empty, Blocker, Guard, RiwayatLh, jejakNama, JEJAK_LABEL };
})();
</script>
