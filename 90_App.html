<script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const App = () => {
      // --- 1. AUTH & ROLE STATES ---
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [currentView, setCurrentViewRaw] = useState('dashboard');
      // Pindah menu ditolak selama ada proses simpan/unggah (UiKit: Proses). Menjamin proses selesai dulu sebelum halaman berganti.

        if (window.Proses && window.Proses.sibuk()) { showToast('Masih memproses', 'Tunggu proses selesai sebelum pindah halaman.', 'error'); return; }
        setCurrentViewRaw(v);
      };
      const [allUsers, setAllUsers] = useState([]);
      const [akunList, setAkunList] = useState([]);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [isFetchingData, setIsFetchingData] = useState(true);

      // --- 2. DATABASE STATES (Sync dengan Google Sheets) ---
      const [spks, setSpks] = useState([]);
      const [pks, setPks] = useState([]);
      const [lhs, setLhs] = useState([]);
      const [masterDatabase, setMasterDatabase] = useState([]);
      const [dataTtd, setDataTtd] = useState([]);
      const [rabs, setRabs] = useState([]); 
      // RATAKANAN V6.1: Variabel Patokan Global Upah & Transport
      const [globalUpah, setGlobalUpah] = useState(125000); 
      const [globalTransport, setGlobalTransport] = useState(200000);

      // RATAKANAN V6.13: State Filter Tanggal Laporan
      const [filterStartDate, setFilterStartDate] = useState('');
      const [filterEndDate, setFilterEndDate] = useState('');

      // --- 3. UI & MODAL STATES ---
      const [selectedSpk, setSelectedSpk] = useState(null);
      const [activePk, setActivePk] = useState(null);
      const [managePkOpen, setManagePkOpen] = useState(null);
      const [allocatingSpkId, setAllocatingSpkId] = useState('');
      const [allocatingPk, setAllocatingPk] = useState(null);
      const [checkedLhs, setCheckedLhs] = useState([]);
      const [toast, setToast] = useState({ show: false, title: '', message: '', type: 'success' });
      const [isLhInputOpen, setIsLhInputOpen] = useState(false);
      const [lhRef, setLhRef] = useState(null); // acuan log harian sumber untuk formulir LH
      const [isLhPrintOpen, setIsLhPrintOpen] = useState(false); 
      const [isRabPrintOpen, setIsRabPrintOpen] = useState(false);
      const [activeLhData, setActiveLhData] = useState(null);    
      const [editingLhId, setEditingLhId] = useState(null);  
      const [kopImageError, setKopImageError] = useState(false); 
      const [isPkModalOpen, setIsPkModalOpen] = useState(false);

      // Menu samping bisa diciutkan jadi ikon saja; pilihan user diingat di browser (DESIGN.md)
      const [sidebarCollapsed, setSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('sidebarCollapsed') === '1'; } catch (e) { return false; }
      });
      const toggleSidebar = () => setSidebarCollapsed((v) => {
        const nv = !v;
        try { localStorage.setItem('sidebarCollapsed', nv ? '1' : '0'); } catch (e) {}
        return nv;
      });

      const [filterLhNama, setFilterLhNama] = useState('');
      const [filterLhPengawas, setFilterLhPengawas] = useState('');
      const [filterLhTeam, setFilterLhTeam] = useState('');
      
      const [isSpkPrintOpen, setIsSpkPrintOpen] = useState(false);
      const [spkToPrint, setSpkToPrint] = useState(null);

      // RATAKANAN V7.6: State untuk SPK / Wadah Baru
      const [isSpkModalOpen, setIsSpkModalOpen] = useState(false);

      const [docStartDate, setDocStartDate] = useState('');
      const [docEndDate, setDocEndDate] = useState('');
      const [searchDoc, setSearchDoc] = useState('');

      // RATAKANAN V7.6: notice
      const [showConfirmBypass, setShowConfirmBypass] = useState(false);
      const [showConfirmMove, setShowConfirmMove] = useState(false);

      // RATAKANAN V7.6: Fillter LH 
      const [filterLhTanggal, setFilterLhTanggal] = useState('');

      // RATAKANAN V7.6: LH pindah PK
      const [targetPkId, setTargetPkId] = useState('');
      
      //  Tambahkan ulp_wilayah dan pos_anggaran di dalam form
      const [newSpkForm, setNewSpkForm] = useState({
          id: '', nama: '', vendor: '', tanggal: '', exp: '', nominal_total: '', nominalFormatted: '', ulp_wilayah: '', pos_anggaran: ''
      });

      //  Tambahkan Set Anggaran
      const [minAnggaran, setMinAnggaran] = useState('');
      const [maxAnggaran, setMaxAnggaran] = useState('');

      //  Tambahkan Penanda Tanggan
      const [dataPenandatangan, setDataPenandatangan] = useState([]);


      //  Tambahkan dashboard filter
      const [activeSpkFilter, setActiveSpkFilter] = useState('ALL');

      // Tambahan List PK di SPK
      const [selectedPksCetak, setSelectedPksCetak] = useState([]);
      const [printedPkIds, setPrintedPkIds] = useState([]);
      const [spkDetailStep, setSpkDetailStep] = useState('checklist');

      //  Daftar ULP se-Bali untuk Dropdown
      const daftarUlpBali = [
          "UP3 Bali Selatan","UP3 Bali Timur","UP3 Bali Utara",
          "UID Bali (Pusat)"
      ];

      // tombol delete PK
      const [isDeleteModalOpen, setIsDeleteModalOpen] = useState(false);
      const [selectedPkId, setSelectedPkId] = useState(null);

      // 🔥 State baru untuk Rekapitulasi
      const [isRekapPrintOpen, setIsRekapPrintOpen] = useState(false); 


      // Memori khusus Radar Audit
      const [auditSearchTerm, setAuditSearchTerm] = useState('');
      const [auditFilterStatus, setAuditFilterStatus] = useState('all'); 
      const [auditExpandedSpks, setAuditExpandedSpks] = useState([]); 
      const [auditExpandedPks, setAuditExpandedPks] = useState([]); 

      // Memori untuk Pop-Up Modal Audit
      const [isAuditModalOpen, setIsAuditModalOpen] = useState(false);
      const [activeAuditLh, setActiveAuditLh] = useState(null); 
      const [tempAuditNote, setTempAuditNote] = useState('');


      // MESIN PENGGABUNG DATA RADAR AUDIT (VERSI + PK TANPA SPK)
      const processedAuditData = React.useMemo(() => {
      const safeSpks = typeof spks !== 'undefined' ? spks : [];
      const safePks = typeof pks !== 'undefined' ? pks : [];
      const safeLhs = typeof lhs !== 'undefined' ? lhs : [];

      let stats = { totalSpk: 0, totalPk: 0, pendingPk: 0, completedPk: 0, totalIssue: 0 };
      
      // Kumpulkan ID SPK yang resmi ada di database
      const validSpkIds = safeSpks.map(s => String(s.ID_SPK || s.id).trim());



      // =======================================================
      // 1. OLAH SPK NORMAL (YANG SUDAH ADA KONTRAKNYA)
      // =======================================================
      let filteredSpks = safeSpks.map(spk => {
          const spkId = String(spk.ID_SPK || spk.id).trim();
          
          let myPks = safePks.filter(pk => String(pk.spk_id).trim() === spkId).map(pk => {
              const pkId = String(pk.id).trim();
              const myLhs = safeLhs.filter(l => String(l.pk_id).trim() === pkId).map(lh => {
                  const d = lh.data || {};
                  const mdu = [...(d.materialMdu || d.material_mdu || []), ...(d.materialKonstruksi || d.material_konstruksi || [])];
                  const pasang = d.uraianPasang || d.jasaPasang || d.jasa_pasang || d.uraian_pasang || [];
                  const bongkar = d.uraianBongkar || d.jasaBongkar || d.jasa_bongkar || d.uraian_bongkar || [];
                  const retur = d.returBekas || d.retur || d.material_retur || d.uraianRetur || d.uraian_retur || [];

                  return {
                      id: lh.id || lh.id_lh || d.id_lh || '-',
                      tanggal: lh.tanggal_lh || d.tanggal_lh || lh.tanggal || '-',
                      uraian: lh.nama_pekerjaan_lh || d.nama_pekerjaan_lh || lh.uraian || 'Tanpa Uraian',
                      auditNote: lh.Audit_Note || lh.audit_note || lh['Audit Note'] || d.Audit_Note || d.audit_note || d['Audit Note'] || null,
                      detailItems: { mdu, pasang, bongkar, retur },
                      lokasi: lh.lokasi_lh || d.lokasi_lh || pk.lokasi || '-',
                      pengawas: lh.pengawas_lh || d.pengawas_lh || pk.pengawas || '-',
                      team: lh.team_lh || d.team_lh || pk.team || '-'
                  };
              });

              return { ...pk, id: pkId, nama: pk.nama || 'Tanpa Nama', lokasi: pk.lokasi || '-', statusCetak: pk.status_cetak === true || pk.status_cetak === 'Sudah', lhs: myLhs };
          });

          // Filter Pencarian SPK Normal
          const q = auditSearchTerm.toLowerCase();
          if (q) {
              const matchSpk = spkId.toLowerCase().includes(q) || (spk.Nama_Vendor || '').toLowerCase().includes(q);
              if (!matchSpk) {
                  myPks = myPks.filter(pk => {
                      const matchPk = pk.id.toLowerCase().includes(q) || pk.nama.toLowerCase().includes(q);
                      const matchLh = pk.lhs.some(lh => 
                          lh.id.toLowerCase().includes(q) || lh.uraian.toLowerCase().includes(q) || (lh.auditNote || '').toLowerCase().includes(q) ||
                          lh.detailItems.mdu.some(m => (m.nama || '').toLowerCase().includes(q)) || lh.detailItems.pasang.some(m => (m.nama || '').toLowerCase().includes(q)) ||
                          lh.detailItems.bongkar.some(m => (m.nama || '').toLowerCase().includes(q)) || lh.detailItems.retur.some(m => (m.nama || '').toLowerCase().includes(q))
                      );
                      return matchPk || matchLh;
                  });
              }
          }

          if (auditFilterStatus === 'pending') myPks = myPks.filter(pk => !pk.statusCetak);
          if (auditFilterStatus === 'completed') myPks = myPks.filter(pk => pk.statusCetak);
          if (auditFilterStatus === 'issue') myPks = myPks.filter(pk => pk.lhs.some(lh => lh.auditNote));

          let spkHasIssue = false;
          const pksWithStats = myPks.map(pk => {
              let pkHasIssue = false;
              pk.lhs.forEach(lh => { if (lh.auditNote) { pkHasIssue = true; spkHasIssue = true; stats.totalIssue++; } });
              return { ...pk, hasIssue: pkHasIssue, lhCount: pk.lhs.length };
          });

          const spkTotalPk = pksWithStats.length; 
          const spkCompletedPk = pksWithStats.filter(p => p.statusCetak).length;
          const progress = spkTotalPk === 0 ? 0 : Math.round((spkCompletedPk / spkTotalPk) * 100);

          if(pksWithStats.length > 0) {
              stats.totalSpk++; stats.totalPk += spkTotalPk; stats.completedPk += spkCompletedPk; stats.pendingPk += (spkTotalPk - spkCompletedPk);
          }

          return {
              id: spkId, vendor: spk.Nama_Vendor || spk.vendor || '-', uraian: spk.Nama_SPK || spk.nama || '-',
              pks: pksWithStats, progress, spkTotalPk, spkCompletedPk, hasIssue: spkHasIssue,
              isVisible: (pksWithStats.length > 0 || (q === '' && auditFilterStatus === 'all'))
          };
      }).filter(spk => spk.isVisible);

      // =======================================================
      // 2. OLAH PK "GANTUNG" (BELUM DIMASUKKAN KE SPK)
      // =======================================================
      const unassignedRawPks = safePks.filter(pk => {
          const spkId = String(pk.spk_id || '').trim();
          // Cek: Apakah ID SPK-nya kosong, undefined, strip, atau ID SPK-nya tidak ada di database?
          return !spkId || spkId === '-' || spkId === 'undefined' || !validSpkIds.includes(spkId);
      });

      if (unassignedRawPks.length > 0) {
          let unassignedPks = unassignedRawPks.map(pk => {
              const pkId = String(pk.id).trim();
              const myLhs = safeLhs.filter(l => String(l.pk_id).trim() === pkId).map(lh => {
                  const d = lh.data || {};
                  const mdu = [...(d.materialMdu || d.material_mdu || []), ...(d.materialKonstruksi || d.material_konstruksi || [])];
                  const pasang = d.uraianPasang || d.jasaPasang || d.jasa_pasang || d.uraian_pasang || [];
                  const bongkar = d.uraianBongkar || d.jasaBongkar || d.jasa_bongkar || d.uraian_bongkar || [];
                  const retur = d.returBekas || d.retur || d.material_retur || d.uraianRetur || d.uraian_retur || [];

                  return {
                      id: lh.id || lh.id_lh || d.id_lh || '-',
                      tanggal: lh.tanggal_lh || d.tanggal_lh || lh.tanggal || '-',
                      uraian: lh.nama_pekerjaan_lh || d.nama_pekerjaan_lh || lh.uraian || 'Tanpa Uraian',
                      auditNote: lh.Audit_Note || lh.audit_note || lh['Audit Note'] || d.Audit_Note || d.audit_note || d['Audit Note'] || null,
                      detailItems: { mdu, pasang, bongkar, retur },
                      lokasi: lh.lokasi_lh || d.lokasi_lh || pk.lokasi || '-',
                      pengawas: lh.pengawas_lh || d.pengawas_lh || pk.pengawas || '-',
                      team: lh.team_lh || d.team_lh || pk.team || '-'
                  };
              });

              return { ...pk, id: pkId, nama: pk.nama || 'Tanpa Nama', lokasi: pk.lokasi || '-', statusCetak: pk.status_cetak === true || pk.status_cetak === 'Sudah', lhs: myLhs };
          });

          // Filter Pencarian PK Gantung
          const q = auditSearchTerm.toLowerCase();
          if (q) {
                unassignedPks = unassignedPks.filter(pk => {
                  // 1. Cek PK (Pakai pelindung || '' agar tidak error kalau kosong)
                  const matchPk = (pk.id || '').toLowerCase().includes(q) || 
                                  (pk.nama || '').toLowerCase().includes(q);
                  
                  // 2. Cek LH di dalamnya (Termasuk Uraian, ID, Audit Note, dan Material)
                  const matchLh = pk.lhs && pk.lhs.some(lh => 
                      (lh.id || '').toLowerCase().includes(q) || 
                      (lh.uraian || '').toLowerCase().includes(q) || // 🔥 INI PENCARIAN URAIANNYA (ANTI CRASH)
                      (lh.auditNote || '').toLowerCase().includes(q) ||
                      
                      // Pencarian sampai ke dalam Material!
                      (lh.detailItems?.mdu || []).some(m => (m.nama || '').toLowerCase().includes(q)) || 
                      (lh.detailItems?.pasang || []).some(m => (m.nama || '').toLowerCase().includes(q)) ||
                      (lh.detailItems?.bongkar || []).some(m => (m.nama || '').toLowerCase().includes(q)) || 
                      (lh.detailItems?.retur || []).some(m => (m.nama || '').toLowerCase().includes(q))
                  );
                  
                  return matchPk || matchLh;
              });
          }

          if (auditFilterStatus === 'pending') unassignedPks = unassignedPks.filter(pk => !pk.statusCetak);
          if (auditFilterStatus === 'completed') unassignedPks = unassignedPks.filter(pk => pk.statusCetak);
          if (auditFilterStatus === 'issue') unassignedPks = unassignedPks.filter(pk => pk.lhs.some(lh => lh.auditNote));

          let spkHasIssue = false;
          const pksWithStats = unassignedPks.map(pk => {
              let pkHasIssue = false;
              pk.lhs.forEach(lh => { if (lh.auditNote) { pkHasIssue = true; spkHasIssue = true; stats.totalIssue++; } });
              return { ...pk, hasIssue: pkHasIssue, lhCount: pk.lhs.length };
          });

          if (pksWithStats.length > 0) {
              const spkTotalPk = pksWithStats.length; 
              const spkCompletedPk = pksWithStats.filter(p => p.statusCetak).length;
              const progress = spkTotalPk === 0 ? 0 : Math.round((spkCompletedPk / spkTotalPk) * 100);

              stats.totalPk += spkTotalPk; 
              stats.completedPk += spkCompletedPk; 
              stats.pendingPk += (spkTotalPk - spkCompletedPk);

              // TAMBAHKAN VIRTUAL SPK INI KE POSISI PALING ATAS (UNSHIFT)
              filteredSpks.unshift({
                  id: '⚠️ PK BELUM MASUK SPK',
                  vendor: 'Menunggu Alokasi / Tarik ke SPK',
                  uraian: 'Kumpulan Pekerjaan yang Belum Terpetakan ke dalam SPK Manapun',
                  pks: pksWithStats, progress, spkTotalPk, spkCompletedPk, hasIssue: spkHasIssue,
                  isVisible: true
              });
          }
      }

      stats.progressGlobal = stats.totalPk === 0 ? 0 : Math.round((stats.completedPk / stats.totalPk) * 100);
      return { filteredSpks, stats };
  }, [spks, pks, lhs, auditSearchTerm, auditFilterStatus]);
      
      
      // --- 4. FORM LOGIC & FILTER STATES ---
      const defaultLhForm = {
        id_lh: '',
        nama_pekerjaan_lh: '',
        lokasi_lh: '',
        penyulang_lh: '', 
        ulp_lh: '',
        jenis_pekerjaan_lh: '',
        jenis_jaringan_lh: 'SUTM',
        tanggal_lh: '',
        pengawas_lh: '',
        team_lh: '',
        jumlah_tenaga_lh: '',
        // 🔥 TAMBAHAN BARU: Memori Checkbox di LH
        butuh_c3: false, 
        butuh_c7: false,
        // Tabel existing
        materialMdu: [{ id: 1, nama: '', catatan: '', satuan: '', jumlah: '' }],
        uraianPasang: [{ id: 1, nama: '', catatan: '', satuan: '', pln: '', pemb: '', jumlah: '' }],
        uraianBongkar: [{ id: 1, nama: '', catatan: '', satuan: '', jumlah: '' }],
        returBaru: [{ id: 1, nama: '', catatan: '', satuan: '', jumlah: '' }],
        returBekas: [{ id: 1, nama: '', catatan: '', satuan: '', jumlah: '' }]
      };

      const [newPkForm, setNewPkForm] = useState({ 
        // 🔥 Form PK jadi bersih, hanya untuk Bungkus SPK!
        id: '', nama: '', jenis_pekerjaan: '', jenis_jaringan: '', ulp: '', vendor: 'PT. NANDA NIRWANA ELEKTRIK', 
        tanggal: '', nominal: '', nominalFormatted: ''
      });

      const [lhFormData, setLhFormData] = useState(defaultLhForm);
      window.__masterDb = masterDatabase;   // dipakai kolom nama material (sugesti ringan)

      {/* --- KOMPONEN DATALIST SMART AUTOCOMPLETE (PATCH FINAL EXCEL 3) --- */}
      const DataLists = () => (
              <>
                <datalist id="list-material">
                  {masterDatabase.filter(m => ['MDU', 'MATERIAL'].includes(String(m.Tipe).toUpperCase())).map((m, i) => (
                    <option key={`mat-${i}`} value={m.Nama_Item}>{m.ID_Item}</option>
                  ))}
                </datalist>
                <datalist id="list-jasa">
                  {masterDatabase.filter(m => ['PASANG', 'BONGKAR', 'MATERIAL'].includes(String(m.Tipe).toUpperCase())).map((m, i) => (
                    <option key={`jas-${i}`} value={m.Nama_Item}>{m.ID_Item}</option>
                  ))}
                </datalist>
              </>
            );

      // --- FUNGSI UPLOAD VERIFIKASI (POINT B-C) ---
    
      const handleUploadCode = (e, lhId, type) => {
        // DINONAKTIFKAN: unggah dokumen kini lewat menu Pusat verifikasi (lhUnggahDokumen: cek peran, alur audit, tipe, ukuran, dan verifikasi tersimpan).
        showToast('Gunakan Pusat verifikasi', 'Unggah dokumen Code 3, Code 7, dan AGO dilakukan dari menu Pusat verifikasi.', 'error');
        return;
        const file = e.target.files[0];
        if (!file) return;
        showToast('Proses...', `Mengunggah file verifikasi ${type.toUpperCase()}...`, 'info');
        
        const reader = new FileReader();
        reader.onloadend = () => {
            if (typeof google !== 'undefined') {
                google.script.run.withSuccessHandler((res) => {
                    // 🔥 SEKARANG APLIKASI AKAN JUJUR KALAU ADA ERROR
                    if (res.status === 'success') {
                        showToast('Sukses', res.message, 'success');
                        setLhs(prevLhs => {
                            return prevLhs.map(lh => {
                                if (lh.id === lhId || lh.id_lh === lhId) {
                                    const newData = { ...lh.data, [type]: true, [`file_${type}`]: 'Tersimpan' };
                                    return { ...lh, [type]: true, data: newData };
                                }
                                return lh;
                            });
                        });
                    } else {
                        // Kalau Excel gagal nyimpan, muncul notif Merah!
                        showToast('Gagal', res.message, 'error'); 
                    }
                }).uploadCodeVerification(reader.result, `${type.toUpperCase()}_${lhId}_${file.name}`, lhId, type);
            }
        };
        reader.readAsDataURL(file);
    };

      const [editingPkId, setEditingPkId] = useState(null); 

      const [filterTanggal, setFilterTanggal] = useState('');
      const [filterPengawas, setFilterPengawas] = useState('');
      const [filterPekerjaan, setFilterPekerjaan] = useState('');

      // --- 5. INITIAL DATA LOAD ---
      useEffect(() => {
              const bootEl = document.getElementById('boot-loading');
              if (bootEl) {
                setTimeout(() => {
                  bootEl.classList.add('hide');
                  setTimeout(() => bootEl.remove(), 500);
                }, 300);
              }
            }, []);
            
      useEffect(() => {
        // Saat aplikasi pertama dimuat, kita tidak menarik semua data. 
        // Cukup matikan loading agar user bisa langsung melihat halaman login.
        setIsFetchingData(false);
      }, []);

      // FUNGSI RATAKANAN: Parser Super Cepat di sisi Client

      const parseOptimizedData = (sheetData) => {
        if (!sheetData || !sheetData.headers || !sheetData.rows) return [];
        return sheetData.rows.map(row => {
          let obj = { _raw: row }; // Simpan data mentah agar bisa baca Kolom E, F, G bebas hambatan
          sheetData.headers.forEach((header, index) => {
            if (header) obj[String(header).trim()] = row[index];
          });
          return obj;
        });
      };

      // FUNGSI LOAD DATA UTAMA (Tahan Banting Ekstrem & Anti Crash)
      // opsi { senyap: true } = tanpa notifikasi sukses (dipakai menu yang sedang menampilkan pesan galat penting, supaya pesan itu tidak tertimpa)
      const fetchMainAppData = (opsi) => {
        setIsFetchingData(true); 
        
        if (typeof google !== 'undefined') {
          google.script.run.withSuccessHandler((res) => {
            try {
              if (res && res.status === 'success') {
                if (!res.data) throw new Error("Data dari server kosong.");

                // 1. Rakit data mentah dari GAS
                const rawSpks = parseOptimizedData(res.data.spks);
                const rawPks = parseOptimizedData(res.data.pks);
                const rawLhs = parseOptimizedData(res.data.lhs);
                const rawMasterDb = parseOptimizedData(res.data.masterDb);
                if (window.Convert) window.Convert.set(res.data.convert);   // jembatan nama (tabel Convert) untuk semua menu
                const rawTtd = parseOptimizedData(res.data.ttd);
                const rawRabs = parseOptimizedData(res.data.rabs || {headers:[], rows:[]}); 

                // 🔥🔥🔥 2. MAPPING DATA SPK (DI SINI KUTUKANNYA KITA HANCURKAN!)
                const mappedSpks = rawSpks.map(s => ({
                  id: s.ID_SPK, 
                  nama: s.Nama_SPK,
                  pos_anggaran: s.Pos_Anggaran || s.pos_anggaran || '',
                  nominal_total: Number(String(s.Nominal_Total).replace(/[^0-9]/g, "")) || 0, 
                  nominal_terpakai: Number(String(s.Nominal_Terpakai).replace(/[^0-9]/g, "")) || 0, 
                  status: s.Status,
                  tanggal: s.Tgl_Terbit || '',
                  exp: s.Tgl_Berakhir || '',
                  vendor: s.Nama_Vendor || s.Vendor || '', // <--- PASTI NGAMBIL "kertas"
                  ulp_wilayah: s.ULP_Wilayah || ''         // <--- PASTI NGAMBIL "ULP Denpasar"
                }));
                
                // 3. Mapping Data PK 
                const mappedPks = rawPks.map(p => ({
                  id: p.ID_PK, 
                  spk_id: p.ID_SPK || null, 
                  nama: p.Nama_Pekerjaan, 
                  jenis_pekerjaan: p.Jenis_Pekerjaan, 
                  penyulang: p.Penyulang, 
                  vendor: p.Vendor, 
                  pengawas: p.Pengawas_Vendor || p.Pengawas || '', 
                  team: p.Nama_Team || p.Team || '', 
                  jumlah_tenaga: p.Jumlah_Tenaga || '', 
                  ulp: p.ULP || '',
                  tanggal: p.Tanggal, 
                  nominal: Number(String(p.Nominal).replace(/[^0-9]/g, "")) || 0, 
                  code3: ['TRUE', 'BENAR'].includes(String(p.Code_3 || p.Code3).trim().toUpperCase()), 
                  code7: ['TRUE', 'BENAR'].includes(String(p.Code_7 || p.Code7).trim().toUpperCase()),
                  ago: ['TRUE', 'BENAR'].includes(String(p.AGO).trim().toUpperCase()),
                  butuh_c3: ['TRUE', 'BENAR'].includes(String(p.Butuh_C3 || p.ButuhC3).trim().toUpperCase()),
                  butuh_c7: ['TRUE', 'BENAR'].includes(String(p.Butuh_C7 || p.ButuhC7).trim().toUpperCase()),
                  lokasi: p.Lokasi || "",
                  sumber_id: p.ID_Sumber || ""
                }));
                

              // 4. Mapping Data LH (BYPASS LANGSUNG KE URUTAN KOLOM EXCEL)
              const mappedLhs = rawLhs.map(l => {
                let parsedData = {}; 
                try { if(l.Data_JSON) parsedData = JSON.parse(l.Data_JSON); } catch(e) {}
                
                // 🔥 AMBIL PAKSA DARI INDEX ARRAY (_raw) AGAR TIDAK SALAH BACA NAMA KOLOM
                // Index 11 = Kolom L (Code3), Index 12 = Kolom M (Code7), Index 13 = Kolom N (AGO)
                const file3 = (l._raw && l._raw[11]) ? l._raw[11] : l.File_Code3;
                const file7 = (l._raw && l._raw[12]) ? l._raw[12] : l.File_Code7;
                const fileAgo = (l._raw && l._raw[13]) ? l._raw[13] : l.File_AGO;

                return { 
                  id: l.ID_LH, 
                  pk_id: l.ID_PK, 
                  tanggal: l.Tanggal, 
                  uraian: l.Uraian, 
                  fotoUrl: l.Foto_URL, 
                  is_rab_created: String(l.Is_RAB_Created).toUpperCase() === 'TRUE', 
                  data: parsedData,
                  audit_note: l.Audit_Note,
                  audit_status: String(l.Audit_Status || '').trim(), audit_oleh: String(l.Audit_Oleh || '').trim(), audit_tgl: String(l.Audit_Tgl || '').trim(),
                  dibuat_oleh: String(l.Dibuat_Oleh || '').trim(), dibuat_tgl: String(l.Dibuat_Tgl || '').trim(), diubah_oleh: String(l.Diubah_Oleh || '').trim(), diubah_tgl: String(l.Diubah_Tgl || '').trim(),

                  code3: String(l.Code3).toUpperCase() === 'TRUE' || l.Code3 === true,
                  code7: String(l.Code7).toUpperCase() === 'TRUE' || l.Code7 === true,
                  ago: String(l.AGO).toUpperCase() === 'TRUE' || l.AGO === true,
                  
                  // 🎯 KITA SIMPAN DENGAN NAMA YANG RAPI
                  File_Code3: file3 || "", 
                  File_Code7: file7 || "",
                  File_AGO: fileAgo || ""
                };
              });


                // 5. Mapping RAB
                const parseSheetNum = (val) => {
                    if (!val) return 0;
                    let str = String(val).replace(/[^0-9,-]/g, ''); 
                    if (str.includes(',')) {
                        str = str.replace(/\./g, '').replace(',', '.');
                    } else {
                        str = str.replace(/\./g, '');
                    }
                    return parseFloat(str) || 0;
                };

                const mappedRabs = rawRabs.map(r => ({
                    id: r._raw[0],
                    tanggal: r._raw[1],
                    pk_id: r._raw[2],
                    nama: r._raw[3],
                    vendor: r._raw[4],
                    ref_lh: r._raw[5],
                    total_material: parseSheetNum(r._raw[6]), 
                    total_jasa: parseSheetNum(r._raw[7]),     
                    grand_total: parseSheetNum(r._raw[8]),
                    pengawas: r._raw[9] || '',
                    team: r._raw[10] || '',
                    jml_orang: Number(r._raw[11]) || 0,
                    jasa_harian: parseSheetNum(r._raw[12]),
                    transport: parseSheetNum(r._raw[13]),
                    total_upah: parseSheetNum(r._raw[14])
                }));
                
                setRabs(mappedRabs.reverse());
                setSpks(mappedSpks.reverse());
                setPks(mappedPks.reverse());
                setLhs(mappedLhs.reverse());
                setMasterDatabase(rawMasterDb);
                setDataTtd(rawTtd);
                
                setIsFetchingData(false); 
                if (!(opsi && opsi.senyap === true)) showToast('Sinkronisasi Selesai', `Data berhasil ditarik.`, 'success');
              } else {
                setIsFetchingData(false); 
                showToast('Error Server', res?.message || "Respon server tidak valid", 'error');
              }
            } catch (err) {
              console.error("CRITICAL ERROR PARSING:", err);
              setIsFetchingData(false);
              showToast('Sistem Crash', String(err.message), 'error'); 
            }
          }).withFailureHandler((err) => {
              setIsFetchingData(false); 
              showToast('Error Koneksi', 'Waktu habis / koneksi terputus.', 'error');
          }).getAppData();
        } else {
          setTimeout(() => { setIsFetchingData(false); }, 1000);
        }
      };


      // --- 6. FILTER DATA ---
      // =========================================================================
      // 1. STATE DASAR & SETUP
      // =========================================================================
      const [currentPage, setCurrentPage] = useState(1);
      const [currentPageSpk, setCurrentPageSpk] = useState(1);
      const rowsPerPage = 10;
      const managePkLhs = React.useMemo(() => managePkOpen ? (lhs || []).filter(lh => String(lh.pk_id).trim() === String(managePkOpen.id).trim()) : [], [lhs, managePkOpen && managePkOpen.id]);
      // jumlah kartu LH yang digambar di Kelola PK (bertahap supaya PK dengan ratusan LH tetap ringan)
      const [lhLimit, setLhLimit] = useState(40);
      useEffect(() => { setLhLimit(40); }, [managePkOpen && managePkOpen.id, filterLhNama, filterLhPengawas, filterLhTeam, filterLhTanggal]);

      const [searchSpk, setSearchSpk] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [showFilterMenu, setShowFilterMenu] = useState(false);

      // =========================================================================
      // 2. LOGIKA UNTUK TABEL PK (Filter & Paginasi)
      // =========================================================================

      // 🔥 1. KITA BERSIHKAN TOTAL PENGHALANGNYA DI SINI!
      const pendingPKs = (pks || []).filter(pk => {
          return pk.spk_id === null || pk.spk_id === "";
      });

      // === 0. MESIN BACA HARGA (Taruh di luar filter agar tidak lag/lemot) ===
      const parseAkurat = (val) => {
          if (!val) return 0;
          if (typeof val === 'number') return val;
          let s = String(val).trim().replace(/[^0-9.,-]/g, '');
          if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
          else if (s.includes(',')) s = s.replace(/\,/g, '.'); 
          else if (s.includes('.')) {
              if (s.startsWith('0.')) return parseFloat(s) || 0; 
              const parts = s.split('.');
              if (parts.length > 2 || parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
          }
          return parseFloat(s) || 0;
      };

      const getPrices = (itemName) => {
          if (!itemName) return { mat: 0, jas: 0, bongkar: 0 };
          const found = window.masterFind(typeof masterDatabase !== 'undefined' ? masterDatabase : [], itemName);
          if (!found) return { mat: 0, jas: 0, bongkar: 0 };
          return { 
              mat: parseAkurat(found.Harga_Material || (found._raw && found._raw[4]) || 0), 
              jas: parseAkurat(found.Harga_Jasa || (found._raw && found._raw[5]) || 0), 
              bongkar: parseAkurat(found.Harga_Bongkar || (found._raw && found._raw[6]) || 0) 
          };
      };

      // === 1. MESIN FILTER (METODE SATPAM / PENJAGAAN BERLAPIS) ===
      // LH dikelompokkan per PK sekali saja (bukan disaring ulang untuk tiap PK)
      const lhByPkQ = {};
      if (filterPekerjaan && filterPekerjaan.trim() !== '') (typeof lhs !== 'undefined' ? lhs : []).forEach(l => { const k = String(l.pk_id).trim(); (lhByPkQ[k] = lhByPkQ[k] || []).push(l); });
      const filteredPks = pendingPKs.filter(pk => {
        
        // 🛑 POS SATPAM 1: CEK TANGGAL
        if (filterTanggal && filterTanggal !== '') {
            if (pk.tanggal !== filterTanggal) return false;
        }

        // 🛑 POS SATPAM 2: PENCARIAN SAPU JAGAT (JURUS PANEN BRUTAL + TEMBUS LH)
        if (filterPekerjaan && filterPekerjaan.trim() !== '') {
            const q = filterPekerjaan.toLowerCase().trim();
            
            // Cocok bila SEMUA kata ada di data PK itu sendiri, atau SEMUA kata ada di satu LH yang sama
            // (kata yang tersebar di PK dan LH berbeda tidak dihitung, supaya hasil tidak membingungkan).
            let karungTeks = '';
            for (let key in pk) {
                if (pk[key] !== null && pk[key] !== undefined && typeof pk[key] !== 'object') {
                    karungTeks += String(pk[key]).toLowerCase() + ' ';
                }
            }
            const kataKetik = q.split(/\s+/).filter(k => k !== '');
            const diPk = kataKetik.every(k => karungTeks.includes(k));
            if (!diPk) {
                const lhTerkait = lhByPkQ[String(pk.id).trim()] || [];
                if (!lhTerkait.some(lh => window.lhMatch(lh, q))) return false;
            }
        }

        // 🛑 POS SATPAM 3: CEK ANGGARAN (DIAMANKAN TOTAL)
        const minA = Number(minAnggaran) || 0;
        const maxA = Number(maxAnggaran) || 500000000;
        
        if (minA > 0 || maxA < 500000000) {
            let totalLH = 0;
            // Gunakan pembersih spasi juga di sini agar perhitungan uang akurat
            const lhTerkait = typeof lhs !== 'undefined' ? lhs.filter(l => String(l.pk_id).trim() === String(pk.id).trim()) : [];
            if (lhTerkait.length > 0) {
                lhTerkait.forEach(lh => {
                    const d = lh.data || {};
                    let fMat = 0, fJas = 0;
                    (d.materialMdu || []).forEach(m => {
                        if (!m.nama) return;
                        const vol = parseAkurat(m.jumlah); const p = getPrices(m.nama);
                        fMat += ((p.mat > 0 ? p.mat : parseAkurat(m.harga)) * vol); fJas += (p.jas * vol);
                    });
                    (d.uraianPasang || []).forEach(m => {
                        if (!m.nama) return;
                        const vol = (parseAkurat(m.pln) + parseAkurat(m.pemb)) || parseAkurat(m.jumlah); const p = getPrices(m.nama);
                        fMat += (p.mat * vol); fJas += ((p.jas > 0 ? p.jas : parseAkurat(m.harga)) * vol);
                    });
                    (d.uraianBongkar || []).forEach(m => {
                        if (!m.nama) return;
                        const vol = parseAkurat(m.jumlah);
                        const p = getPrices(m.nama);
                        fJas += ((p.bongkar > 0 ? p.bongkar : parseAkurat(m.harga)) * vol);
                    });
                    const tot = fMat + fJas;
                    totalLH += (tot > 0 ? tot : parseAkurat(d.nominal_rab));
                });
            }

            const angkaBawaan = Number(String(pk.nominal || 0).replace(/[^0-9]/g, "")) || 0;
            const nominalAkhir = totalLH > 0 ? totalLH : angkaBawaan;
            if (nominalAkhir < minA || nominalAkhir > maxA) {
                return false;
            }
        }
        return true; 
      });

      // === 2. BARU DIPOTONG UNTUK HALAMAN PK (PAGINATION) ===
      const indexOfLastRow = currentPage * rowsPerPage;
      const indexOfFirstRow = indexOfLastRow - rowsPerPage;
      const currentTableData = filteredPks.slice(indexOfFirstRow, indexOfLastRow); 
      const totalPages = Math.ceil(filteredPks.length / rowsPerPage) || 1;


     // =========================================================================
      // 3. LOGIKA UNTUK TABEL SPK (Filter Sapu Jagat & Paginasi)
      // =========================================================================
      const filteredSpks = (spks || []).filter(spk => {
          // A. Filter Rentang Tanggal
          let matchDate = true;
          if (startDate || endDate) {
              const spkDate = new Date(spk.tanggal || spk.tanggal_exp || spk.Tgl_Terbit); 
              if (!isNaN(spkDate.getTime())) {
                  const start = startDate ? new Date(startDate) : new Date('1900-01-01');
                  const end = endDate ? new Date(endDate) : new Date('2100-01-01');
                  end.setHours(23, 59, 59, 999); 
                  matchDate = spkDate >= start && spkDate <= end;
              }
          }

          // B. Filter Pencarian Sapu Jagat SPK (Vendor, Pos Anggaran, ULP, dll)
          let matchText = true;
          if (searchSpk && searchSpk.trim() !== '') {
              const q = searchSpk.toLowerCase().trim();
              const kataKetik = q.split(' ').filter(k => k !== '');

              // 1. Sedot semua data di Induk SPK ke dalam satu karung!
              const karungTeksSpk = `${spk.id || spk.ID_SPK || ''} ${spk.nama || spk.Nama_SPK || ''} ${spk.vendor || spk.Nama_Vendor || ''} ${spk.pos_anggaran || spk.Pos_Anggaran || ''} ${spk.ulp_wilayah || spk.ULP_Wilayah || ''}`.toLowerCase();
              
              let isSpkMatch = true;
              for (let kata of kataKetik) {
                  if (!karungTeksSpk.includes(kata)) {
                      isSpkMatch = false;
                      break;
                  }
              }

              // 2. Jika Induk SPK tidak match, periksa ke dalam muatan PK-nya (X-Ray Scan)
              if (!isSpkMatch) {
                  const pksInThisSpk = (pks || []).filter(pk => pk.spk_id === (spk.id || spk.ID_SPK));
                  const matchInPk = pksInThisSpk.some(pk => {
                      const karungPk = `${pk.id || ''} ${pk.nama || ''} ${pk.vendor || ''}`.toLowerCase();
                      return kataKetik.every(kata => karungPk.includes(kata));
                  });
                  matchText = matchInPk; // Loloskan jika ternyata ketemu di dalam PK
              } else {
                  matchText = true; // Loloskan jika ketemu di Induk SPK
              }
          }

          return matchDate && matchText;
      });

      // Pisau Pemotong SPK (Anti-Bentrok)
      const safeSpkData = filteredSpks || [];
      const indexOfLastRowSpk = currentPageSpk * rowsPerPage;
      const indexOfFirstRowSpk = indexOfLastRowSpk - rowsPerPage;
      const currentTableDataSpk = safeSpkData.slice(indexOfFirstRowSpk, indexOfLastRowSpk);
      const totalPagesSpk = Math.ceil(safeSpkData.length / rowsPerPage) || 1;

      // =======================================================
      // --- 7. HELPERS ---
      const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
      const getProgressBarColor = (percent) => {
        if (percent >= 100) return 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]'; 
        if (percent >= 75) return 'bg-indigo-400 shadow-[0_0_8px_rgba(129,140,248,0.5)]'; 
        if (percent >= 35) return 'bg-amber-400 shadow-[0_0_8px_rgba(251,191,36,0.5)]'; 
        return 'bg-rose-400 shadow-[0_0_8px_rgba(251,113,133,0.5)]'; 
      };
      
      // Penghitung waktu notifikasi dibatalkan setiap ada notifikasi baru: dulu penghitung lama menutup notifikasi baru lebih cepat
      // (pesan galat bisa hilang sebelum terbaca). Pesan galat bertahan lebih lama.
      const toastTimer = React.useRef(null);
      const showToast = (title, message, type = 'success') => {
        setToast({ show: true, title, message, type });
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast({ show: false, title: '', message: '', type: 'success' }), type === 'error' ? 7000 : 4000);
      };


    // 🔥 MESIN PENGHITUNG NOMINAL PK OTOMATIS DARI LH 🔥
    const getNominalPKAkurat = (pk) => {
          // Ambil data LH
          const allLhs = typeof lhs !== 'undefined' ? lhs : (typeof pksData !== 'undefined' ? pksData.lhs : []);
          const lhTerkait = (allLhs || []).filter(l => String(l.pk_id).trim() === String(pk?.id).trim());

          if (lhTerkait.length === 0) return parseFloat(pk?.nominal || 0);

          let grandTotalAll = 0;

          // 1. Parser Angka Kebal Melset
          const parseAkurat = (val) => {
              if (!val) return 0;
              if (typeof val === 'number') return val;
              let s = String(val).trim().replace(/[^0-9.,-]/g, '');
              if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
              else if (s.includes(',')) s = s.replace(/\,/g, '.');
              else if (s.includes('.')) {
                  if (s.startsWith('0.')) return parseFloat(s) || 0;
                  const parts = s.split('.');
                  if (parts.length > 2 || parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
              }
              return parseFloat(s) || 0;
          };

          // 2. Tarik Harga Database
          const getPrices = (itemName) => {
              if (!itemName) return { m: 0, j: 0, b: 0 };
              const db = typeof masterDatabase !== 'undefined' ? masterDatabase : [];
              const f = window.masterFind(db, itemName);
              if (!f) return { m: 0, j: 0, b: 0 };
              return { 
                  m: parseAkurat(f.Harga_Material || f._raw?.[4]), 
                  j: parseAkurat(f.Harga_Jasa || f._raw?.[5]), 
                  b: parseAkurat(f.Harga_Bongkar || f._raw?.[6]) 
              };
          };

          // 3. Hitung Menggunakan Logika Yang Sama Persis Dengan Printer
          lhTerkait.forEach(lh => {
              const d = lh.data || {};
              let lhTotal = 0;

              const hitungRow = (item, type) => {
                  if (!item.nama) return 0;
                  const p = getPrices(item.nama);

                  let hMat = 0;
                  let hJas = 0;

                  if (type === 'MDU' || type === 'KONSTRUKSI') {
                      hMat = p.m > 0 ? p.m : parseAkurat(item.harga);
                      hJas = p.j > 0 ? p.j : 0;
                  } else if (type === 'PASANG') {
                      hMat = p.m > 0 ? p.m : 0;
                      hJas = p.j > 0 ? p.j : parseAkurat(item.harga);
                  } else if (type === 'BONGKAR') {
                      hMat = 0;
                      hJas = p.b > 0 ? p.b : parseAkurat(item.harga);
                  }

                  // 🔥 INI KUNCI SINKRONISASINYA: Hitung Volume = PLN + PEMB
                  const vPln = parseAkurat(item.pln);
                  const vPemb = parseAkurat(item.pemb);
                  let vJml = vPln + vPemb;
                  if (vJml === 0 && item.jumlah) vJml = parseAkurat(item.jumlah);

                  return (hMat * vJml) + (hJas * vJml);
              };

              (d.materialMdu || []).forEach(item => { lhTotal += hitungRow(item, 'MDU'); });
              (d.materialKonstruksi || []).forEach(item => { lhTotal += hitungRow(item, 'KONSTRUKSI'); });
              (d.uraianPasang || []).forEach(item => { lhTotal += hitungRow(item, 'PASANG'); });
              (d.uraianBongkar || []).forEach(item => { lhTotal += hitungRow(item, 'BONGKAR'); });

              // Fallback jika LH kosong tapi ada inputan nominal
              if (lhTotal === 0 && d.nominal_rab) {
                  lhTotal = parseAkurat(d.nominal_rab);
              }

              grandTotalAll += lhTotal;
          });

          // Murni tanpa PPN dan tanpa pembulatan
          return grandTotalAll > 0 ? grandTotalAll : parseFloat(pk?.nominal || 0);
      };

      // --- 8. CORE ACTIONS ---

      const handleLogin = async (e) => {
        e.preventDefault();
        if (isFetchingData) return;
        setIsFetchingData(true); // Aktifkan loading text di button

        if (typeof google !== 'undefined') {
          // Tembak verifikasi ke Backend GAS (Lebih aman dari bypass Client-Side)
          google.script.run.withSuccessHandler((res) => {
            if (res.status === 'success') {
              window.__auth = { t: res.token || '', as: '' };   // dipasang langsung: pemanggilan data berikutnya terjadi sebelum render ulang
              setIsLoggedIn(true);
              setCurrentUser({ name: res.user.name, role: res.user.role, realRole: res.user.role, realName: res.user.name, username: res.user.username || '', token: res.token || '', asUser: '' });
              showToast('Akses Diterima', `Selamat datang, ${res.user.name}. Menyiapkan Workspace...`, 'success');
              
              if (res.user.role === 'Super Admin') google.script.run.withSuccessHandler((r) => { if (r && r.status === 'success') setAkunList(r.users); }).adminDaftarAkun();
              // Jika login berhasil, baru kita narik data beratnya
              fetchMainAppData();
            } else {
              setIsFetchingData(false);
              showToast('Akses Ditolak', res.message || 'Username atau Password salah.', 'error');
            }
            }).withFailureHandler((err) => {
                     setIsFetchingData(false);
                     showToast('Error Server', 'Koneksi terputus saat memverifikasi login.', 'error');
                  }).verifyUserLogin(loginForm.username, loginForm.password);
        } else {
          // Fallback lokal jika di-run diluar environment GAS (misal: testing)
          setIsFetchingData(false);
        }
      };

      // Token sesi dibagikan ke penyambung identitas (22_UiKit) supaya setiap penulisan lama tercatat atas nama pelakunya.
      useEffect(() => { window.__auth = currentUser && currentUser.token ? { t: currentUser.token, as: currentUser.asUser || '' } : null; }, [currentUser]);

      const keluarSekarang = (paksa) => {
        const a = window.__auth;
        if (a && a.t && typeof google !== 'undefined' && !paksa) { try { google.script.run.withSuccessHandler(() => {}).withFailureHandler(() => {}).jejakKeluar({ t: a.t }); } catch (e) { /* pencatatan keluar bersifat usaha terbaik */ } }
        window.__auth = null;
        setIsLoggedIn(false);
        setCurrentUser(null);
        setCurrentView('dashboard');
        setLoginForm({ username: '', password: '' });
      };

      // Sesi di server sudah habis: pekerjaan yang baru saja dikirim TIDAK tersimpan. Beri tahu jelas, lalu keluar paksa.
      useEffect(() => {
        let sudah = false;
        const f = () => {
          if (sudah || !window.__auth) return; sudah = true;

          keluarSekarang(true);

          }

          let finalMaterial = 0;
          let finalJasa = 0;

          // 🔥 1. MESIN PEMBERSIH ANGKA TERBARU (ANTI DESIMAL HILANG)
          const parseManualNum = (v) => {
              if (!v) return 0;
              if (typeof v === 'number') return v;
              let s = String(v).trim();
              if (s.includes(',') && s.includes('.')) {
                  s = s.replace(/\./g, '').replace(',', '.');
              } else if (s.includes(',')) {
                  s = s.replace(',', '.');
              } else if (s.includes('.')) {
                  const parts = s.split('.');
                  if (parts[parts.length - 1].length === 3) {
                      s = s.replace(/\./g, '');
                  }
              }
              s = s.replace(/[^0-9.-]/g, '');
              return parseFloat(s) || 0;
          };

                  const prices = getPrices(m.nama);
                  const satMat = prices.mat > 0 ? prices.mat : parseManualNum(m.harga);
                  const satJas = prices.jas > 0 ? prices.jas : 0;
                  finalMaterial += (satMat * vol);
                  finalJasa += (satJas * vol);

    setNewPkForm, lhFormData, setLhFormData, handleUploadCode, editingPkId, setEditingPkId,
    filterTanggal, setFilterTanggal, filterPengawas, setFilterPengawas, filterPekerjaan, setFilterPekerjaan,
    parseOptimizedData, fetchMainAppData, currentPage, setCurrentPage, currentPageSpk, setCurrentPageSpk,
    rowsPerPage, managePkLhs, lhLimit, setLhLimit, searchSpk, setSearchSpk, startDate, setStartDate,
    endDate, setEndDate, showFilterMenu, setShowFilterMenu, pendingPKs, parseAkurat,
    getPrices, filteredPks, indexOfLastRow, indexOfFirstRow, currentTableData, totalPages,
    filteredSpks, safeSpkData, indexOfLastRowSpk, indexOfFirstRowSpk, currentTableDataSpk, totalPagesSpk,
    formatRupiah, getProgressBarColor, showToast, getNominalPKAkurat, handleLogin, handleLogout,
    handlePkClick, editingSpkId, setEditingSpkId, openNewSpk, openSpkDetail, handleDeleteSpk,
    handleCreateSpk, openEditSpk, handlePrintSpk, openNewPk, openEditPk, handleDeletePk,
    eksekusiHapus, handleCreatePk, toggleCodeStatus, processAllocation, handleRemovePkFromSpk, openLhInput,
    openEditLh, handleItemChangeAndSelect, checkLhTriggers, simpanLaporanHarian, handleDeleteLh, triggerMoveLhs,
    executeMoveLhs, handleArrayChange, handleItemSelect, addLhRow, removeLhRow, openPrintPreview,
    executePrint, toggleLhCheckbox, createRabCombined, handleUpdateUpah, simpanUpahRab, handleKunciDB,
    handleTerbitkanRAB
  };

  if (!isLoggedIn) return window.LoginScreen(ctx);

  const V = window.Views;
  const M = window.Modals;

  return (
    <div className="min-h-screen bg-[#F7F8FC] flex font-sans text-slate-700 relative overflow-hidden">
<window.UI.Blocker />
{toast.show && (
            <div className="fixed bottom-6 right-6 z-[100] page-in">
              <div className={`flex items-start gap-3 bg-white pl-3 pr-5 py-3 rounded-xl shadow-lg border border-slate-200 min-w-[280px] max-w-[380px] border-l-4 ${toast.type === 'error' ? 'border-l-rose-500' : toast.type === 'info' ? 'border-l-sky-500' : 'border-l-emerald-500'}`}>
                <i className={`mt-0.5 text-[15px] ${toast.type === 'error' ? 'fa-solid fa-circle-exclamation text-rose-500' : toast.type === 'info' ? 'fa-solid fa-circle-info text-sky-500' : 'fa-solid fa-circle-check text-emerald-500'}`}></i>
                <div className="flex-1 min-w-0">
                  <h4 className="text-[13px] font-semibold text-slate-800">{toast.title}</h4>
                  <p className="text-[12px] text-slate-500 leading-snug">{toast.message}</p>
                </div>
              </div>
            </div>
          )}

      {/* === MODAL === */}
      {M.Pk(ctx)}
      {M.Spk(ctx)}
      {M.KelolaPk(ctx)}
      {M.InputLh(ctx)}
      {M.CetakLh(ctx)}
      {M.CetakRab(ctx)}

      {/* === SIDEBAR === */}
      {window.Sidebar(ctx)}

      {/* === MAIN CONTENT AREA === */}
      <div className="flex-1 flex flex-col h-screen overflow-hidden relative no-print">
              <header className="bg-[#F7F8FC] px-4 lg:px-5 h-10 flex justify-between items-center z-10 sticky top-0 shrink-0 no-print">
                {(() => {
                  const T = {
                    dashboard: ['Operasional', 'Dashboard'], monitor_pk: ['Operasional', 'Antrean PK'],
                    spk_list: ['Operasional', 'Ruangan SPK'], spk_detail: ['Operasional', 'Detail SPK'],
                    arsip_rab: ['Keuangan', 'Laporan dan RAB'], ktk: ['Keuangan', 'KTK'], log_harian: ['Operasional', 'Log harian'],
                    verifikasi: ['Kontrol', 'Pusat verifikasi'], arsip_dokumen: ['Kontrol', 'Arsip Code 3 dan 7'],
                    radar_audit: ['Kontrol', 'Radar audit'], riwayat: ['Kontrol', 'Riwayat aktivitas'], pengelolaan: ['Kontrol', 'Pengelolaan']
                  }[currentView] || ['', 'Manajemen SPK'];
                  return (
                    <div className="text-[13px] text-[#6B665E] flex items-center min-w-0">
                      {T[0] && <><span>{T[0]}</span><span className="mx-2 text-[#B8B2A6]">/</span></>}
                      <span className="text-[#23211E] truncate">{T[1]}</span>
                    </div>
                  );
                })()}

                <div className="flex items-center gap-4">
                  {/* ID pengguna yang sedang bekerja; saat Super Admin bertindak sebagai akun lain, kedua ID tampil. */}
                  {currentUser && (currentUser.username || currentUser.asUser) && (
                    <span data-testid="id-pengguna" className="text-[12px] text-[#6B665E] hidden md:inline" title="ID akun yang tercatat pada setiap pekerjaan">
                      ID {currentUser.asUser || currentUser.username}{currentUser.asUser && currentUser.username && currentUser.asUser !== currentUser.username ? ' (login ' + currentUser.username + ')' : ''}
                    </span>
                  )}
                  {/* SINKRON DATABASE: titik hijau = Master_Data sudah termuat */}
                  <button
                    onClick={() => {
                      setIsFetchingData(true);
                      if (typeof fetchMainAppData === 'function') {
                        fetchMainAppData();
                      } else {
                        setTimeout(() => { setIsFetchingData(false); showToast('Sinkronisasi selesai', 'Data lokal disegarkan.', 'success'); }, 800);
                      }
                    }}
                    disabled={isFetchingData}
                    title={(masterDatabase || []).length > 0 ? 'Database terhubung' : 'Database belum tersinkron'}
                    className={`flex items-center gap-2 text-[13px] ${isFetchingData ? 'text-slate-400 cursor-not-allowed' : 'text-[#3A62B0] hover:underline'}`}>
                    <span className={`w-[7px] h-[7px] rounded-full ${(masterDatabase || []).length > 0 ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                    <i className={`fa-solid fa-rotate-right text-[11px] ${isFetchingData ? 'fa-spin' : ''}`}></i>
                    {isFetchingData ? 'Menyinkronkan...' : 'Sinkronkan data'}
                  </button>
                  {/* SUPER ADMIN: masuk sebagai siapa saja (hanya akun yang login asli sebagai Super Admin) */}
                  {currentUser?.realRole === 'Super Admin' && (() => {
                    const list = akunList.length ? akunList : [{ name: currentUser.realName, role: 'Super Admin' }];
                    const val = currentUser.asUser || '';   // ID akun (Username) yang sedang dipakai; kosong = diri sendiri
                    return (
                      <label className="flex items-center gap-2 text-[12px] text-[#6B665E]" title="Lihat dan kerjakan aplikasi sebagai pengguna lain">
                        <span className="hidden lg:inline">Masuk sebagai</span>
                        <select value={val} onFocus={() => { if (!akunList.length && typeof google !== 'undefined') google.script.run.withSuccessHandler((r) => { if (r && r.status === 'success') setAkunList(r.users); }).adminDaftarAkun(); }}
                          onChange={(e) => {
                            const v = e.target.value;
                            const u = akunList.filter((x) => x.username === v)[0];
                            if (!v || !u) setCurrentUser({ ...currentUser, name: currentUser.realName, role: 'Super Admin', asUser: '' });
                            else setCurrentUser({ ...currentUser, name: u.name, role: u.role, asUser: u.username });
                            setCurrentView('dashboard');
                            showToast('Mode akses', u ? 'Sekarang sebagai ' + u.name + ' · ' + u.role : 'Kembali sebagai Super Admin.', 'success');
                          }}
                          className={`h-7 px-2 rounded-md border bg-white outline-none ${val ? 'border-[#E11D48] text-[#E11D48]' : 'border-[#D9DDE9] text-[#23211E]'}`}>
                          <option value="">Diri sendiri (Super Admin)</option>
                          {akunList.filter((u) => u.username).map((u, i) => <option key={i} value={u.username}>{u.name} · {u.role}</option>)}
                        </select>
                      </label>
                    );
                  })()}
                  {(() => {
                    const h = new Date().getHours();
                    const sapa = h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
                    const nama = String(currentUser?.name || '').trim().split(/\s+/)[0] || '';
                    return (
                      <div className="flex items-center gap-3">
                        <span className="text-[13px] text-[#6B665E] hidden md:inline">{sapa}{nama ? ', ' + nama : ''}</span>
                        <div className="w-7 h-7 rounded-full bg-[#E3E8F3] text-[#3A62B0] font-medium text-[13px] flex items-center justify-center">{(nama || 'N').charAt(0).toUpperCase()}</div>
                      </div>
                    );
                  })()}
                </div>
              </header>

        <main className="flex-1 overflow-auto px-4 lg:px-5 pt-1 pb-8 relative custom-scrollbar">
          <div className="w-full page-in" key={currentView}>
            {currentView === 'dashboard'     && V.Dashboard(ctx)}
            {currentView === 'ktk'           && V.Ktk(ctx)}
            {currentView === 'log_harian'    && V.LogHarian(ctx)}
            {currentView === 'monitor_pk'    && V.AntreanPK(ctx)}
            {currentView === 'spk_list'      && V.SpkList(ctx)}
            {currentView === 'radar_audit'   && V.RadarAudit(ctx)}
            {currentView === 'arsip_dokumen' && V.ArsipDokumen(ctx)}
            {currentView === 'spk_detail'    && V.SpkDetail(ctx)}
            {M.CetakSpk(ctx)}
            {currentView === 'verifikasi'    && V.Verifikasi(ctx)}
            {currentView === 'arsip_rab'     && V.ArsipRab(ctx)}
            {currentView === 'riwayat'       && V.Riwayat && V.Riwayat(ctx)}
            {currentView === 'pengelolaan'   && V.Pengelolaan && V.Pengelolaan(ctx)}
          </div>
        </main>
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
