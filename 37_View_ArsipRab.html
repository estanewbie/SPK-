<script type="text/babel">
// Menu: Laporan & RAB (arsip_rab)
window.Views.ArsipRab = (ctx) => <ArsipRabPage ctx={ctx} />;

// Komponen: daftar baris dibatasi (ratusan baris sekaligus), tombol di bawah tabel menambah 100 baris lagi.
function ArsipRabPage({ ctx }) {
  const [limit, setLimit] = React.useState(100);
  const {
    filterEndDate, filterStartDate, globalTransport, globalUpah, lhs, masterDatabase,
    pks, setFilterEndDate, setFilterStartDate, setGlobalTransport, setGlobalUpah
  } = ctx;
  return (
(() => {
    
                  // === 1. MESIN BACA HARGA (RADAR DATABASE) ===
                  const parseAkurat = (val) => {
                      if (!val) return 0;
                      if (typeof val === 'number') return val;
                      let s = String(val).trim().replace(/[^0-9.,-]/g, '');
                      if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
                      else if (s.includes(',')) s = s.replace(/\,/g, '.'); 
                      else if (s.includes('.')) {
                          if (s.startsWith('0.')) return parseFloat(s) || 0; 
                          const parts = s.split('.');
                          if (parts.length > 2 || parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
                      }
                      return parseFloat(s) || 0;
                  };

                  const getPrices = (itemName) => {
                      if (!itemName) return { mat: 0, jas: 0, bongkar: 0 };
                      const found = window.masterFind(typeof masterDatabase !== 'undefined' ? masterDatabase : [], itemName);
                      if (!found) return { mat: 0, jas: 0, bongkar: 0 };
                      return { 
                          mat: parseAkurat(found.Harga_Material || (found._raw && found._raw[4]) || 0), 
                          jas: parseAkurat(found.Harga_Jasa || (found._raw && found._raw[5]) || 0), 
                          bongkar: parseAkurat(found.Harga_Bongkar || (found._raw && found._raw[6]) || 0) 
                      };
                  };

                  // === 2. MESIN PENYARING TANGGAL (MEMBACA DARI LH) ===
                  const filteredLhsUntukRab = typeof lhs !== 'undefined' ? lhs.filter(lh => {
                      if (!filterStartDate && !filterEndDate) return true;
                      
                      const tanggalLhData = lh.data?.tanggal_lh || lh.tanggal;
                      if (!tanggalLhData) return true;

                      const lhDate = new Date(tanggalLhData);
                      if (isNaN(lhDate)) return true;
                      lhDate.setHours(0,0,0,0);
                      const timeLh = lhDate.getTime();

                      const start = filterStartDate ? new Date(filterStartDate) : null;
                      if (start) start.setHours(0,0,0,0);
                      const timeStart = start ? start.getTime() : -Infinity;

                      const end = filterEndDate ? new Date(filterEndDate) : null;
                      if (end) end.setHours(23,59,59,999);
                      const timeEnd = end ? end.getTime() : Infinity;

                      return timeLh >= timeStart && timeLh <= timeEnd;
                  }) : [];

                  // === 3. MESIN PENGHITUNG REKAP GLOBAL ===
                  let sumTotalMaterial = 0;
                  let sumTotalJasa = 0;
                  let sumTotalOrang = 0;

                  // Persiapkan data lengkap untuk tabel (dihitung sekali jalan agar tidak lag)
                  const pkById = {}; (typeof pks !== 'undefined' ? pks : []).forEach(p => { pkById[String(p.id).trim()] = p; });
                  const tableDataRAB = filteredLhsUntukRab.map(lh => {
                      const pkTerkait = pkById[String(lh.pk_id).trim()] || {};
                      const d = lh.data || {};
                      
                      // Tarik Data
                      const tgl = d.tanggal_lh || lh.tanggal || '-';
                      const namaPekerjaanPK = pkTerkait.nama || 'Pekerjaan Belum Diset';
                      const pengawas = d.pengawas_lh || lh.pengawas || 'N/A';
                      const team = d.team_lh || lh.team || 'N/A';
                      const jmlOrang = Number(d.jumlah_pekerja_lh) || 0; // Pastikan form LH punya input jumlah_pekerja_lh
                      const ulp = d.ulp_lh || pkTerkait.ulp || '-';

                      // Hitung Material & Jasa
                      let subMat = 0, subJas = 0;
                      (d.materialMdu || []).forEach(m => {
                          if (!m.nama) return;
                          const vol = parseAkurat(m.jumlah); const p = getPrices(m.nama);
                          subMat += ((p.mat > 0 ? p.mat : parseAkurat(m.harga)) * vol); subJas += (p.jas * vol);
                      });
                      (d.uraianPasang || []).forEach(m => {
                          if (!m.nama) return;
                          const vol = (parseAkurat(m.pln) + parseAkurat(m.pemb)) || parseAkurat(m.jumlah); const p = getPrices(m.nama);
                          subMat += (p.mat * vol); subJas += ((p.jas > 0 ? p.jas : parseAkurat(m.harga)) * vol);
                      });
                      (d.uraianBongkar || []).forEach(m => {
                          if (!m.nama) return;
                          const vol = parseAkurat(m.jumlah); const p = getPrices(m.nama);
                          subJas += ((p.bongkar > 0 ? p.bongkar : parseAkurat(m.harga)) * vol);
                      });

                      // Tambah ke Rekap Global
                      sumTotalMaterial += subMat;
                      sumTotalJasa += subJas;
                      sumTotalOrang += jmlOrang;

                      return { lh, pkTerkait, tgl, namaPekerjaanPK, pengawas, team, jmlOrang, subMat, subJas, ulp };
                  });

                  const sumTotalBiayaPekerja = (sumTotalOrang * globalUpah) + (tableDataRAB.length * globalTransport);
                  const sumSisaJasa = sumTotalJasa - sumTotalBiayaPekerja;

                  return (
                      <div className="space-y-6 animate-in fade-in duration-500">
                          
                          <div className="mb-2">
                              <h2 className="text-xl font-bold text-slate-800"><i className="fa-solid fa-file-invoice-dollar text-indigo-500 mr-2"></i> Laporan Keuangan & Audit RAB</h2>
                              <p className="text-[13px] text-slate-500">Rekapitulasi biaya proyek berdasarkan data Laporan Harian (LH) riil dari lapangan.</p>
                          </div>

                          {/* SUMMARY CARDS KEUANGAN (Akumulasi Murni LH) */}
                          <div className="grid grid-cols-1 md:grid-cols-5 gap-4">
                              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-indigo-500">
                                  <p className="text-[10px] font-bold text-slate-500 uppercase">Dokumen LH Tervalidasi</p>
                                  <h3 className="text-xl font-bold text-slate-800 mt-1">{tableDataRAB.length}</h3>
                              </div>
                              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-cyan-500">
                                  <p className="text-[10px] font-bold text-slate-500 uppercase">Total Material RAB</p>
                                  <h3 className="text-lg font-bold text-slate-800 mt-1">Rp {sumTotalMaterial.toLocaleString('id-ID')}</h3>
                              </div>
                              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-amber-500">
                                  <p className="text-[10px] font-bold text-slate-500 uppercase">Total Jasa RAB</p>
                                  <h3 className="text-lg font-bold text-slate-800 mt-1">Rp {sumTotalJasa.toLocaleString('id-ID')}</h3>
                              </div>
                              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-rose-500">
                                  <p className="text-[10px] font-bold text-slate-500 uppercase">Total Biaya Pekerja</p>
                                  <h3 className="text-lg font-bold text-slate-800 mt-1">Rp {sumTotalBiayaPekerja.toLocaleString('id-ID')}</h3>
                              </div>
                              <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm border-l-4 border-l-emerald-500">
                                  <p className="text-[10px] font-bold text-slate-500 uppercase">Sisa Jasa (Margin)</p>
                                  <h3 className="text-lg font-bold text-emerald-600 mt-1">Rp {sumSisaJasa.toLocaleString('id-ID')}</h3>
                              </div>
                          </div>

                          {/* UI FILTER TANGGAL & PATOKAN GLOBAL */}
                          <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mt-2 flex flex-col xl:flex-row items-center justify-between gap-4">
                              <div>
                                  <h4 className="font-bold text-indigo-800 text-[13px]"><i className="fa-solid fa-gears mr-1"></i> Panel Kontrol Keuangan</h4>
                                  <p className="text-[11px] text-indigo-600">Filter rentang tanggal laporan atau atur patokan biaya operasional di sini.</p>
                              </div>
                              
                              <div className="flex flex-wrap md:flex-nowrap gap-4 items-end">
                                  <div className="flex items-end gap-3">
                                      <div>
                                          <label className="block text-[10px] font-bold text-indigo-700 uppercase mb-1">Mulai Tgl</label>
                                          <input type="date" value={filterStartDate} onChange={(e) => setFilterStartDate(e.target.value)} className="px-3 py-1.5 rounded border border-indigo-200 text-[13px] font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-300 bg-white shadow-sm cursor-pointer" />
                                      </div>
                                      <div className="pb-2 text-indigo-300 font-bold">-</div>
                                      <div>
                                          <label className="block text-[10px] font-bold text-indigo-700 uppercase mb-1">Sampai Tgl</label>
                                          <input type="date" value={filterEndDate} onChange={(e) => setFilterEndDate(e.target.value)} className="px-3 py-1.5 rounded border border-indigo-200 text-[13px] font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-300 bg-white shadow-sm cursor-pointer" />
                                      </div>
                                      {(filterStartDate || filterEndDate) && (
                                          <div className="pb-0.5">
                                              <button onClick={() => {setFilterStartDate(''); setFilterEndDate('');}} className="w-8 h-8 rounded border border-rose-200 bg-rose-50 text-rose-500 hover:bg-rose-500 hover:text-white flex items-center justify-center transition-colors shadow-sm" title="Reset Filter">
                                                  <i className="fa-solid fa-xmark"></i>
                                              </button>
                                          </div>
                                      )}
                                  </div>

                                  <div className="w-px h-8 bg-indigo-200 hidden md:block"></div>

                                  <div>
                                      <label className="block text-[10px] font-bold text-indigo-700 uppercase mb-1">Upah / Orang</label>
                                      <input type="number" value={globalUpah || ''} onChange={(e) => setGlobalUpah(Number(e.target.value))} className="px-3 py-1.5 rounded border border-indigo-200 text-[13px] w-28 font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-300" placeholder="Rp" />
                                  </div>
                                  <div>
                                      <label className="block text-[10px] font-bold text-indigo-700 uppercase mb-1">Transport / Team</label>
                                      <input type="number" value={globalTransport || ''} onChange={(e) => setGlobalTransport(Number(e.target.value))} className="px-3 py-1.5 rounded border border-indigo-200 text-[13px] w-28 font-bold text-indigo-900 outline-none focus:ring-2 focus:ring-indigo-300" placeholder="Rp" />
                                  </div>
                              </div>
                          </div>

                          {/* TABEL ARSIP (Menggunakan Data Murni LH) */}
                          <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                          <div className="overflow-x-auto">
                              <table className="w-full text-left border-collapse whitespace-nowrap">
                                  <thead className="bg-slate-50 border-b border-slate-200">
                                      <tr>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-slate-500">Tanggal LH</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-slate-500">Pekerjaan</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-slate-500">Detail Pelaksana</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-cyan-600 text-right bg-cyan-50/30">Subtotal Material</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-amber-600 text-right bg-amber-50/30">Subtotal Jasa</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-indigo-600 text-center bg-indigo-50/50">Jml Org</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-rose-500 text-right bg-indigo-50/50">Upah Auto</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-rose-500 text-right bg-indigo-50/50">Transport</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-rose-700 text-right bg-rose-50/50">Balance</th>
                                          <th className="px-4 py-3 text-[10px] uppercase font-bold text-slate-500 text-center">Aksi</th>
                                      </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100">
                                      {tableDataRAB.slice(0, limit).map((item, idx) => {
                                          const autoUpah = item.jmlOrang * globalUpah;
                                          const autoTransport = globalTransport;
                                          const totalDibayar = autoUpah + autoTransport;
                                          const laba = item.subJas - totalDibayar;

                                          return (
                                          <tr key={idx} className="hover:bg-slate-50/50 transition-colors">
                                              <td className="px-4 py-3 align-top">
                                                  <p className="text-[11px] font-bold text-slate-800">
                                                      {item.tgl !== '-' ? new Date(item.tgl).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-'}
                                                  </p>
                                              </td>
                                              <td className="px-4 py-3 align-top max-w-[280px]">
                                                  {/* 1. NAMA PK (Ukuran 8px, warna agak redup) */}
                                                  <p className="text-[8px] font-bold text-slate-500 uppercase leading-tight mb-0.5" title="Nama Pekerjaan PK Induk">
                                                      {item.namaPekerjaanPK}
                                                  </p>
                                                  
                                                  {/* 2. NAMA LH (Ukuran 10px, warna lebih gelap dan menonjol) */}
                                                  <p className="text-[10px] font-bold text-slate-800 leading-tight whitespace-normal uppercase">
                                                      {item.lh.data?.nama_pekerjaan_lh || item.lh.nama || 'NAMA PEKERJAAN LH BELUM DISET'}
                                                  </p>
                                                  <div className="flex items-center gap-2 mt-1.5">
                                                      <span className="text-[9px] font-mono text-indigo-500 bg-indigo-50 px-1.5 py-0.5 rounded border border-indigo-100">{item.pkTerkait.id || 'N/A'}</span>
                                                      <span className="text-[9px] text-slate-400">|</span>
                                                      <span className="text-[9px] font-mono text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded border border-emerald-100">{item.lh.id}</span>
                                                  </div>
                                              </td>
                                              <td className="px-4 py-3 align-top">
                                                  <div className="flex flex-col gap-1 text-[10px] text-slate-600">
                                                      <span className="flex items-center"><i className="fa-solid fa-user-tie w-4 text-slate-400"></i> {item.pengawas}</span>
                                                      <span className="flex items-center"><i className="fa-solid fa-users w-4 text-slate-400"></i> {item.team}</span>
                                                      <span className="flex items-center text-rose-500 mt-0.5"><i className="fa-solid fa-location-dot w-4 text-rose-400"></i> {item.ulp}</span>
                                                  </div>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-right bg-cyan-50/20">
                                                  <p className="text-[12px] font-bold text-cyan-700">Rp {item.subMat.toLocaleString('id-ID')}</p>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-right bg-amber-50/20 border-r border-slate-100">
                                                  <p className="text-[12px] font-bold text-amber-700">Rp {item.subJas.toLocaleString('id-ID')}</p>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-center bg-indigo-50/20">
                                                  <span className="text-[13px] font-bold text-indigo-700">{item.jmlOrang}</span> <span className="text-[9px] text-slate-500 uppercase">Org</span>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-right bg-indigo-50/20">
                                                  <p className="text-[12px] font-bold text-slate-700">Rp {autoUpah.toLocaleString('id-ID')}</p>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-right bg-indigo-50/20">
                                                  <p className="text-[12px] font-bold text-slate-700">Rp {autoTransport.toLocaleString('id-ID')}</p>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-right bg-rose-50/30 border-l border-rose-100">
                                                  <p className="text-[10px] font-bold text-rose-700 mt-0.5">
                                                      {laba >= 0 ? 'Biaya: -' : 'Biaya: +'}Rp {totalDibayar.toLocaleString('id-ID')}
                                                  </p>                                           
                                                  <p className={`text-[12px] font-bold ${laba >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                      {laba >= 0 ? 'Margin: +' : 'Margin: -'}Rp {Math.abs(laba).toLocaleString('id-ID')}
                                                  </p>
                                              </td>
                                              <td className="px-4 py-3 align-middle text-center">
                                                  {/* Sesuaikan fungsi simpanUpahRab ini dengan yang Bos butuhkan jika ada perubahan database */}
                                                  <button onClick={() => console.log("Simpan data LH:", item.lh.id)} className="px-3 py-1.5 bg-slate-800 text-white rounded text-[10px] font-bold hover:bg-slate-700 transition-colors shadow-sm">
                                                      <i className="fa-solid fa-lock mr-1"></i> Kunci Ke DB
                                                  </button>
                                              </td>
                                          </tr>
                                      )})}
                                      {tableDataRAB.length === 0 && (
                                          <tr><td colSpan="10" className="text-center py-10 text-slate-500 text-[13px]">
                                              {(filterStartDate || filterEndDate) ? 'Tidak ada Laporan Harian (LH) pada rentang tanggal tersebut.' : 'Belum ada data Laporan Harian (LH).'}
                                          </td></tr>
                                      )}
                                  </tbody>
                              </table>
                              {tableDataRAB.length > limit && <button onClick={() => setLimit(limit + 100)} className="w-full py-3 text-[12px] font-bold text-indigo-600 hover:bg-slate-50 border-t border-slate-100">Tampilkan 100 baris berikutnya ({tableDataRAB.length - limit} lagi)</button>}
                          </div>
                          </div>

                      </div>
                  );
              })()
  );
}
</script>
