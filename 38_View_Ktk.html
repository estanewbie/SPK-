                <button onClick={() => setShowOff(!showOff)} className="w-full flex items-center gap-3.5 px-5 h-[52px] text-left">
                  <i className={`fa-solid fa-chevron-right text-[10px] text-[#6B665E] transition-transform ${showOff ? 'rotate-90' : ''}`}></i>
                  <span className="flex-1 text-[#4A463F]">{[folded.length ? 'Paket tanpa volume, ' + folded.length : '', offIdx.length ? 'tidak dipakai, ' + offIdx.length : ''].filter(Boolean).join(' · ')}</span>
                  <span className="text-[12px] text-[#6B665E]">Dilipat otomatis. Buka bila perlu mengisi volume.</span>
                </button>
                {showOff && <div>
                  {folded.map((pi) => (<div key={pi} className="flex items-center gap-3 px-5 py-1.5 border-t border-[#EEF0F7]"><span className="flex-1 text-[#4A463F]">{short(doc.paket[pi].nama)}</span><span className="text-[12px] text-[#6B665E]">tanpa volume</span>
                    <UI.Btn kind="link" onClick={() => { setForceShow({ ...forceShow, [pi]: true }); setOpen({ ...open, [pi]: true }); setHideZero(false); }}>Isi volume</UI.Btn></div>))}
                  {offIdx.map((pi) => (<div key={pi} className="flex items-center gap-3 px-5 py-1.5 border-t border-[#EEF0F7]"><span className="flex-1 text-[#4A463F]">{short(doc.paket[pi].nama)}</span><span className="text-[12px] text-[#6B665E]">tidak dipakai</span>
                    <UI.Btn kind="link" onClick={() => { upd((d) => { d.paket[pi].dipakai = true; }); setOpen({ ...open, [pi]: true }); }}>Pakai</UI.Btn></div>))}
                </div>}
              </div>
            )}
          </section>

          <section className="flex flex-wrap gap-10 items-start justify-between pt-2">
            <div className="flex-1 basis-[300px] max-w-[460px]">
              <h2 className="text-[16px] leading-6 font-medium">Ringkasan nilai kontrak</h2>
              <p className="text-[#6B665E] mt-1.5">Dihitung dari volume dikali harga di {cnt} paket. Pembulatan hanya dilakukan di akhir, jadi angkanya sama dengan hitungan di Excel. Harga adalah snapshot dari daftar harga KHS saat paket diambil.</p>
            </div>
            <div className="flex-1 basis-[420px] max-w-[600px]">
              {[['Jumlah material', K.fmt2(T.vm)], ['Jumlah jasa', K.fmt2(T.vj)], ['Jumlah', K.fmt2(T.jum), true], ['DPP lain-lain (jumlah × 11/12)', K.fmt2(T.dpp)], ['PPN 12% (DPP lain-lain × 12%)', K.fmt2(T.ppn)], ['Jumlah ditambah PPN', K.fmt2(T.gross), true]].map(([a, b, bold]) => (
                <div key={a} className={`flex justify-between py-1.5 border-b border-[#ECE8E0] ${bold ? 'font-medium' : 'text-[#5A564F]'}`}><span>{a}</span><span className="num">{b}</span></div>))}
              <div className="flex justify-between items-baseline pt-3.5"><span className="text-[16px] font-medium">Dibulatkan</span><span className="text-[28px] leading-9 text-[#3A62B0] num">{K.fmtRp(T.bulat)},00</span></div>
            </div>
          </section>
        </>)}

        {/* panel detail material (muncul hanya saat diminta) */}
        <UI.Drawer open={drawer} onClose={() => setDrawer(false)} title="Detail material"
          footer={selOk && <div className="flex gap-2"><UI.Btn kind="danger" onClick={() => { upd((d) => { d.paket[sel.pi].items.splice(sel.ii, 1); }); setSel(null); setDrawer(false); }}>Hapus baris</UI.Btn><UI.Btn kind="primary" className="ml-auto" onClick={() => setDrawer(false)}>Selesai</UI.Btn></div>}>
          {!selOk && <div className="text-[#6B665E]">Baris tidak ditemukan.</div>}
          {selOk && (<div className="space-y-5">
            <div>
              <div className="text-[12px] text-[#6B665E] mb-1">Nama di kontrak</div>
              <NameCell withPokok value={selOk.nama} master={master} placeholder="Nama material" onCommit={(tx) => setField(sel.pi, sel.ii, 'nama', tx)} onPick={(en) => applyMaster(sel.pi, sel.ii, en)} className="w-full h-8 px-3 border border-[#D9DDE9] rounded-lg outline-none focus:border-[#3A62B0] font-medium" />
              <div className="flex gap-2 mt-2 items-center"><span className="text-[#6B665E]">Satuan</span><input value={selOk.sat} onChange={(e) => setField(sel.pi, sel.ii, 'sat', e.target.value)} className="w-20 h-8 px-2 border border-[#D9DDE9] rounded-md outline-none focus:border-[#3A62B0]" /></div>
            </div>
            {hasMaster && <UI.Status tone={m ? 'ok' : 'bad'}>{m ? 'Cocok dengan Master data' + (m.tipe ? ' (' + m.tipe + ')' : '') : 'Tidak ditemukan di Master data'}</UI.Status>}
            {suggestions.length > 0 && (<div>
              <div className="text-[12px] text-[#6B665E] mb-1.5">Nama Master data yang mirip</div>
              {suggestions.map((e) => <button key={e.id + e.nama} onClick={() => applyMaster(sel.pi, sel.ii, e)} className="block w-full text-left px-3 py-1.5 mb-1.5 border border-[#E6E9F2] rounded-lg leading-snug hover:border-[#3A62B0] hover:bg-[#F4F6FB]">{e.nama}</button>)}
            </div>)}
            {m && selOk.link && <div className="px-3 py-1.5 rounded-lg bg-[#EAF4EE] text-[#2D7A4E] leading-snug">Harga terhubung ke Master data. Kalau harga di Master data berubah, harga di sini ikut berubah otomatis.</div>}
            {m && !selOk.link && (
              <button onClick={() => applyMaster(sel.pi, sel.ii, m)} className="w-full px-3 py-1.5 rounded-lg border border-[#E9CF9A] bg-[#FFF8E8] text-[#7A4B00] text-left leading-snug">Harga diisi manual. Klik untuk menghubungkan ke Master data dan memakai harganya.</button>)}
            <div>
              <div className="text-[12px] text-[#6B665E] mb-1.5">Nilai lengkap (hingga 10 desimal)</div>
              <div className="grid grid-cols-2 gap-2">
                {[['Harga material', K.fmtFull(K.parseP(selOk.pm), 2)], ['Harga jasa', K.fmtFull(K.parseP(selOk.pj), 2)],
                  ['Nilai material', K.fmtFull(K.mul(K.parseP(selOk.pm), K.parseV(selOk.vol)), 2)], ['Nilai jasa', K.fmtFull(K.mul(K.parseP(selOk.pj), K.parseV(selOk.vol)), 2)]].map(([a, b]) => (
                  <div key={a} className="p-2.5 bg-[#F7F8FC] rounded-lg"><div className="text-[12px] text-[#6B665E]">{a}</div><div className="font-medium mt-0.5 break-all">{b}</div></div>))}
              </div>
              {m && <div className="mt-2 p-2.5 border border-[#E6E9F2] rounded-lg"><div className="text-[12px] text-[#6B665E] mb-1">Harga di Master data</div>
                <div className="flex justify-between"><span>Material</span><span className="num">{K.fmtFull(K.parseP(m.pm), 2)}</span></div>
                <div className="flex justify-between"><span>Jasa</span><span className="num">{K.fmtFull(K.parseP(m.pj), 2)}</span></div></div>}
            </div>
            <div>
              <div className="text-[12px] text-[#6B665E] mb-1.5">Ganti dari Master data</div>
              <DebInput value={q} onValue={setQ} delay={150} placeholder="Ketik nama material" className="w-full h-8 px-3 border border-[#D9DDE9] rounded-lg outline-none focus:border-[#3A62B0]" />
              {q.trim().length >= 2 && searchHits.length === 0 && <div className="mt-1.5 text-[#6B665E]">{hasMaster ? 'Tidak ada hasil.' : 'Master data belum termuat.'}</div>}
              {searchHits.map((e) => <button key={e.id + e.nama} onClick={() => { applyMaster(sel.pi, sel.ii, e); setQ(''); }} className="block w-full text-left px-3 py-1.5 mt-1.5 border border-[#E6E9F2] rounded-lg leading-snug hover:border-[#3A62B0] hover:bg-[#F4F6FB]">{e.nama}<span className="block text-[12px] text-[#6B665E]">{e.tipe} · {e.sat} · {K.fmt2(K.parseP(e.pm))} / {K.fmt2(K.parseP(e.pj))}</span></button>)}
            </div>
          </div>)}
        </UI.Drawer>

        {tplOpen && (
          <div className="fixed inset-0 z-[90] bg-[#23263A]/40 flex items-center justify-center p-4" onClick={() => setTplOpen(false)}>
            <div className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[85vh] flex flex-col" onClick={(e) => e.stopPropagation()}>
              <div className="px-6 pt-5 pb-3 border-b border-[#EEF0F7]"><h4 className="text-[16px] font-medium">Pilih paket yang dipakai kontrak ini</h4><p className="text-[#6B665E] mt-1">Centang paket dari template KTK {doc.jenis} yang memang dikerjakan di kontrak ini. Paket disalin dengan volume 0. Paket yang tidak dicentang tidak masuk ke kontrak.</p></div>
              <div className="px-6 py-2 flex items-center gap-4 border-b border-[#EEF0F7] bg-[#F9FAFD]">
                <button className="text-[#3A62B0] hover:underline" onClick={() => { const n = {}; (tpl || []).forEach((tp, i) => { if (!paketTab.some((p) => p.nama === tp.nama)) n[i] = true; }); setPilih(n); }}>Pilih semua</button>
                <button className="text-[#6B665E] hover:underline" onClick={() => setPilih({})}>Kosongkan pilihan</button>
                <span className="ml-auto text-[#6B665E]">{Object.keys(pilih).filter((k) => pilih[k]).length} dipilih</span>
              </div>
              <div className="overflow-y-auto flex-1">
                {!tpl && <div className="p-8 text-center text-[#6B665E]"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Memuat template...</div>}
                {tpl && tpl.map((tp, i) => { const ada = paketTab.some((p) => p.nama === tp.nama); const on = !!pilih[i]; return (
                  <label key={i} className={`flex items-center gap-3 px-6 py-2 border-b border-[#EEF0F7] cursor-pointer hover:bg-[#F9FAFD] ${on ? 'bg-[#F4F2FB]' : ''}`}>
                    <input type="checkbox" checked={on} onChange={() => setPilih({ ...pilih, [i]: !on })} />
                    <div className="flex-1 min-w-0"><div className="leading-snug">{short(tp.nama)}</div><div className="text-[12px] text-[#6B665E]">{tp.items.filter((x) => x.tipe === 'item').length} material{ada ? ' · sudah ada di kontrak' : ''}</div></div>
                  </label>); })}
              </div>
              <div className="px-6 py-3 flex justify-end gap-2 border-t border-[#EEF0F7]"><UI.Btn onClick={() => setTplOpen(false)}>Batal</UI.Btn><UI.Btn kind="primary" onClick={ambilTerpilih}>Tambahkan paket terpilih</UI.Btn></div>
            </div>
          </div>
        )}      </div>
    );
  }

  // ---------- Tab "Periksa LH": semua LH dalam rentang tanggal tanpa dikelompokkan per PK, cari material, centang, cetak RAB ----------
  // Hanya membaca data LH yang sudah ada di layar; tidak menyimpan apa pun. Cara hitung RAB sama dengan Cetak RAB di Kelola PK.
  const LP_MAT = [['materialMdu', 'Material utama'], ['uraianPasang', 'Material konstruksi'], ['uraianBongkar', 'Jasa / bongkar'], ['returBaru', 'Retur baru'], ['returBekas', 'Retur bekas']];
  const lpAngka = (val) => {
    if (!val) return 0; if (typeof val === 'number') return val;
    let s = String(val).trim().replace(/[^0-9.,-]/g, '');
    if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(/,/g, '.');
    else if (s.includes('.')) { if (s.startsWith('0.')) return parseFloat(s) || 0; const p = s.split('.'); if (p.length > 2 || p[p.length - 1].length === 3) s = s.replace(/\./g, ''); }
    return parseFloat(s) || 0;
  };
  const lpFmt = (n) => new Intl.NumberFormat('id-ID', { maximumFractionDigits: 3 }).format(n || 0);
  const lpRp = (n) => new Intl.NumberFormat('id-ID').format(Math.round(n || 0));
  const lpIso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const lpTgl = (t) => t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : 'tanpa tanggal';
  const lpCache = new WeakMap();   // baris material per LH dihitung sekali saja agar mengetik tidak menghitung ulang ribuan LH
  const lpBarisMat = (l) => {
    const ada = lpCache.get(l); if (ada) return ada;
    const d = l.data || {}, out = [];
    LP_MAT.forEach(([k, grup]) => (d[k] || []).forEach((m) => {
      if (!m || !m.nama) return;
      const jml = k === 'uraianPasang' ? (lpAngka(m.pln) + lpAngka(m.pemb) || lpAngka(m.jumlah)) : lpAngka(m.jumlah);
      const nama = String(m.nama);
      out.push({ k, grup, nama, nl: nama.toLowerCase(), sat: String(m.satuan || ''), jml, hrg: m.harga });
    }));
    lpCache.set(l, out); return out;
  };
  // nilai rupiah satu baris material, aturan sama dengan RAB (retur tidak dihitung)
  const lpNilai = (r, p) => {
    if (r.k === 'materialMdu') return ((p.mat > 0 ? p.mat : lpAngka(r.hrg)) + p.jas) * r.jml;
    if (r.k === 'uraianPasang') return (p.mat + (p.jas > 0 ? p.jas : lpAngka(r.hrg))) * r.jml;
    if (r.k === 'uraianBongkar') return (p.bongkar > 0 ? p.bongkar : lpAngka(r.hrg)) * r.jml;
    return 0;
  };
  const lpHargaMap = (master) => { const m = {}; (master || []).forEach((x) => { const n = String(x.Nama_Item || (x._raw && x._raw[2]) || '').trim().toLowerCase(); if (n && !m[n]) m[n] = { mat: lpAngka(x.Harga_Material || (x._raw && x._raw[4])), jas: lpAngka(x.Harga_Jasa || (x._raw && x._raw[5])), bongkar: lpAngka(x.Harga_Bongkar || (x._raw && x._raw[6])) }; }); return m; };
  const LP_NOL = { mat: 0, jas: 0, bongkar: 0 };
  // jumlahkan per satuan: "12 btg + 3 m"
  // subtotal dipisah per jenis baris (material utama, konstruksi, jasa, retur baru, retur bekas): retur bekas TIDAK digabung dengan yang lain
  const lpSubGrup = (rows) => { const g = {}; rows.forEach((r) => { (g[r.grup] || (g[r.grup] = [])).push(r); }); const ks = Object.keys(g); return ks.map((k) => (ks.length > 1 || /^Retur/.test(k) ? k + ': ' : '') + lpSubSat(g[k])).join(' | '); };
  const lpSubSat = (rows) => { const m = {}; rows.forEach((r) => { const k = r.sat || '(tanpa satuan)'; m[k] = (m[k] || 0) + r.jml; }); return Object.keys(m).map((k) => lpFmt(m[k]) + ' ' + k).join(' + '); };

  function LhPeriksaTab({ lhs, pks, masterDatabase, setLhs, canSel, showToast }) {
    const [modeNama, setModeNama] = useState(false);
    const [dari, setDari] = useState(() => { const d = new Date(); d.setDate(d.getDate() - 30); return lpIso(d); });
    const [sampai, setSampai] = useState(() => lpIso(new Date()));
    const [qIn, setQIn] = useState('');   // isi kotak (langsung), q = yang dipakai menyaring (ditunda sebentar agar tidak patah-patah)
    const [q, setQ] = useState('');
    const [fokus, setFokus] = useState(false);
    const [sorot, setSorot] = useState(-1);
    useEffect(() => { const t = setTimeout(() => { setQ(qIn); setLim(100); }, 220); return () => clearTimeout(t); }, [qIn]);
    const [pilih, setPilih] = useState({});
    const [lim, setLim] = useState(100);
    const [pratinjau, setPratinjau] = useState(false);
    const inp = 'h-8 px-3 border border-[#8E99B5] rounded-lg bg-white text-[13px] outline-none focus:border-[#3A62B0] focus:ring-2 focus:ring-[#3A62B0]/20';
    const pkBy = useMemo(() => { const m = {}; (pks || []).forEach((p) => { m[String(p.id).trim()] = p; }); return m; }, [pks]);
    const awal = useMemo(() => (lhs || []).map((l) => ({ l, t: window.Periode.waktu(l) })), [lhs]);
    const a = dari ? new Date(dari + 'T00:00:00').getTime() : 0;
    const b = sampai ? new Date(sampai + 'T00:00:00').getTime() + 86399000 : 0;
    const dalam = useMemo(() => awal.filter((x) => (!a && !b) || (x.t > 0 && (!a || x.t >= a) && (!b || x.t <= b))).sort((p, r) => (r.t - p.t) || String(r.l.id).localeCompare(String(p.l.id))), [awal, a, b]);
    const words = useMemo(() => String(q || '').toLowerCase().trim().split(/\s+/).filter(Boolean), [q]);
    const harga = useMemo(() => lpHargaMap(masterDatabase), [masterDatabase]);
    // rekomendasi nama material dari Master data (daftar nama disiapkan sekali; hanya 8 teratas yang ditampilkan)
    const namaMaster = useMemo(() => { const s = {}, out = []; (masterDatabase || []).forEach((x) => { const n = String(x.Nama_Item || (x._raw && x._raw[2]) || '').trim(); const k = n.toLowerCase(); if (n && !s[k]) { s[k] = 1; out.push({ n, k }); } }); return out; }, [masterDatabase]);
    const saran = useMemo(() => {
      const w = String(qIn || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
      if (!fokus || !w.length || w.join(' ').length < 2) return [];
      const out = []; for (let i = 0; i < namaMaster.length && out.length < 8; i++) { const e = namaMaster[i]; if (e.k !== w.join(' ') && w.every((x) => e.k.indexOf(x) >= 0)) out.push(e.n); }
      return out;
    }, [qIn, fokus, namaMaster]);
    const pakaiSaran = (n) => { setQIn(n); setQ(n); setLim(100); setFokus(false); setSorot(-1); };
    const hasil = useMemo(() => {
      if (!words.length) return dalam.map((x) => ({ ...x, baris: [] }));
      const out = [];
      dalam.forEach((x) => {
        const baris = lpBarisMat(x.l).filter((m) => words.every((w) => m.nl.indexOf(w) >= 0));
        if (baris.length || window.lhMatch(x.l, q) !== null) out.push({ ...x, baris });
      });
      return out;
    }, [dalam, q]);
    const total = useMemo(() => {
      if (!words.length) return [];
      const m = {};
      hasil.forEach((x) => x.baris.forEach((r) => { const k = r.k + '|' + r.nl.replace(/\s+/g, ' ') + '|' + r.sat.toLowerCase(); const e = m[k] || (m[k] = { nama: r.nama, sat: r.sat, grup: r.grup, jml: 0, nilai: 0, lh: {} }); e.jml += r.jml; e.nilai += lpNilai(r, harga[r.nl.trim()] || LP_NOL); e.lh[x.l.id] = 1; }));
      return Object.keys(m).map((k) => m[k]).sort((p, r) => r.jml - p.jml);
    }, [hasil, harga]);
    const subtotal = useMemo(() => { const rows = []; hasil.forEach((x) => x.baris.forEach((r) => rows.push(r))); return { teks: lpSubGrup(rows), n: rows.length, nilai: total.reduce((a, e) => a + e.nilai, 0) }; }, [hasil, total]);
    const nDipilih = Object.keys(pilih).filter((k) => pilih[k]).length;
    const semua = hasil.length > 0 && hasil.every((x) => pilih[x.l.id]);
    const ubahSemua = () => { const n = { ...pilih }; hasil.forEach((x) => { if (semua) delete n[x.l.id]; else n[x.l.id] = true; }); setPilih(n); };
    const tampil = hasil.slice(0, lim);

    if (modeNama) return <KoreksiNamaPanel daftar={dalam} masterDatabase={masterDatabase} canSel={canSel} setLhs={setLhs} showToast={showToast} onTutup={() => setModeNama(false)} />;
    if (pratinjau) return <RabLhPreview lhs={awal.filter((x) => pilih[x.l.id]).sort((p, r) => (p.t - r.t) || String(p.l.id).localeCompare(String(r.l.id)))} pkBy={pkBy} masterDatabase={masterDatabase} onTutup={() => setPratinjau(false)} />;

    return (
      <section className="space-y-3" data-testid="tab-periksa-lh">
        <div className="bg-white border border-[#E6E9F2] rounded-xl px-5 py-3 flex flex-wrap items-end gap-x-4 gap-y-2">
          <label className="block"><span className="block text-[11px] text-[#6B665E] mb-0.5">Dari tanggal</span><input type="date" value={dari} onChange={(e) => { setDari(e.target.value); setLim(100); }} className={inp} data-testid="lp-dari" /></label>
          <label className="block"><span className="block text-[11px] text-[#6B665E] mb-0.5">Sampai tanggal</span><input type="date" value={sampai} onChange={(e) => { setSampai(e.target.value); setLim(100); }} className={inp} data-testid="lp-sampai" /></label>
          <UI.Btn onClick={() => { setDari(''); setSampai(''); setLim(100); }}>Semua tanggal</UI.Btn>
          <div className="block flex-1 min-w-[260px] relative"><label htmlFor="lp-cari" className="block text-[11px] text-[#6B665E] mb-0.5">Cari nama material, pekerjaan, lokasi, atau nomor LH</label>
            <input id="lp-cari" value={qIn} autoComplete="off" onChange={(e) => { setQIn(e.target.value); setSorot(-1); }} onFocus={() => setFokus(true)} onBlur={() => setTimeout(() => setFokus(false), 120)}
              onKeyDown={(e) => { if (e.key === 'ArrowDown' && saran.length) { e.preventDefault(); setSorot((sorot + 1) % saran.length); } else if (e.key === 'ArrowUp' && saran.length) { e.preventDefault(); setSorot((sorot - 1 + saran.length) % saran.length); } else if (e.key === 'Enter' && sorot >= 0 && saran[sorot]) { e.preventDefault(); pakaiSaran(saran[sorot]); } else if (e.key === 'Escape') setFokus(false); }}
              placeholder="ketik nama material, pilih dari rekomendasi Master data" className={inp + ' w-full'} data-testid="lp-cari" />
            {saran.length > 0 && <div className="absolute z-20 left-0 right-0 mt-1 bg-white border border-[#8E99B5] rounded-lg shadow-lg overflow-hidden" data-testid="lp-saran" role="listbox">
              <div className="px-3 py-1 text-[11px] text-[#6B665E] bg-[#F4F6FB]">Rekomendasi dari Master data</div>
              {saran.map((n, i) => <button key={n} role="option" aria-selected={i === sorot} onMouseDown={(e) => { e.preventDefault(); pakaiSaran(n); }} className={'block w-full text-left px-3 py-1.5 break-words ' + (i === sorot ? 'bg-[#E9EEFA]' : 'hover:bg-[#F4F6FB]')}>{n}</button>)}
            </div>}
          </div>
        </div>
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
          <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={semua} onChange={ubahSemua} data-testid="lp-semua" />Centang semua yang tampil ({hasil.length})</label>
          <span className="text-[#6B665E]" data-testid="lp-ringkas">{hasil.length} LH{words.length ? ' cocok' : ''} dalam rentang · {nDipilih} dipilih</span>
          <span className="flex-1"></span>
          <UI.Btn onClick={() => setModeNama(true)} data-testid="lp-koreksi-nama" title="Periksa nama material semua LH pada rentang tanggal ini terhadap Master data, lalu koreksi sekaligus">Cek dan koreksi nama material</UI.Btn>
          {nDipilih > 0 && <UI.Btn onClick={() => setPilih({})}>Hapus semua centang</UI.Btn>}
          <UI.Btn kind="primary" disabled={nDipilih === 0} onClick={() => setPratinjau(true)} data-testid="lp-cetak">Cetak RAB ({nDipilih} LH)</UI.Btn>
        </div>
        {words.length > 0 && total.length > 0 && (
          <div className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden" data-testid="lp-total">
            <div className="grid gap-3 items-center px-5 py-2 bg-[#F4F6FB] text-[12px] text-[#6B665E]" style={{ gridTemplateColumns: 'minmax(0,1fr) 150px 70px 130px' }}><span>Total pemakaian material yang cocok dalam rentang ini</span><span className="text-right">Jumlah</span><span className="text-right">LH</span><span className="text-right">Perkiraan nilai (Rp)</span></div>
            {total.slice(0, 30).map((r) => (
              <div key={r.grup + '|' + r.nama + '|' + r.sat} className="grid gap-3 items-center px-5 py-1.5 border-t border-[#EEF0F7]" style={{ gridTemplateColumns: 'minmax(0,1fr) 150px 70px 130px' }}>
                <span className="break-words">{r.nama} <span className={'text-[11px] ml-1 px-1.5 py-0.5 rounded ' + (/^Retur/.test(r.grup) ? 'bg-[#FFF3D6] text-[#94620F]' : 'bg-[#EEF0F7] text-[#6B665E]')} data-testid="lp-grup">{r.grup}</span></span><span className="num text-right font-medium">{lpFmt(r.jml)} {r.sat}</span><span className="text-[12px] text-[#6B665E] text-right">{Object.keys(r.lh).length}</span><span className="num text-right">{r.nilai > 0 ? lpRp(r.nilai) : '-'}</span>
              </div>))}
            {total.length > 30 && <div className="px-5 py-1.5 border-t border-[#EEF0F7] text-[#6B665E]">+{total.length - 30} nama material lain (subtotal di bawah tetap menghitung semuanya). Persempit kata pencarian untuk melihatnya.</div>}
            <div className="grid gap-3 items-center px-5 py-2 border-t-2 border-[#8E99B5] bg-[#F8F9FD] font-medium" style={{ gridTemplateColumns: 'minmax(0,1fr) 150px 70px 130px' }} data-testid="lp-subtotal"><span>Subtotal ({total.length} nama material, {hasil.filter((x) => x.baris.length).length} LH)</span><span className="num text-right" title="Dijumlahkan per satuan">{subtotal.teks}</span><span></span><span className="num text-right">{subtotal.nilai > 0 ? lpRp(subtotal.nilai) : '-'}</span></div>
          </div>)}
        <div className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden">
          {tampil.length === 0 && <UI.Empty>{words.length ? 'Tidak ada LH yang cocok dengan pencarian pada rentang ini.' : 'Tidak ada LH pada rentang tanggal ini.'}</UI.Empty>}
          {tampil.map((x) => {
            const pk = pkBy[String(x.l.pk_id).trim()]; const d = x.l.data || {};
            return (
              <div key={x.l.id} data-testid="lp-baris" className="px-5 py-2.5 border-t first:border-t-0 border-[#EEF0F7]">
                <div className="grid gap-3 items-start" style={{ gridTemplateColumns: '24px 112px minmax(0,1fr)' }}>
                  <input type="checkbox" className="mt-1" checked={!!pilih[x.l.id]} onChange={() => setPilih({ ...pilih, [x.l.id]: !pilih[x.l.id] })} aria-label={'Pilih ' + x.l.id} />
                  <div><div className="num text-[#7E57C2]">{x.l.id}</div><div className="num text-[11px] text-[#2F8F9D]">{lpTgl(x.t)}</div></div>
                  <div className="min-w-0">
                    <div className="break-words font-medium">{d.nama_pekerjaan_lh || x.l.uraian || 'Pekerjaan LH belum diberi nama'}</div>
                    <div className="text-[11px] text-[#6B665E] break-words">PK {x.l.pk_id}{pk && pk.nama ? ' · ' + pk.nama : ''}{d.lokasi_lh ? ' · ' + d.lokasi_lh : ''}</div>
                    <div className="text-[11px] text-[#6B665E] break-words" data-testid="lp-orang">Pelanggan: <span className="text-[#2B2F3A]">{[d.pelanggan, d.pelanggan_lh, d.customer, d.nama_pelanggan].filter(Boolean)[0] || '-'}</span> · Pengawas: <span className="text-[#2B2F3A]">{d.pengawas_lh || x.l.pengawas || '-'}</span> · Team: <span className="text-[#2B2F3A]">{d.team_lh || '-'}</span></div>
                    {x.baris.length > 0 && <div className="mt-1.5 rounded-lg bg-[#F8F9FD] px-3 py-1.5">{x.baris.map((r, i) => (
                      <div key={i} className="grid gap-3 py-0.5" style={{ gridTemplateColumns: 'minmax(0,1fr) 150px 140px' }}><span className="break-words">{r.nama}</span><span className="num text-right">{lpFmt(r.jml)} {r.sat}</span><span className="text-[11px] text-[#6B665E] text-right">{r.grup}</span></div>))}
                      {x.baris.length > 1 && <div className="grid gap-3 py-0.5 mt-0.5 border-t border-[#E6E9F2] font-medium" style={{ gridTemplateColumns: 'minmax(0,1fr) 150px 140px' }} data-testid="lp-sub-lh"><span>Subtotal LH ini</span><span className="num text-right">{lpSubGrup(x.baris)}</span><span></span></div>}</div>}
                  </div>
                </div>
              </div>);
          })}
          {hasil.length > lim && <button onClick={() => setLim(lim + 100)} className="w-full py-2 border-t border-[#EEF0F7] text-[#3A62B0] hover:bg-[#F9FAFD]">Tampilkan 100 LH berikutnya ({hasil.length - lim} lagi)</button>}
        </div>
        <p className="text-[12px] text-[#6B665E]">LH tanpa tanggal yang terbaca hanya tampil bila rentang tanggal dikosongkan (tombol Semua tanggal). Halaman ini hanya membaca data; tidak ada yang diubah.</p>
      </section>);
  }

  // ---------- Koreksi nama material massal ----------
  // Memeriksa semua LH dalam rentang tanggal: nama yang tulisannya beda dengan Master data (huruf besar, spasi), salah ketik (mirip >= 80%),
  // dikenali lewat tabel Convert, atau benar-benar tidak ada di Master data (kemungkinan Master data kehilangan barisnya).
  // Hanya Super Admin dan Admin SPK yang boleh menerapkan. Penerapan satu LH demi satu LH (tiap LH disimpan dan diperiksa server), berhenti di galat pertama.
  const LP_GRUP = ['materialMdu', 'materialKonstruksi', 'uraianPasang', 'uraianBongkar', 'returBaru', 'returBekas'];
  function KoreksiNamaPanel({ daftar, masterDatabase, canSel, setLhs, showToast, onTutup }) {
    const [hasil, setHasil] = useState(null);
    const [tandai, setTandai] = useState({});
    const [sibuk, setSibuk] = useState(true);
    const [prog, setProg] = useState(null);
    const [ulang, setUlang] = useState(0);
    const [lewatAudit, setLewatAudit] = useState(false);
    const adaMaster = !!(masterDatabase && masterDatabase.length);
    const periksa = () => {
      setSibuk(true);
      setTimeout(() => {
        if (!adaMaster) { setHasil({ rows: [], nLh: daftar.length, nNama: 0, benar: 0 }); setSibuk(false); return; }
        const master = buildMaster(masterDatabase, []);
        const dist = {};
        daftar.forEach(({ l }) => { const d = l.data || {}; LP_GRUP.forEach((g) => (d[g] || []).forEach((it) => { const n = it && String(it.nama || '').trim(); if (!n) return; const e = dist[n] || (dist[n] = { nama: n, lh: {}, baris: 0, grup: {} }); e.lh[l.id] = 1; e.baris++; e.grup[g] = 1; })); });
        const rows = []; let benar = 0; const def = {};
        Object.keys(dist).forEach((n) => {
          const e = dist[n]; e.nLh = Object.keys(e.lh).length;
          const st = window.Convert.status(masterDatabase, n);
          if (st.s === 'master') {
            const t = st.target || {}; const canon = String(t.Nama_Item || (t._raw && t._raw[2]) || '').trim();
            if (canon && canon !== n) { rows.push({ ...e, tipe: 'tulisan', ke: canon, r: 1 }); def[n] = true; } else benar++;
          } else if (st.s === 'convert') { rows.push({ ...e, tipe: 'convert', ke: st.nama, r: 1 }); }
          else {
            let best = null; master.list.forEach((m) => { const r = simRatio(n, m.nama); if (r && (!best || r > best.r)) best = { nama: m.nama, r }; });
            if (best) { rows.push({ ...e, tipe: 'mirip', ke: best.nama, r: best.r }); if (best.r >= 0.95) def[n] = true; }
            else rows.push({ ...e, tipe: 'hilang', ke: '', r: 0 });
          }
        });
        rows.sort((p, r) => r.nLh - p.nLh || p.nama.localeCompare(r.nama));
        setHasil({ rows, nLh: daftar.length, nNama: Object.keys(dist).length, benar }); setTandai(def); setSibuk(false);
      }, 40);
    };
    useEffect(() => { periksa(); }, [ulang]);
    const bisa = hasil ? hasil.rows.filter((r) => r.ke && r.tipe !== 'convert') : [];
    const conv = hasil ? hasil.rows.filter((r) => r.tipe === 'convert') : [];
    const hilang = hasil ? hasil.rows.filter((r) => r.tipe === 'hilang') : [];
    const nTandai = hasil ? hasil.rows.filter((r) => r.ke && tandai[r.nama]).length : 0;
    const semuaBisa = bisa.length > 0 && bisa.every((r) => tandai[r.nama]);
    const ubahBisa = () => { const n = { ...tandai }; bisa.forEach((r) => { if (semuaBisa) delete n[r.nama]; else n[r.nama] = true; }); setTandai(n); };
    const jalankan = async () => {
      const peta = Object.create(null); hasil.rows.filter((r) => r.ke && tandai[r.nama]).forEach((r) => { peta[r.nama] = r.ke; });
      let target = daftar.filter(({ l }) => LP_GRUP.some((g) => ((l.data || {})[g] || []).some((it) => it && peta[String(it.nama || '').trim()] !== undefined)));
      if (lewatAudit) target = target.filter(({ l }) => window.lhTahap(l) !== 'lolos');
      if (!target.length) { showToast('Tidak ada yang dikoreksi', 'Tidak ada LH yang cocok dengan nama yang dicentang.', 'error'); return; }
      const bagian = target.slice(0, 200);
      const nAudit = bagian.filter(({ l }) => window.lhTahap(l) === 'lolos').length;
      const res = await Swal.fire({ icon: 'warning', title: 'Koreksi ' + Object.keys(peta).length + ' nama di ' + bagian.length + ' LH?',
        html: '<div style="text-align:left;font-size:13px;line-height:1.5">Nama material di LH diganti dengan tulisan Master data, tersimpan langsung ke Data_LH.<br><br>&bull; Catatan audit di LH yang diubah ikut dihapus.<br>&bull; <b>' + nAudit + ' LH</b> yang sudah lolos audit akan kehilangan tanda audit dan harus diaudit lagi.<br>' + (target.length > bagian.length ? '&bull; Maksimal 200 LH sekali jalan; ' + (target.length - bagian.length) + ' LH sisanya diproses di putaran berikutnya.<br>' : '') + '&bull; Berhenti otomatis di galat pertama; LH yang sudah selesai tetap tersimpan.</div>',
        showCancelButton: true, confirmButtonText: 'Ya, koreksi', cancelButtonText: 'Batal', focusCancel: true });
      if (!res.isConfirmed) return;
      setSibuk(true);
      const rel = window.Proses && window.Proses.mulai ? window.Proses.mulai('Mengoreksi nama material di LH') : null;
      const done = {}; let galat = '';
      try {
        for (let i = 0; i < bagian.length; i++) {
          const l = bagian[i].l; setProg({ i: i + 1, n: bagian.length, id: l.id });
          const data = clone(l.data || {});
          LP_GRUP.forEach((g) => (data[g] || []).forEach((it) => { if (!it) return; const n = String(it.nama || '').trim(); if (peta[n] !== undefined) it.nama = peta[n]; }));
          const payload = clone({ id: l.id, pk_id: l.pk_id, tanggal: l.tanggal, uraian: l.uraian, data });
          try { const r = await run('updateLhInSheet', payload, false, false, l.id); if (r && r.status === 'error') { galat = l.id + ': ' + r.message; break; } done[l.id] = data; }
          catch (e) { galat = l.id + ': ' + String((e && e.message) || e); break; }
        }
      } finally { if (rel) rel(); }
      const n = Object.keys(done).length;
      if (n) setLhs((prev) => (prev || []).map((x) => done[x.id] ? { ...x, data: done[x.id], audit_note: '' } : x));
      setProg(null);
      if (galat) showToast('Berhenti di tengah jalan', n + ' LH sudah dikoreksi. Galat: ' + galat, 'error');
      else showToast('Koreksi selesai', n + ' LH dikoreksi. Daftar diperiksa ulang otomatis. Klik Sinkronkan data bila status audit perlu disegarkan.', 'success');
      setUlang((u) => u + 1);
    };
    const th = 'text-[12px] text-[#6B665E]';
    const Baris = ({ r, aktif }) => (
      <div className="grid gap-3 items-start px-5 py-2 border-t border-[#EEF0F7]" style={{ gridTemplateColumns: '24px minmax(0,1fr) minmax(0,1fr) 70px 60px' }} data-testid="kn-baris">
        <input type="checkbox" className="mt-1" disabled={!canSel || !!prog} checked={!!tandai[r.nama]} onChange={() => setTandai({ ...tandai, [r.nama]: !tandai[r.nama] })} aria-label={'Koreksi ' + r.nama} />
        <div className="break-words min-w-0">{r.nama}</div>
        <div className="break-words min-w-0 font-medium text-[#2D7A4E]">{r.ke}</div>
        <div className="text-right text-[12px] text-[#6B665E]">{r.tipe === 'tulisan' ? 'tulisan' : Math.round(r.r * 100) + '%'}</div>
        <div className="text-right num">{r.nLh} LH</div>
      </div>);
    return (
      <section className="space-y-3" data-testid="koreksi-nama">
        <div className="flex flex-wrap items-center gap-3">
          <UI.Btn onClick={onTutup} disabled={!!prog} data-testid="kn-kembali">Kembali ke daftar</UI.Btn>
          <h2 className="text-[16px] font-medium">Koreksi nama material massal</h2>
          <span className={th}>Memeriksa {daftar.length} LH pada rentang tanggal di tab ini.</span>
        </div>
        {!adaMaster && <div className="px-4 py-2 rounded-xl text-[12px]" style={{ background: '#FFF3D6', color: '#94620F' }}>Master data belum termuat, jadi nama tidak bisa dinilai. Klik Sinkronkan data lalu buka lagi.</div>}
        {!canSel && <div className="px-4 py-2 rounded-xl text-[12px]" style={{ background: '#EEF0F7', color: '#4A463F' }}>Hanya Admin SPK dan Super Admin yang boleh menerapkan koreksi. Anda bisa melihat hasil pemeriksaannya.</div>}
        {sibuk && !prog && <div className="text-[#6B665E] py-4"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Memeriksa nama material...</div>}
        {prog && <div className="px-4 py-3 rounded-xl border border-[#9FB0D2] bg-[#E9EEFA]" data-testid="kn-progres"><div className="font-medium"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Mengoreksi {prog.i} dari {prog.n} LH ({prog.id})</div><div className="h-[5px] rounded-full mt-2 overflow-hidden bg-white"><div className="h-full bg-[#3A62B0]" style={{ width: Math.round(prog.i / prog.n * 100) + '%' }}></div></div><div className="text-[12px] text-[#6B665E] mt-1">Jangan menutup halaman sampai selesai.</div></div>}
        {hasil && !sibuk && adaMaster && (<>
          <div className="flex flex-wrap gap-x-6 gap-y-1 text-[13px]" data-testid="kn-ringkas">
            <span><b>{hasil.nNama}</b> nama berbeda di {hasil.nLh} LH</span><span className="text-[#2D7A4E]"><b>{hasil.benar}</b> sudah persis Master data</span><span className="text-[#94620F]"><b>{bisa.length}</b> bisa dikoreksi</span><span><b>{conv.length}</b> dikenali lewat Convert</span><span className="text-[#B42318]"><b>{hilang.length}</b> tidak ada di Master data</span>
          </div>
          {bisa.length === 0 && conv.length === 0 && hilang.length === 0 && <UI.Empty>Semua nama material di LH pada rentang ini sudah persis sama dengan Master data.</UI.Empty>}
          {bisa.length > 0 && <div className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden">
            <div className="flex flex-wrap items-center gap-3 px-5 py-2 bg-[#F4F6FB]"><span className="font-medium">Bisa dikoreksi ke tulisan Master data</span><span className={th}>Yang mirip 95% atau lebih dicentang otomatis; yang lebih rendah periksa dulu.</span><span className="flex-1"></span>{canSel && <button className="text-[#3A62B0] hover:underline" onClick={ubahBisa} data-testid="kn-semua">{semuaBisa ? 'Kosongkan centang' : 'Centang semua'}</button>}</div>
            <div className="grid gap-3 px-5 py-1.5 text-[11px] text-[#6B665E]" style={{ gridTemplateColumns: '24px minmax(0,1fr) minmax(0,1fr) 70px 60px' }}><span></span><span>Nama di LH</span><span>Menjadi (Master data)</span><span className="text-right">Mirip</span><span className="text-right">LH</span></div>
            {bisa.slice(0, 300).map((r) => <Baris key={r.nama} r={r} />)}
            {bisa.length > 300 && <div className="px-5 py-1.5 border-t border-[#EEF0F7] text-[#6B665E]">+{bisa.length - 300} nama lain. Koreksi 300 teratas dulu, lalu periksa lagi.</div>}
          </div>}
          {conv.length > 0 && <div className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden">
            <div className="px-5 py-2 bg-[#F4F6FB]"><span className="font-medium">Dikenali lewat tabel Convert</span> <span className={th}>Sah, bukan error. Centang hanya bila Anda ingin LH memakai nama Master data langsung.</span></div>
            {conv.slice(0, 100).map((r) => <Baris key={r.nama} r={r} />)}
          </div>}
          {hilang.length > 0 && <div className="bg-white border border-[#F0C9C5] rounded-xl overflow-hidden" data-testid="kn-hilang">
            <div className="px-5 py-2 bg-[#FDF3F2]"><span className="font-medium text-[#B42318]">Tidak ada di Master data</span> <span className={th}>Tidak ada nama yang mirip. Bisa salah ketik berat, atau barisnya hilang dari Master data. Tambahkan di Master data, atau perbaiki lewat ikon pensil di Cek LH.</span></div>
            {hilang.slice(0, 100).map((r) => (<div key={r.nama} className="grid gap-3 px-5 py-1.5 border-t border-[#EEF0F7]" style={{ gridTemplateColumns: 'minmax(0,1fr) 150px 60px' }}><span className="break-words">{r.nama}</span><span className="text-[12px] text-[#6B665E] text-right">{Object.keys(r.grup).map((g) => ({ materialMdu: 'Material MDU', materialKonstruksi: 'Konstruksi', uraianPasang: 'Uraian pasang', uraianBongkar: 'Uraian bongkar', returBaru: 'Retur baru', returBekas: 'Retur bekas' }[g])).join(', ')}</span><span className="text-right num">{r.nLh} LH</span></div>))}
            {hilang.length > 100 && <div className="px-5 py-1.5 border-t border-[#EEF0F7] text-[#6B665E]">+{hilang.length - 100} nama lain.</div>}
          </div>}
          {canSel && (bisa.length > 0 || conv.length > 0) && <div className="flex flex-wrap items-center gap-4 px-5 py-3 bg-white border border-[#E6E9F2] rounded-xl">
            <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={lewatAudit} onChange={() => setLewatAudit(!lewatAudit)} disabled={!!prog} />Lewati LH yang sudah lolos audit (supaya tanda auditnya tidak hilang)</label>
            <span className="flex-1"></span>
            <UI.Btn kind="primary" disabled={nTandai === 0 || !!prog || sibuk} onClick={jalankan} data-testid="kn-terapkan">Koreksi {nTandai} nama</UI.Btn>
          </div>}
        </>)}
      </section>);
  }

  function RabLhPreview({ lhs, pkBy, masterDatabase, onTutup }) {
    const harga = useMemo(() => { const m = {}; (masterDatabase || []).forEach((x) => { const n = String(x.Nama_Item || (x._raw && x._raw[2]) || '').trim().toLowerCase(); if (n && !m[n]) m[n] = { mat: lpAngka(x.Harga_Material || (x._raw && x._raw[4])), jas: lpAngka(x.Harga_Jasa || (x._raw && x._raw[5])), bongkar: lpAngka(x.Harga_Bongkar || (x._raw && x._raw[6])) }; }); return m; }, [masterDatabase]);
    const hg = (n) => harga[String(n || '').trim().toLowerCase()] || { mat: 0, jas: 0, bongkar: 0 };
    const hitung = useMemo(() => {
      let gm = 0, gj = 0;
      const blok = lhs.map(({ l, t }) => {
        const d = l.data || {}; let sm = 0, sj = 0;
        const rows = (kunci, huruf, judul) => {
          const dat = (d[kunci] || []).filter((m) => m && m.nama); if (!dat.length) return null;
          return { judul: huruf + '. ' + judul, baris: dat.map((m) => {
            let vP = null, vB = null, vol, sM, sJ;
            if (kunci === 'materialMdu') { vol = lpAngka(m.jumlah); const p = hg(m.nama); sM = p.mat > 0 ? p.mat : lpAngka(m.harga); sJ = p.jas; }
            else if (kunci === 'uraianPasang') { vP = lpAngka(m.pln); vB = lpAngka(m.pemb); vol = vP + vB || lpAngka(m.jumlah); const p = hg(m.nama); sM = p.mat; sJ = p.jas > 0 ? p.jas : lpAngka(m.harga); }
            else { vol = lpAngka(m.jumlah); vB = vol; const p = hg(m.nama); sM = 0; sJ = p.bongkar > 0 ? p.bongkar : lpAngka(m.harga); }
            const bM = sM * vol, bJ = sJ * vol; sm += bM; sj += bJ; gm += bM; gj += bJ;
            return { nama: m.nama, sat: m.satuan, vP, vB, vol, sM, sJ, bM, bJ };
          }) };
        };
        const bag = [rows('materialMdu', 'A', 'MATERIAL UTAMA'), rows('uraianPasang', 'B', 'MATERIAL KONSTRUKSI'), rows('uraianBongkar', 'C', 'JASA DAN LAIN-LAIN')].filter(Boolean);
        return { l, t, bag, sm, sj };
      });
      return { blok, gm, gj };
    }, [lhs, harga]);
    const cell = 'border border-[#9AA0AE] px-1.5 py-[3px]';
    const c = cell + ' text-center', r = cell + ' text-right';
    const f = (n) => n > 0 ? lpRp(n) : '-';
    const all = hitung.gm + hitung.gj, ppn = Math.round(all * 0.11), final = Math.round((all + ppn) / 1000) * 1000;
    const t0 = lhs.length ? lhs[0].t : 0, t1 = lhs.length ? lhs[lhs.length - 1].t : 0;
    // Cetak / simpan PDF lewat iframe tersembunyi berisi HTML mandiri (cara yang sama dengan Cetak Code 3/7): tidak bergantung pada tata letak layar,
    // jadi isinya pasti ikut tercetak dan tidak terpotong oleh area gulir aplikasi.
    const cetak = () => {
      const e = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
      const td = (v, cls, extra) => '<td class="' + (cls || '') + '"' + (extra || '') + '>' + v + '</td>';
      let tb = '';
      hitung.blok.forEach(({ l, t, bag, sm, sj }) => {
        const d = l.data || {}, pk = pkBy[String(l.pk_id).trim()]; let no = 1;
        tb += '<tr class="lh"><td colspan="11"><b>' + e(lpTgl(t)) + ' : ' + e(pk && pk.nama ? pk.nama : 'PK ' + l.pk_id) + '</b><br><i>' + e(d.nama_pekerjaan_lh || l.uraian || 'Pekerjaan Harian') + ' - ' + e(d.lokasi_lh || 'Lokasi belum diisi') + ' - ' + e(d.pengawas_lh || '-') + ' - ' + e(d.team_lh || '-') + '</i></td></tr>';
        bag.forEach((g) => {
          tb += '<tr><td colspan="11"><b>' + e(g.judul) + '</b></td></tr>';
          g.baris.forEach((m) => { tb += '<tr>' + td(no++, 'c') + td(e(m.nama)) + td(e(m.sat), 'c') + td(m.vP > 0 ? lpFmt(m.vP) : '-', 'c') + td(m.vB > 0 ? lpFmt(m.vB) : '-', 'c') + td(m.vol > 0 ? lpFmt(m.vol) : '-', 'c b') + td(f(m.sM), 'r') + td(f(m.sJ), 'r') + td(f(m.bM), 'r') + td(f(m.bJ), 'r') + td(f(m.bM + m.bJ), 'r b') + '</tr>'; });
        });
        tb += '<tr class="sub"><td colspan="8" class="r"><b>Subtotal</b></td>' + td(f(sm), 'r b') + td(f(sj), 'r b') + td(f(sm + sj), 'r b') + '</tr>';
      });
      tb += '<tr><td colspan="8" class="r"><b>Total Keseluruhan</b></td>' + td(f(hitung.gm), 'r b') + td(f(hitung.gj), 'r b') + td(f(all), 'r b') + '</tr>'
        + '<tr><td colspan="10" class="r"><b>PPN 11%</b></td>' + td(lpRp(ppn), 'r b') + '</tr>'
        + '<tr><td colspan="10" class="r"><b>Jumlah</b></td>' + td(lpRp(all + ppn), 'r b') + '</tr>'
        + '<tr class="sub"><td colspan="10" class="r"><b>Grand Total Dibulatkan</b></td>' + td(lpRp(final), 'r b') + '</tr>';
      const html = '<!doctype html><html><head><meta charset="utf-8"><title>RAB gabungan ' + lhs.length + ' LH</title><style>'
        + '@page{size:A4 landscape;margin:8mm}body{font-family:Arial,sans-serif;font-size:9pt;color:#000;margin:0}h1{text-align:center;font-size:14pt;text-decoration:underline;margin:0 0 8px}p{margin:0 0 8px;font-size:10pt}'
        + 'table{width:100%;border-collapse:collapse}th,td{border:1px solid #666;padding:2px 5px;vertical-align:middle}th{background:#d9d9d9;text-align:center}thead{display:table-header-group}tr{page-break-inside:avoid}'
        + '.c{text-align:center}.r{text-align:right;white-space:nowrap}.b{font-weight:bold}.lh td,.sub td{background:#f1f5f9}'
        + '</style></head><body><h1>RENCANA ANGGARAN BIAYA (RAB)</h1><p>Gabungan ' + lhs.length + ' LH &middot; ' + e(lpTgl(t0)) + ' s/d ' + e(lpTgl(t1)) + '</p>'
        + '<table><thead><tr><th rowspan="2" style="width:4%">NO</th><th rowspan="2" style="width:28%">URAIAN PEKERJAAN</th><th rowspan="2">SAT</th><th colspan="2">VOLUME</th><th rowspan="2">JML</th><th colspan="2">HARGA SATUAN</th><th colspan="2">HARGA BAGIAN</th><th rowspan="2">TOTAL</th></tr>'
        + '<tr><th>PLN</th><th>PEMB</th><th>Material</th><th>Jasa</th><th>Material</th><th>Jasa</th></tr></thead><tbody>' + tb + '</tbody></table></body></html>';
      const fr = document.createElement('iframe');
      fr.setAttribute('aria-hidden', 'true'); fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
      document.body.appendChild(fr);
      const dd = fr.contentWindow.document; dd.open(); dd.write(html); dd.close();
      setTimeout(() => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (err) { /* dialog dibatalkan */ } setTimeout(() => { try { fr.remove(); } catch (err) { /* abaikan */ } }, 60000); }, 250);
    };
    return (
      <div className="space-y-3">
        <div className="flex flex-wrap items-center gap-3">
          <UI.Btn onClick={onTutup} data-testid="lp-kembali">Kembali ke daftar</UI.Btn>
          <span className="text-[#6B665E]">Pratinjau RAB gabungan {lhs.length} LH. Harga dari Master data, sama dengan Cetak RAB di Kelola PK.</span>
          <span className="flex-1"></span>
          <UI.Btn kind="primary" onClick={cetak} data-testid="lp-cetak-pdf">Cetak / simpan PDF</UI.Btn>
        </div>
        <div className="bg-white border border-[#E6E9F2] rounded-xl p-5 text-black overflow-x-auto" data-testid="rab-lh-pratinjau">
          <div className="text-center font-bold underline text-[15px] mb-3">RENCANA ANGGARAN BIAYA (RAB)</div>
          <div className="text-[12px] mb-3">Gabungan {lhs.length} LH · {lpTgl(t0)} s/d {lpTgl(t1)}</div>
          <table className="w-full border-collapse text-[11px]">
            <thead>
              <tr className="bg-[#D9D9D9] font-bold text-center"><th rowSpan={2} className={cell} style={{ width: '4%' }}>NO</th><th rowSpan={2} className={cell} style={{ width: '28%' }}>URAIAN PEKERJAAN</th><th rowSpan={2} className={cell}>SAT</th><th colSpan={2} className={cell}>VOLUME</th><th rowSpan={2} className={cell}>JML</th><th colSpan={2} className={cell}>HARGA SATUAN</th><th colSpan={2} className={cell}>HARGA BAGIAN</th><th rowSpan={2} className={cell}>TOTAL</th></tr>
              <tr className="bg-[#D9D9D9] font-bold text-center"><th className={cell}>PLN</th><th className={cell}>PEMB</th><th className={cell}>Material</th><th className={cell}>Jasa</th><th className={cell}>Material</th><th className={cell}>Jasa</th></tr>
            </thead>
            <tbody>
              {hitung.blok.map(({ l, t, bag, sm, sj }) => { const d = l.data || {}, pk = pkBy[String(l.pk_id).trim()]; let no = 1; return (
                <React.Fragment key={l.id}>
                  <tr className="bg-[#F8FAFC]"><td colSpan={11} className={cell}><div className="font-bold">{lpTgl(t)} : {pk && pk.nama ? pk.nama : 'PK ' + l.pk_id}</div><div className="italic text-[10px]"><b>{d.nama_pekerjaan_lh || l.uraian || 'Pekerjaan Harian'}</b> - {d.lokasi_lh || 'Lokasi belum diisi'} - {d.pengawas_lh || '-'} - {d.team_lh || '-'}</div></td></tr>
                  {bag.map((g) => (
                    <React.Fragment key={g.judul}>
                      <tr><td colSpan={11} className={cell + ' font-bold'}>{g.judul}</td></tr>
                      {g.baris.map((m, i) => (
                        <tr key={i}><td className={c}>{no++}</td><td className={cell}>{m.nama}</td><td className={c}>{m.sat}</td><td className={c}>{m.vP > 0 ? lpFmt(m.vP) : '-'}</td><td className={c}>{m.vB > 0 ? lpFmt(m.vB) : '-'}</td><td className={c + ' font-bold'}>{m.vol > 0 ? lpFmt(m.vol) : '-'}</td><td className={r}>{f(m.sM)}</td><td className={r}>{f(m.sJ)}</td><td className={r}>{f(m.bM)}</td><td className={r}>{f(m.bJ)}</td><td className={r + ' font-bold'}>{f(m.bM + m.bJ)}</td></tr>))}
                    </React.Fragment>))}
                  <tr className="bg-[#F8FAFC] font-bold"><td colSpan={8} className={r}>Subtotal</td><td className={r}>{f(sm)}</td><td className={r}>{f(sj)}</td><td className={r}>{f(sm + sj)}</td></tr>
                </React.Fragment>); })}
              <tr className="font-bold"><td colSpan={8} className={r}>Total Keseluruhan</td><td className={r}>{f(hitung.gm)}</td><td className={r}>{f(hitung.gj)}</td><td className={r}>{f(all)}</td></tr>
              <tr className="font-bold"><td colSpan={10} className={r}>PPN 11%</td><td className={r}>{lpRp(ppn)}</td></tr>
              <tr className="font-bold"><td colSpan={10} className={r}>Jumlah</td><td className={r}>{lpRp(all + ppn)}</td></tr>
              <tr className="font-bold bg-[#F1F5F9]"><td colSpan={10} className={r}>Grand Total Dibulatkan</td><td className={r}>{lpRp(final)}</td></tr>
            </tbody>
          </table>
        </div>
      </div>);
  }

  function KtkPage({ ctx }) {
    const { currentUser, showToast, masterDatabase, pks, lhs, spks, setLhs, setPks, setSpks } = ctx; const getNom = ctx.getNominalPKAkurat;
    const role = currentUser && currentUser.role;
    // identitas untuk server: token sesi dari login + (Super Admin saja) ID akun yang sedang dipakai lewat Masuk sebagai
    const auth = { t: (currentUser && currentUser.token) || '', as: (currentUser && currentUser.asUser) || '' };
    const [openId, setOpenId] = useState(null);
    if (ROLES.indexOf(role) < 0) return <UI.Empty>Menu KTK hanya untuk Super Admin, Admin SPK, dan Admin PK.</UI.Empty>;
    return openId
      ? <KontrakEditor id={openId} role={role} auth={auth} onBack={() => setOpenId(null)} showToast={showToast} masterDatabase={masterDatabase} pks={pks} lhs={lhs} spks={spks} setLhs={setLhs} setPks={setPks} setSpks={setSpks} />
      : <KontrakList role={role} auth={auth} onOpen={setOpenId} showToast={showToast} spks={spks} setSpks={setSpks} lhsAll={lhs} pksAll={pks} masterAll={masterDatabase} setLhsAll={setLhs} />;
  }

  window.Views.Ktk = (ctx) => <KtkPage ctx={ctx} />;
})();
</script>
