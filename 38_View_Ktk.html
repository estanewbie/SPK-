<script type="text/babel">
// Menu KTK (Kerja Tambah Kurang) - standar desain DESIGN.md. SATU menu menyelesaikan semuanya:
// Lampiran (paket, volume, harga) | Cek LH per PK (koreksi LH & tambah ke kontrak di tempat) | RAB | Rekapitulasi.
// Hanya untuk Super Admin, Admin SPK, Admin PK. Data: Ktk_Kontrak / Ktk_Paket / Ktk_Item (Ktk.js) + LH/PK/SPK dari aplikasi.
// Semua hitungan uang lewat window.KtkMath (BigInt, tanpa float). Harga & volume di state = TEKS.
(function () {
  const { useState, useEffect, useMemo, useRef } = React;
  const K = window.KtkMath;
  const UI = window.UI;
  const Z = BigInt(0);
  const ROLES = ['Super Admin', 'Admin SPK', 'Admin PK'];
  const run = (fn, ...args) => new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const rp = (b) => 'Rp ' + K.fmtRp(b);

  // ---------- teks: kalimat biasa (data KHS tersimpan berhuruf besar) ----------
  const ACR = { sutm: 'SUTM', skutm: 'SKUTM', sktm: 'SKTM', sutr: 'SUTR', sktr: 'SKTR', aaacs: 'AAACS', aaac: 'AAAC', pln: 'PLN', up3: 'UP3', ulp: 'ULP',
    kva: 'kVA', kv: 'kV', tm: 'TM', tr: 'TR', lbs: 'LBS', mdu: 'MDU', ppn: 'PPN', dpp: 'DPP', gh: 'GH', xlpe: 'XLPE', pvc: 'PVC', hdpe: 'HDPE', nyy: 'NYY' };
  const sentence = (s) => {
    s = String(s || '');
    const up = (s.match(/[A-Z]/g) || []).length, lo = (s.match(/[a-z]/g) || []).length;
    if (up + lo === 0 || lo / (up + lo) > 0.15) return s; // sudah campuran huruf: jangan diubah
    const low = s.toLowerCase().replace(/[a-z0-9]+/g, (w) => ACR[w] || w);
    return low.charAt(0).toUpperCase() + low.slice(1);
  };
  const short = (n) => sentence(String(n || '').replace(/^PEKERJAAN\s+/i, '')).replace(/^pekerjaan\s+/i, '');

  // ---------- pencocokan nama dengan Master data / kontrak ----------
  const _nc = new Map();   // hasil penormalan nama disimpan (nama yang sama dipakai berulang di ribuan baris)
  const norm = (s) => { const k = String(s || ''); let v = _nc.get(k); if (v === undefined) { v = k.toLowerCase().replace(/penomeran/g, 'penomoran').replace(/\s+/g, ''); if (_nc.size > 60000) _nc.clear(); _nc.set(k, v); } return v; };
  const tokens = (s) => String(s || '').toLowerCase().replace(/penomeran/g, 'penomoran').split(/[^a-z0-9.]+/).filter(Boolean);
  const cellP = (v) => (v === null || v === undefined || v === '') ? '0.0000000000' : K.toSheetP(K.parseP(typeof v === 'number' ? v.toFixed(10) : v));
  // ---------- nilai LH: rumus yang SAMA dengan daftar LH di Kelola PK (getNominalPKAkurat di aplikasi) ----------
  const parseAkurat = (val) => {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    let s = String(val).trim().replace(/[^0-9.,-]/g, '');
    if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',')) s = s.replace(/\,/g, '.');
    else if (s.includes('.')) {
      if (s.startsWith('0.')) return parseFloat(s) || 0;
      const parts = s.split('.');
      if (parts.length > 2 || parts[parts.length - 1].length === 3) s = s.replace(/\./g, '');
    }
    return parseFloat(s) || 0;
  };
  const nilaiLhApp = (lh, master, alias) => {
    const d = (lh && lh.data) || {}; const idx = (master && master.app) || {};
    const P = (nm) => idx[String(an(String(nm || '').trim(), alias)).trim().toLowerCase()] || { m: 0, j: 0, b: 0 };
    let tot = 0;
    const row = (it, type) => {
      if (!it || !it.nama) return 0;
      const p = P(it.nama); let hm = 0, hj = 0;
      if (type === 'MDU') { hm = p.m > 0 ? p.m : parseAkurat(it.harga); hj = p.j > 0 ? p.j : 0; }
      else if (type === 'PASANG') { hm = p.m > 0 ? p.m : 0; hj = p.j > 0 ? p.j : parseAkurat(it.harga); }
      else { hm = 0; hj = p.b > 0 ? p.b : parseAkurat(it.harga); }
      let v = parseAkurat(it.pln) + parseAkurat(it.pemb); if (v === 0 && it.jumlah) v = parseAkurat(it.jumlah);
      return hm * v + hj * v;
    };
    (d.materialMdu || []).forEach((it) => { tot += row(it, 'MDU'); });
    (d.materialKonstruksi || []).forEach((it) => { tot += row(it, 'MDU'); });
    (d.uraianPasang || []).forEach((it) => { tot += row(it, 'PASANG'); });
    (d.uraianBongkar || []).forEach((it) => { tot += row(it, 'BONGKAR'); });
    if (tot === 0 && d.nominal_rab) tot = parseAkurat(d.nominal_rab);
    return tot;
  };
  // Jumlah material di LH yang tidak punya harga: namanya tidak ada di Master data dan tidak ada harga yang diketik di LH.
  // Daftar material LH yang tidak punya harga (nama tidak ada di Master data dan LH tidak mengisi harga): [{ nama, grup }]
  const tanpaHargaDaftar = (lh, master, alias) => {
    const d = (lh && lh.data) || {}; const idx = (master && master.app) || {}; const out = [];
    const cek = (arr, grup) => (arr || []).forEach((it) => {
      if (!it || !it.nama) return;
      let v = parseAkurat(it.pln) + parseAkurat(it.pemb); if (v === 0 && it.jumlah) v = parseAkurat(it.jumlah);
      if (v === 0) return;
      const p = idx[String(an(String(it.nama).trim(), alias)).trim().toLowerCase()];
      if (!p && parseAkurat(it.harga) === 0) out.push({ nama: String(it.nama).trim(), grup });
    });
    cek(d.materialMdu, 'Material MDU'); cek(d.materialKonstruksi, 'Material konstruksi'); cek(d.uraianPasang, 'Uraian pasang'); cek(d.uraianBongkar, 'Uraian bongkar');
    return out;
  };
  const tanpaHargaLh = (lh, master, alias) => tanpaHargaDaftar(lh, master, alias).length;  const fmtRpN = (n) => 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.round(n || 0));  const buildMaster = (db, conv) => {
    const list = [], byNorm = {}, app = {}, byId = {};
    (db || []).forEach((m) => {
      const raw = m._raw || [];
      const nama = String(m.Nama_Item || raw[2] || '').trim();
      if (!nama) return;
      const e = { id: String(m.ID_Item || raw[0] || ''), tipe: String(m.Tipe || raw[1] || ''), nama, sat: String(m.Satuan || raw[3] || ''),
        pm: cellP(raw[4] !== undefined ? raw[4] : m.Harga_Material), pj: cellP(raw[5] !== undefined ? raw[5] : m.Harga_Jasa), pb: cellP(raw[6] !== undefined ? raw[6] : m.Harga_Bongkar), norm: norm(nama), low: nama.toLowerCase(), tok: tokens(nama) };
      list.push(e);
      if (!byNorm[e.norm]) byNorm[e.norm] = e;
      if (e.id && !byId[e.id]) byId[e.id] = e;
      const lk = nama.toLowerCase(); if (!app[lk]) app[lk] = { m: parseAkurat(m.Harga_Material || raw[4]), j: parseAkurat(m.Harga_Jasa || raw[5]), b: parseAkurat(m.Harga_Bongkar || raw[6]) };
    });
    // Convert material: nama pokok (nama panjang KTK) dengan padanannya di Master data.
    //  - byNorm[pokok]  : bila salah satu padanan ada di Master data, nama pokok memakai harga/satuan padanan itu
    //  - pokokList      : semua nama pokok, jadi rekomendasi nama di KTK saja (tidak mengotori daftar Master data untuk LH)
    //  - pokokSet       : nama pokok sah (tidak merah di KTK) walau belum punya harga
    const pokokList = [], pokokSet = {};
    (conv || []).forEach((r, i) => {
      const pk = String(r[0] || '').trim(); if (!pk) return;
      const pn = norm(pk); if (pokokList.some((x) => x.norm === pn)) return;
      const alts = [r[1], r[2], r[3]].map((x) => String(x || '').trim()).filter(Boolean);
      const nmMaster = String(r[5] || '').trim(), idMaster = String(r[4] || '').trim();
      // satu baris = satu kelompok nama yang setara (pokok, mungkin 1-3, nama di Master data), tanpa arah
      const semua = [pk].concat(alts, nmMaster ? [nmMaster] : []);
      // baris Master data yang ditunjuk: lewat ID, lalu nama master, lalu nama pokok, lalu nama mungkin
      let base = (idMaster && byId[idMaster]) || (nmMaster && byNorm[norm(nmMaster)]) || byNorm[pn] || null;
      if (!base) for (let j = 0; j < alts.length && !base; j++) base = byNorm[norm(alts[j])] || null;
      const e = { id: 'pk' + i, tipe: 'KTK', pokok: true, nama: pk, alts, sat: base ? base.sat : '', pm: base ? base.pm : '0', pj: base ? base.pj : '0', hasBase: !!base, masterId: base ? base.id : '', norm: pn, low: semua.join(' ').toLowerCase(), tok: tokens(pk) };
      pokokSet[pn] = e; pokokList.push(e);
      semua.forEach((nm) => {
        const n = norm(nm); if (!n) return;
        if (!pokokSet[n]) pokokSet[n] = { ...e, nama: nm, norm: n };   // nama apa pun dalam kelompok dikenal (tidak merah) di KTK
        if (base && !byNorm[n]) byNorm[n] = { ...base, nama: nm, norm: n, low: nm.toLowerCase(), tok: tokens(nm), pokok: true };   // dan memakai harga/satuan Master data yang sama
      });
    });
    return { list, byNorm, app, pokokList, pokokSet, byId };
  };
  const similar = (nama, master) => {
    const t = tokens(nama); if (!t.length) return [];
    const ts = new Set(t);
    return master.list.map((e) => {
      let hit = 0; e.tok.forEach((x) => { if (ts.has(x)) hit++; });
      return { e, s: hit / (ts.size + e.tok.length - hit) };
    }).filter((x) => x.s >= 0.5).sort((a, b) => b.s - a.s).slice(0, 4).map((x) => x.e);
  };

  // ---------- data LH ----------
  // Volume LH = PLN + pembangunan; bila keduanya kosong pakai jumlah (dihitung sebagai Pemb). Arti kolom ini belum dikonfirmasi user.
  // Kolom jumlah saja: material utama (MDU), bongkar, dan retour adalah volume PLN (sesuai lembar RAB). Uraian pasang yang hanya berisi jumlah dihitung sebagai Pemb.
  const itemVols = (it, sec) => {
    let d = K.parseV(it.pln), e = K.parseV(it.pemb);
    if (d === Z && e === Z && it.jumlah) { if (sec === 'pasang' || sec === undefined) e = K.parseV(it.jumlah); else d = K.parseV(it.jumlah); }
    return { d, e };
  };
  const lhSections = (lh) => {
    const d = (lh && lh.data) || {};
    return { mdu: d.materialMdu || [], kons: d.materialKonstruksi || [], pasang: d.uraianPasang || [], bongkar: d.uraianBongkar || [], retur: [].concat(d.returBekas || [], d.returBaru || []) };
  };
  const SRC = [['pasang', 'Uraian pasang'], ['mdu', 'Material MDU dan konstruksi'], ['bongkar', 'Uraian bongkar']];
  // Pasang dan bongkar dipisah: LH uraian bongkar dibandingkan dengan paket Pembongkaran, sisanya dengan paket Pemasangan.
  // Penyesuaian nama per kontrak: nama di LH -> nama di kontrak (alias, dipilih Admin SPK dari rekomendasi kemiripan)
  const an = (nama, alias) => (alias && alias[norm(nama)]) ? alias[norm(nama)] : nama;
  const cekItemsSec = (lh, src, alias) => {
    const s = lhSections(lh); const out = [];
    const add = (arr, sec) => (arr || []).filter((it) => it && String(it.nama || '').trim()).forEach((it) => { const v = itemVols(it); if (v.d + v.e !== Z) { const orig = String(it.nama).trim(); out.push({ nama: an(orig, alias), orig, sat: it.satuan || '', vol: v.d + v.e, sec, cat: String(it.catatan || '').trim(), harga: it.harga }); } });
    if (src.pasang) add(s.pasang, 'pasang');
    if (src.mdu) { add(s.mdu, 'pasang'); add(s.kons, 'pasang'); }
    if (src.bongkar) add(s.bongkar, 'bongkar');
    return out;
  };
  // Kemiripan nama (0..1) dari jarak edit pada nama tanpa spasi. Dipakai untuk rekomendasi bila >= 80%.
  const simRatio = (a, b) => {
    a = norm(a); b = norm(b);
    if (a === b) return 1;
    // angka pada nama (ukuran, tipe seperti A2 dan A3) harus sama persis; beda angka berarti barang berbeda
    const dg = (s) => (s.match(/\d+/g) || []).join( );
    if (dg(a) !== dg(b)) return 0;
    const n = Math.max(a.length, b.length); if (!n) return 0;
    const lim = Math.floor(n * 0.2); if (Math.abs(a.length - b.length) > lim) return 0;
    let prev = []; for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      const cur = [i]; let min = i;
      for (let j = 1; j <= b.length; j++) { const c = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1)); cur[j] = c; if (c < min) min = c; }
      if (min > lim) return 0;
      prev = cur;
    }
    const r = 1 - prev[b.length] / n; return r >= 0.8 ? r : 0;
  };
  // Rekomendasi nama kontrak untuk satu material LH yang namanya tidak ada di kontrak (kemiripan >= 80%).
  const recOf = (kontrak, sec, nama) => {
    let best = null;
    Object.keys(kontrak[sec] || {}).forEach((k) => { const kt = kontrak[sec][k]; const r = simRatio(nama, kt.nama); if (r && (!best || r > best.r)) best = { nama: kt.nama, r }; });
    return best;
  };  const kosongK = (kontrak) => !Object.keys(kontrak.pasang).length && !Object.keys(kontrak.bongkar).length;
  const recMaster = (master, nama) => {
    let best = null;
    master.list.forEach((e) => { const r = simRatio(nama, e.nama); if (r && (!best || r > best.r)) best = { nama: e.nama, r }; });
    return best;
  };
  const recAny = (kontrak, master, sec, nama) => {
    const a = recOf(kontrak, sec, nama); if (a) return a;
    const b = master && master.list.length ? recMaster(master, nama) : null;
    return b ? { ...b, dariMaster: true } : null;
  };
  const kindOfPaket = (p) => /bongkar/i.test(p.nama) ? 'bongkar' : 'pasang';
  // KTK jenis 62 (per PK): satu paket memuat material pasang dan baris "Bongkar ..." sekaligus, jadi pasang/bongkar ditentukan per baris dari namanya.
  // Jenis lain: ditentukan dari nama paket (paket Pembongkaran terpisah).
  const is62 = (doc) => !!doc && String(doc.jenis) === '62';
  const secOfItem = (doc, p, it) => is62(doc) ? (/^\s*bong(k)?ar/i.test(it.nama) ? 'bongkar' : 'pasang') : kindOfPaket(p);
  const ckey = (sec, nama) => sec + '|' + norm(nama);

  const buildContract = (doc) => {
    const m = { pasang: {}, bongkar: {} };
    if (!doc) return m;
    doc.paket.forEach((p) => { if (!p.dipakai) return; p.items.forEach((it) => {
      if (it.tipe !== 'item') return;
      const mm = m[secOfItem(doc, p, it)];
      const k = norm(it.nama); const e = mm[k] || (mm[k] = { nama: it.nama, sat: it.sat, vol: Z, pm: K.parseP(it.pm), pj: K.parseP(it.pj) });
      e.vol += K.parseV(it.vol);
    }); });
    return m;
  };
  const buildUsage = (myPks, lhs, src, alias) => {
    const out = {}; const by = {};
    (lhs || []).forEach((l) => { const k = String(l.pk_id).trim(); (by[k] || (by[k] = [])).push(l); });
    myPks.forEach((p) => {
      const id = String(p.id).trim(); const mat = {}; const list = [];
      (by[id] || []).forEach((l) => {
        const its = cekItemsSec(l, src, alias);
        its.forEach((it) => { const k = ckey(it.sec, it.nama); const e = mat[k] || (mat[k] = { nama: it.nama, orig: it.orig, sat: it.sat, vol: Z, sec: it.sec, nk: norm(it.nama) }); e.vol += it.vol; });
        list.push({ id: l.id, tanggal: l.tanggal, lh: l, items: its });
      });
      out[id] = { mat, list };
    });
    return out;
  };
  const buildCek = (usage, kontrak) => {
    const stat = {}, total = {};
    Object.keys(usage).forEach((id) => { const mm = usage[id].mat; Object.keys(mm).forEach((k) => { total[k] = (total[k] || Z) + mm[k].vol; }); });
    Object.keys(usage).forEach((pkId) => {
      const u = usage[pkId];
      stat[pkId] = Object.keys(u.mat).map((k) => {
        const um = u.mat[k];
        const lain = (total[k] || Z) - um.vol;   // dipakai PK lain = total semua PK dikurangi milik PK ini
        const ini = um.vol, kt = kontrak[um.sec][um.nk];
        const kind = !kt ? 'missing' : (kt.vol - lain - ini < Z ? 'over' : 'ok');
        return { k, sec: um.sec, nk: um.nk, nama: kt ? kt.nama : um.nama, lhNama: um.nama, sat: um.sat || (kt && kt.sat) || '', kontrak: kt ? kt.vol : null, lain, ini, sisa: kt ? kt.vol - lain - ini : null, kind };
      }).sort((a, b) => (a.kind === 'ok') - (b.kind === 'ok') || a.nama.localeCompare(b.nama));
    });
    return stat;
  };
  // RAB satu PK: harga satuan dari kontrak. material = Pemb x harga material, jasa = (PLN + Pemb) x harga jasa.
  const RAB_SEC = [['mdu', 'Material utama'], ['kons', 'Material konstruksi'], ['pasang', 'Uraian pasang'], ['bongkar', 'Uraian bongkar'], ['retur', 'Retour']];
  const buildRab = (pkLhs, kontrak, alias, master) => {
    const secs = {}; const missing = {};
    RAB_SEC.forEach(([k]) => { secs[k] = []; });
    pkLhs.forEach((lh) => {
      const s = lhSections(lh);
      RAB_SEC.forEach(([k]) => (s[k] || []).forEach((it) => {
        const nama = String((it && it.nama) || '').trim(); if (!nama) return;
        const { d, e } = itemVols(it, k);
        if (d === Z && e === Z) return;
        const nk = norm(an(nama, alias)), kt = kontrak[k === 'bongkar' ? 'bongkar' : 'pasang'][nk];
        // harga satuan: dari kontrak; bila material belum ada di kontrak, dari Master data (RAB langsung terhitung tanpa cetak)
        let pmv = kt ? kt.pm : null, pjv = kt ? kt.pj : null, dariMaster = false;
        if (!kt && master && k !== 'retur') { const mm = master.byNorm[nk]; if (mm) { pmv = K.parseP(mm.pm); pjv = K.parseP(mm.pj); if (k === 'bongkar' && pjv === Z) pjv = K.parseP(mm.pb); dariMaster = true; } }
        if (k === 'retur') { pmv = null; pjv = null; dariMaster = false; }   // retour: tanpa harga sama sekali, hanya volume
        const ex = secs[k].find((r) => r.nk === nk);
        if (ex) { ex.d += d; ex.e += e; return; }              // nama sama di LH lain: volumenya dijumlah
        if (k !== 'retur' && !kt) missing[nk] = true;
        secs[k].push({ nk, nama, sat: it.satuan || '', d, e, pm: pmv, pj: pjv, inKontrak: !!kt, dariMaster });
      }));
    });
    let th = Z, ti = Z;
    RAB_SEC.forEach(([k]) => secs[k].forEach((r) => {
      if (k === 'retur') { r.h = r.i = r.j = null; return; }    // retour: hanya volume, tanpa nilai
      r.h = r.pm === null ? Z : K.mul(r.pm, r.e);
      r.i = r.pj === null ? Z : K.mul(r.pj, r.d + r.e);
      r.j = r.h + r.i; th += r.h; ti += r.i;
    }));
    return { secs, th, ti, missing: Object.keys(missing).length };
  };
  // ---------- sel angka: tampil 2 desimal saat diam, penuh saat fokus ----------
  // ---------- input nama material dengan sugesti dari Master data ----------
  // Ringan: ketikan disimpan lokal (tidak menggambar ulang seluruh kontrak), pencarian ditunda 120 ms dan dibatasi 8 hasil.
  // Perubahan baru masuk ke kontrak saat memilih sugesti atau keluar dari kolom.
  function NameCell({ value, master, onCommit, onPick, placeholder, className, withPokok }) {
    const [txt, setTxt] = useState(value);
    const [focus, setFocus] = useState(false);
    const [hits, setHits] = useState([]);
    const [act, setAct] = useState(0);
    const [pos, setPos] = useState(null);
    const ref = useRef(null); const timer = useRef(null);
    useEffect(() => { if (!focus) setTxt(value); }, [value, focus]);
    useEffect(() => () => clearTimeout(timer.current), []);
    useEffect(() => {
      if (!hits.length) return;
      const close = () => setHits([]);
      window.addEventListener('scroll', close, true); window.addEventListener('resize', close);
      return () => { window.removeEventListener('scroll', close, true); window.removeEventListener('resize', close); };
    }, [hits.length]);
    const search = (t) => {
      const s = t.trim().toLowerCase(); if (s.length < 2) return [];
      const ws = s.split(/\s+/), L = withPokok && master.pokokList.length ? master.pokokList.concat(master.list) : master.list, a = [], b = [];
      for (let i = 0; i < L.length && a.length + b.length < 60; i++) {
        const low = L[i].low; let ok = true;
        for (let j = 0; j < ws.length; j++) if (low.indexOf(ws[j]) < 0) { ok = false; break; }
        if (ok) (low.indexOf(ws[0]) === 0 ? a : b).push(L[i]);
      }
      return a.concat(b).slice(0, 8);
    };
    const pick = (e) => { setTxt(e.nama); setHits([]); onPick(e); };
    const place = () => { const r = ref.current && ref.current.getBoundingClientRect(); if (r) setPos({ l: r.left, t: r.bottom + 2, w: r.width }); };
    return (
      <>
        <input ref={ref} value={txt} placeholder={placeholder} title={txt} autoComplete="off" className={className}
          onFocus={() => { setFocus(true); place(); }}
          onChange={(e) => { const v = e.target.value; setTxt(v); clearTimeout(timer.current); timer.current = setTimeout(() => { place(); setHits(search(v)); setAct(0); }, 120); }}
          onBlur={() => { clearTimeout(timer.current); setFocus(false); setHits([]); if (txt !== value) onCommit(txt); }}
          onKeyDown={(e) => {
            if (e.key === 'ArrowDown' && hits.length) { e.preventDefault(); setAct(Math.min(act + 1, hits.length - 1)); }
            else if (e.key === 'ArrowUp' && hits.length) { e.preventDefault(); setAct(Math.max(act - 1, 0)); }
            else if (e.key === 'Enter' && hits.length) { e.preventDefault(); pick(hits[act]); }
            else if (e.key === 'Escape') setHits([]);
          }} />
        {focus && hits.length > 0 && pos && ReactDOM.createPortal(
          <div className="fixed z-[95] bg-white border border-[#D9DDE9] rounded-lg shadow-lg overflow-hidden" style={{ left: pos.l, top: pos.t, width: Math.max(pos.w, 440) }}>
            {hits.map((e, i) => (
              <div key={e.id + e.nama} onMouseDown={(ev) => { ev.preventDefault(); pick(e); }} onMouseEnter={() => setAct(i)}
                className={`px-3 py-1.5 cursor-pointer leading-snug ${i === act ? 'bg-[#E9EEFA]' : 'hover:bg-[#F4F6FB]'}`}>
                <div className="truncate">{e.nama}</div>
                <div className="text-[12px] text-[#6B665E] truncate">{e.pokok ? 'Nama pokok' + (e.alts.length ? ' · di LH: ' + e.alts.join(' | ') : ' · belum ada padanan') + (e.hasBase ? ' · ' + K.fmt2(K.parseP(e.pm)) + ' / ' + K.fmt2(K.parseP(e.pj)) : '') : <>{e.tipe}{e.sat ? ' · ' + e.sat : ''} · {K.fmt2(K.parseP(e.pm))} / {K.fmt2(K.parseP(e.pj))}</>}</div>
              </div>))}
          </div>, document.body)}
      </>
    );
  }

  // input biasa dengan penundaan (untuk kolom cari di panel samping)
  function DebInput({ value, onValue, delay, ...rest }) {
    const [v, setV] = useState(value); const timer = useRef(null);
    useEffect(() => { setV(value); }, [value]);
    useEffect(() => () => clearTimeout(timer.current), []);
    return <input {...rest} value={v} onChange={(e) => { const x = e.target.value; setV(x); clearTimeout(timer.current); timer.current = setTimeout(() => onValue(x), delay || 150); }} />;
  }
  function NumCell({ value, kind, onChange, onNormalize, locked }) {
    const [focus, setFocus] = useState(false);
    const [txt, setTxt] = useState('');
    const ok = K.valid(focus ? txt : value);
    const shown = focus ? txt : (kind === 'vol' ? K.fmtVol(K.parseV(value)) : K.fmt2(K.parseP(value)));
    return (
      <input value={shown} inputMode="decimal" readOnly={!!locked} data-nav={kind === 'vol' ? 'vol' : undefined}
        onKeyDown={(e) => { if (kind === 'vol' && (e.key === 'Enter' || e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const all = Array.from(document.querySelectorAll('input[data-nav="vol"]')); const i = all.indexOf(e.target); const nx = all[i + (e.key === 'ArrowUp' ? -1 : 1)]; if (nx) nx.focus(); } }} title={locked ? 'Harga dikunci. Kontrak sudah final.' : undefined}
        onFocus={(e) => {
          const t = kind === 'vol' ? K.fmtVol(K.parseV(value)) : K.fmtFull(K.parseP(value), 0);
          setTxt(t === '0' ? '' : t); setFocus(true); const el = e.target; setTimeout(() => el.select(), 0);
        }}
        onChange={(e) => { setTxt(e.target.value); onChange(e.target.value); }}
        onBlur={() => { setFocus(false); onNormalize(); }}
        className={`w-full h-[30px] px-1 text-right text-[13px] bg-transparent outline-none border-b num ${kind === 'vol' ? 'font-medium' : ''} ${ok ? (kind === 'vol' ? 'border-[#D9DDE9]' : 'border-transparent hover:border-[#D9DDE9]') + ' focus:border-[#3A62B0]' : 'border-[#B42318] bg-[#FDF3F2]'}`} />
    );
  }

    const CGRID = 'minmax(220px,1.6fr) 140px 130px 200px';
    const Rows = ({ items, hiddenMode }) => items.map((c) => (
      <div key={c.id} className="grid gap-4 items-center px-5 py-2.5 border-t border-[#EEF0F7] hover:bg-[#F9FAFD]" style={{ gridTemplateColumns: CGRID }}>
        <div className="min-w-0">
          <div className="font-medium truncate text-[#3A62B0]" title={c.id}>{c.id}</div>
          <div className="truncate text-[#6B665E]" title={c.nama}>{c.nama || '-'}{c.pending ? <span className="ml-2 text-[#B7791F]">menunggu persetujuan</span> : null}</div>
        </div>
        <span className="truncate text-[#6B665E]">{c.ulp || '-'}</span>
        <span className="num text-[#2B2F3A]">{c.nominal ? rp(c.nominal) : '-'}</span>
        <div className="flex items-center justify-end gap-2">
          {hiddenMode ? <UI.Btn className="!h-7" onClick={() => setHide(c, false)}>Tampilkan lagi</UI.Btn> : (<>
            <button title="Sembunyikan SPK ini" onClick={() => setHide(c, true)} className="w-7 h-7 rounded-md text-[#A3A9B8] hover:bg-[#EEF0F7] hover:text-[#6B665E]"><i className="fa-solid fa-eye-slash text-[11px]"></i></button>
            {c.pending && !ADMIN_SPK ? <span className="text-[12px] text-[#6B665E]">menunggu Admin SPK</span>
              : <UI.Btn kind="primary" className="!h-8 !px-4" disabled={working === c.id} onClick={() => bukaFolder(c)}>{working === c.id ? 'Memproses...' : 'Buat KTK'}</UI.Btn>}
          </>)}
        </div>
      </div>));    const fld = (k, label, ph) => (
      <label className="block"><span className="block text-[12px] text-[#6B665E] mb-1.5">{label}</span>
        <input value={form[k]} placeholder={ph || ''} onChange={(e) => setForm({ ...form, [k]: e.target.value })} className="w-full h-8 px-3 border border-[#D9DDE9] rounded-lg bg-white text-[13px] outline-none focus:border-[#3A62B0]" /></label>
    );
    return (
      <div className="space-y-4 pt-2">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <h1 className="text-[22px] leading-[30px] font-medium tracking-tight">KTK</h1>
          <div className="flex items-center gap-3">
            <input id="ktk-cari" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Cari nomor SPK, pelanggan, atau wilayah" className="w-[320px] max-w-full h-8 px-3 border border-[#D9DDE9] rounded-lg bg-white text-[13px] outline-none focus:border-[#3A62B0]" />
            <UI.Btn kind="primary" className="!h-8" onClick={() => { setView('perlu'); setShowHid(false); setTimeout(() => { const el = document.getElementById('ktk-cari'); if (el) { el.focus(); el.select(); } }, 30); }}><i className="fa-solid fa-plus text-[11px]"></i>Kontrak baru</UI.Btn>
          </div>
        </div>

        <nav className="flex gap-7 border-b border-[#E6E9F2]">
          {[['perlu', 'Perlu dibuat KTK', visible.length], ['kontrak', 'Kontrak', all.length], ['periksa', 'Periksa LH', null], ['template', 'Template', null]].map(([k, label, n]) => (
            <button key={k} onClick={() => { setView(k); setShowHid(false); }} className={`h-9 -mb-px border-b-2 flex items-center gap-1.5 ${curView === k ? 'border-[#3A62B0] text-[#2B2F3A] font-medium' : 'border-transparent text-[#7A8190]'}`}>{label}{n !== null && <span className={curView === k ? 'text-[#3A62B0]' : ''}>{n}</span>}</button>))}
          {curView === 'perlu' && hiddenList.length > 0 && <button onClick={() => setShowHid(!showHid)} className="ml-auto h-9 text-[12px] text-[#3A62B0] hover:underline">{showHid ? 'Kembali ke daftar' : 'Disembunyikan (' + hiddenList.length + ')'}</button>}
        </nav>

        {list === null && <div className="text-[#6B665E] py-6"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Memuat...</div>}

        {curView === 'perlu' && (
          <section className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden">
            {secItems.length > 0
              ? <Rows items={secItems.slice(0, 200)} hiddenMode={showHid} />
              : <UI.Empty>{showHid ? 'Tidak ada SPK yang disembunyikan.' : (qt ? 'Tidak ada SPK yang cocok.' : 'Semua SPK sudah punya KTK.')}</UI.Empty>}
          </section>
        )}

        {curView === 'periksa' && <LhPeriksaTab lhs={lhsAll} pks={pksAll} masterDatabase={masterAll} setLhs={setLhsAll} canSel={role === 'Super Admin' || role === 'Admin SPK'} showToast={showToast} />}

        {curView === 'template' && (
          <section className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden">
            <div className="flex flex-wrap items-center gap-2 px-5 py-3 border-b border-[#EEF0F7]">
              <span className="text-[12px] text-[#6B665E] mr-1">Jenis KTK</span>
              {JENIS.map((j) => (
                <button key={j} onClick={() => setTplJ(j)} className={`h-8 px-3.5 rounded-lg border ${tplJ === j ? 'bg-[#E9EEFA] border-[#9FB0D2] text-[#3A62B0]' : 'bg-white border-[#D9DDE9] text-[#4A463F] hover:border-[#9FB0D2]'}`}>KTK {j} <span className="text-[12px] text-[#8A93A3]">{(tplData && tplData[j]) ? tplData[j].paket.length : (tplCount[j] || 0)}</span></button>))}
              <span className="flex-1"></span>
              {!tplEdit && tplData && <span className="text-[12px] text-[#6B665E]">Hanya dilihat. Mengubah template oleh Admin SPK dan Super Admin.</span>}
            </div>
            {tplData === null && <div className="px-5 py-6 text-[#6B665E]"><i className="fa-solid fa-spinner fa-spin mr-2"></i>Memuat template...</div>}
            {tplData && (tplData[tplJ].paket.length === 0
              ? <div className="px-5 py-6 text-[#6B665E] max-w-3xl">Template KTK {tplJ} masih kosong. Cara mengisinya: buat KTK jenis {tplJ} (tombol Buat KTK, pilih jenis {tplJ}), susun paket dan materialnya di dalam kontrak, lalu klik ikon penanda di baris paket dan tekan Simpan. Paket itu masuk ke template ini dengan volume 0. Paket dari jenis lain juga bisa disalin ke sini.</div>
              : tplData[tplJ].paket.map((p, i) => (
                <div key={p.id} className="flex items-center gap-3 px-5 py-2.5 border-b border-[#EEF0F7] last:border-b-0">
                  <span className="w-5 text-[#6B665E]">{i + 1}</span>
                  <span className="flex-1 min-w-0 truncate" title={p.nama}>{p.nama}</span>
                  <span className="text-[12px] text-[#6B665E] whitespace-nowrap">{p.nItem} material</span>
                  {tplEdit && <>
                    {JENIS.filter((j) => j !== tplJ).map((j) => <button key={j} onClick={() => tplOp('salin', { id: p.id, ke: j }, 'Paket disalin ke template KTK ' + j + '.')} className="text-[12px] text-[#3A62B0] hover:underline whitespace-nowrap" title={'Salin paket ini ke template KTK ' + j + ' (paket bernama sama diganti)'}>Salin ke {j}</button>)}
                    <button onClick={() => tplRename(p)} className="w-7 h-7 rounded-md text-[#6B665E] hover:bg-[#EEF0F7]" title="Ganti nama"><i className="fa-solid fa-pen text-[11px]"></i></button>
                    <button onClick={() => tplDelete(p)} className="w-7 h-7 rounded-md text-[#B8B2A6] hover:text-[#B42318] hover:bg-[#FDF3F2]" title="Hapus dari template"><i className="fa-solid fa-trash text-[11px]"></i></button>
                  </>}
                </div>)))}
          </section>)}
        {curView === 'kontrak' && list !== null && (() => {
          const known = {}; folders.forEach((f) => { known[f.id] = true; });
          const byF = {}; kontrak.forEach((k) => { if (known[k.folderId]) (byF[k.folderId] = byF[k.folderId] || []).push(k); });
          const orphan = kontrak.filter((k) => !known[k.folderId]);            // kontrak lama tanpa folder (hanya terlihat Super Admin)
          const groups = folders.map((f) => ({ f, items: byF[f.id] || [] })).filter((g) => !qt || g.items.length);
          if (!groups.length && !orphan.length) return <UI.Empty>{qt ? 'Tidak ada kontrak yang cocok.' : 'Belum ada folder atau kontrak. Pilih SPK di tab Perlu dibuat KTK, lalu tekan Buat KTK. Anda akan diminta membuat folder dulu.'}</UI.Empty>;
          const GR = 'minmax(0,1fr) 80px 90px 130px 170px 150px';
          const Row = ({ k, legacy }) => (
            <div role="button" tabIndex={0} onClick={() => onOpen(k.id)} onKeyDown={(e) => { if (e.key === 'Enter') onOpen(k.id); }} className="w-full text-left grid gap-4 items-center px-5 py-2.5 border-b border-[#EEF0F7] last:border-b-0 hover:bg-[#F9FAFD] cursor-pointer" style={{ gridTemplateColumns: GR }}>
              <div className="min-w-0"><div className="text-[14px] font-medium truncate">{k.no}</div><div className="text-[#6B665E] truncate">{k.nama}{k.vendor ? ' · ' + k.vendor : ''}</div></div>
              <span className="text-[#6B665E]">KTK {k.jenis}</span>
              <UI.Status tone={k.status === 'Draf' ? 'warn' : 'ok'}>{k.status}</UI.Status>
              <span className="num">{k.itemBerVolume}</span>
              <span className="num text-[15px] font-medium">{rp(k.totalBulat)}</span>
              <span className="text-right flex items-center justify-end gap-3">
                {legacy ? <button onClick={(e) => { e.stopPropagation(); moveKtk(k); }} className="text-[#3A62B0] hover:underline">Pindahkan</button> : (<>
                  {bolehKembali(k) && <button data-testid="kembalikan-ktk" disabled={working === k.id} onClick={(e) => { e.stopPropagation(); kembalikanKtk(k); }} className="text-[#3A62B0] hover:underline disabled:opacity-40" title="Kembalikan ke daftar Perlu dibuat KTK agar bisa dibuat ulang">{working === k.id ? 'Memproses...' : 'Kembalikan'}</button>}
                  <i className="fa-solid fa-chevron-right text-[11px] text-[#8A857C]"></i></>)}</span>
            </div>);
          const Head = () => (
            <div className="grid gap-4 px-5 py-1.5 border-b border-[#E6E9F2] bg-[#F9FAFD] text-[12px] text-[#6B665E]" style={{ gridTemplateColumns: GR }}>
              <span>Kontrak</span><span>Jenis</span><span>Status</span><span className="text-right">Material bervolume</span><span className="text-right">Total nilai awal</span><span></span>
            </div>);
          return (
            <div className="space-y-4">
              {groups.map(({ f, items }) => {
                const own = me && f.pemilik === me.id; const isClosed = !!closed[f.id] && !qt;
                return (
                  <section key={f.id} className="bg-white border border-[#E6E9F2] rounded-xl overflow-hidden">
                    <div onClick={() => setClosed({ ...closed, [f.id]: !closed[f.id] })} role="button" tabIndex={0} className="flex items-center gap-3 px-5 h-11 bg-[#F4F6FB] cursor-pointer select-none" title={'ID folder: ' + f.id}>
                      <i className={`fa-solid fa-chevron-right text-[10px] text-[#6B665E] transition-transform ${isClosed ? '' : 'rotate-90'}`}></i>
                      <i className="fa-solid fa-folder text-[#3A62B0]"></i>
                      <span className="font-medium truncate">{f.nama}</span>
                      {(!own || (me && me.role === 'Super Admin')) && <span className="text-[12px] text-[#6B665E] truncate">· {f.pemilikNama || f.pemilik}</span>}
                      <span className="flex-1"></span>
                      <span className="text-[12px] text-[#6B665E]">{items.length} kontrak</span>
                      {me && me.role === 'Super Admin' && <button data-testid="pindah-hak-folder" title="Pindahkan hak akses folder ke admin lain" onClick={(e) => { e.stopPropagation(); pindahHakFolder(f); }} className="h-7 px-2 rounded-md text-[12px] text-[#3A62B0] hover:bg-[#E6E9F2]"><i className="fa-solid fa-user-gear text-[11px] mr-1.5"></i>Pindah hak akses</button>}
                      {(own || (me && me.role === 'Super Admin')) && <button title="Ganti nama folder" onClick={(e) => { e.stopPropagation(); renameFolder(f); }} className="w-7 h-7 rounded-md text-[#6B665E] hover:bg-[#E6E9F2]"><i className="fa-solid fa-pen text-[11px]"></i></button>}
                    </div>
                    {!isClosed && (items.length > 0
                      ? <><Head />{items.map((k) => <Row key={k.id} k={k} />)}</>
                      : <div className="px-5 py-3 text-[#6B665E]">Folder ini belum berisi kontrak. Pilih SPK di tab Perlu dibuat KTK, lalu pilih folder ini.</div>)}
                  </section>);
              })}
              {orphan.length > 0 && (
                <section className="bg-white border border-[#F0D9A8] rounded-xl overflow-hidden">
                  <div className="px-5 py-2.5 bg-[#FFF8E6] text-[#94620F]">Kontrak lama yang belum masuk folder ({orphan.length}). Hanya Super Admin yang melihatnya. Pindahkan ke folder admin yang mengerjakannya.</div>
                  <Head />{orphan.map((k) => <Row key={k.id} k={k} legacy />)}
                </section>)}
            </div>);
        })()}
        {curView === 'kontrak' && list === null && null}

        {fm && (
          <div className="fixed inset-0 z-[90] flex items-center justify-center bg-black/40 p-4" onMouseDown={(e) => { if (e.target === e.currentTarget && working !== fm.c.id) setFm(null); }}>
            <div className="bg-white rounded-2xl shadow-xl w-[480px] max-w-full">
              <div className="px-6 pt-5 pb-3">
                <div className="text-[16px] font-medium">Folder kerja KTK</div>
                <p className="text-[#6B665E] mt-1">SPK <b className="font-medium text-[#2B2F3A]">{fm.c.id}</b>. Tiap admin bekerja di folder miliknya sendiri, jadi kontrak dan LH tidak tercampur dengan admin lain. Tentukan folder dulu, baru memilih template paket.</p>
              </div>
              <div className="px-6 pb-3">
                <div className="text-[12px] text-[#6B665E] mb-1.5">Jenis KTK (template paket)</div>
                <div className="flex gap-2">{JENIS.map((j) => (
                  <button key={j} type="button" onClick={() => setFm({ ...fm, jenis: j })} className={'h-8 px-3.5 rounded-lg border ' + (fm.jenis === j ? 'bg-[#E9EEFA] border-[#9FB0D2] text-[#3A62B0]' : 'bg-white border-[#D9DDE9] text-[#4A463F] hover:border-[#9FB0D2]')}>KTK {j} <span className="text-[12px] text-[#8A93A3]">{tplCount[j] || 0} paket</span></button>))}</div>
                {!(tplCount[fm.jenis] > 0) && <p className="text-[12px] text-[#94620F] mt-1.5">Template KTK {fm.jenis} masih kosong. Paket bisa dibuat sendiri di dalam kontrak, lalu disimpan sebagai template.</p>}
              </div>
              <div className="px-6 pb-2 space-y-3">
                <label className="flex items-start gap-2.5 cursor-pointer"><input type="radio" className="mt-1" checked={fm.mode === 'pilih'} disabled={!(myFolders.length || folders.length)} onChange={() => setFm({ ...fm, mode: 'pilih', folderId: fm.folderId || (myFolders[0] || folders[0] || {}).id || '' })} />
                  <span className="flex-1"><span className="block">Pakai folder yang sudah ada</span>
                    <select disabled={fm.mode !== 'pilih'} value={fm.folderId} onChange={(e) => setFm({ ...fm, folderId: e.target.value })} className="mt-1.5 w-full h-8 px-2 border border-[#D9DDE9] rounded-lg bg-white outline-none focus:border-[#3A62B0] disabled:opacity-50">
                      {(myFolders.length ? myFolders : folders).concat(myFolders.length ? folders.filter((f) => me && f.pemilik !== me.id) : []).map((f) => <option key={f.id} value={f.id}>{f.nama}{me && f.pemilik !== me.id ? ' · ' + (f.pemilikNama || f.pemilik) : ''}</option>)}
                      {!(myFolders.length || folders.length) && <option value="">Belum ada folder</option>}
                    </select></span></label>
                <label className="flex items-start gap-2.5 cursor-pointer"><input type="radio" className="mt-1" checked={fm.mode === 'baru'} onChange={() => setFm({ ...fm, mode: 'baru' })} />
                  <span className="flex-1"><span className="block">Buat folder baru</span>
                    <input disabled={fm.mode !== 'baru'} value={fm.name} onChange={(e) => setFm({ ...fm, name: e.target.value })} onKeyDown={(e) => { if (e.key === 'Enter') buatKtk(); }} placeholder="Nama folder, mis. Pekerjaan Tabanan 2026" className="mt-1.5 w-full h-8 px-3 border border-[#D9DDE9] rounded-lg bg-white outline-none focus:border-[#3A62B0] disabled:opacity-50" /></span></label>
              </div>
              <div className="px-6 py-3 flex justify-end gap-2 border-t border-[#EEF0F7] mt-3"><UI.Btn onClick={() => setFm(null)} disabled={working === fm.c.id}>Batal</UI.Btn><UI.Btn kind="primary" disabled={working === fm.c.id} onClick={buatKtk}>{working === fm.c.id ? 'Memproses...' : 'Lanjut ke template'}</UI.Btn></div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const GRID = 'minmax(300px,1fr) 52px 100px 140px 140px 150px 56px';

  // ====================== BILAH SPK (dipakai Cek, RAB, Rekap) ======================
  const jenisOf = (p) => String(p.jenis_pekerjaan || '').trim() || 'Tanpa jenis';
  // pilihan jenis pekerjaan (dipakai saat kontrak belum dihubungkan ke SPK)
  function JenisBar({ pool, value, onChange }) {
    const m = {}; pool.forEach((p) => { const j = jenisOf(p); m[j] = (m[j] || 0) + 1; });
    const keys = Object.keys(m).sort((a, b) => m[b] - m[a]);
    const Chip = ({ id, label, n }) => (
      <button onClick={() => onChange(id)} className={`h-7 px-3 rounded-full border ${value === id ? 'bg-[#E9EEFA] border-[#9FB0D2] text-[#3A62B0] font-medium' : 'bg-white border-[#D9DDE9] text-[#4A463F] hover:border-[#9FB0D2]'}`}>{label} <span className="text-[#8A93A3]">{n}</span></button>);
    return (
      <div className="bg-white border border-[#E6E9F2] rounded-xl px-5 py-2.5 flex flex-wrap items-center gap-2">
        <span className="text-[12px] text-[#6B665E] mr-1">Jenis pekerjaan</span>
        <Chip id="" label="Semua" n={pool.length} />
        {keys.map((k) => <Chip key={k} id={k} label={k} n={m[k]} />)}
      </div>);
  }
  function SpkBar({ doc, spks, setIdSpk, note }) {
    return (
      <div className="bg-white border border-[#E6E9F2] rounded-xl px-5 py-2.5 flex flex-wrap items-center gap-x-8 gap-y-3">
        <label className="block min-w-[300px]"><span className="block text-[12px] text-[#6B665E] mb-1">SPK (boleh dikosongkan, hubungkan nanti)</span>
          <select value={doc.idSpk || ''} onChange={(e) => setIdSpk(e.target.value)} className="w-full h-8 px-2.5 border border-[#D9DDE9] rounded-lg bg-white outline-none focus:border-[#3A62B0]">
            <option value="">Tanpa SPK (rancang dulu)</option>
            {(spks || []).filter((s) => !/^menunggu/i.test(String(s.status || ''))).map((s) => <option key={s.id} value={s.id}>{s.id} · {s.nama}</option>)}
          </select></label>
        {note}
      </div>
    );
  }

  // ====================== TAB CEK LH ======================
  function LhEditor({ lh, onSave, onClose }) {
    // koreksi volume LH di tempat: pasang (PLN dan Pemb), lainnya (jumlah)
    const s = lhSections(lh);
    const groups = [['pasang', 'Uraian pasang', true], ['mdu', 'Material MDU', false], ['kons', 'Material konstruksi', false], ['bongkar', 'Uraian bongkar', false]];
    const [vals, setVals] = useState(() => {
      const v = {};
      groups.forEach(([g]) => (s[g] || []).forEach((it, i) => { v[g + i] = { pln: String(it.pln || ''), pemb: String(it.pemb || ''), jumlah: String(it.jumlah || '') }; }));
      return v;
    });
    const setV = (key, f, x) => setVals({ ...vals, [key]: { ...vals[key], [f]: x } });
    return (
      <div className="bg-[#F9FAFD] border-t border-[#EEF0F7] px-5 py-4">
        <p className="text-[#6B665E] mb-3">Koreksi volume yang salah input. Perubahan disimpan ke LH ini (catatan audit pada LH akan dihapus, sama seperti saat LH diedit).</p>
        {groups.map(([g, title, split]) => (s[g] || []).filter((it) => it && String(it.nama || '').trim()).length > 0 && (
          <div key={g} className="mb-3">
            <div className="text-[12px] text-[#6B665E] mb-1">{title}</div>
            {(s[g] || []).map((it, i) => !String(it.nama || '').trim() ? null : (
              <div key={i} className="grid items-center gap-3 py-1 border-b border-[#EEF0F7]" style={{ gridTemplateColumns: 'minmax(0,1fr) 40px 96px 96px' }}>
                <span className="leading-snug">{it.nama}</span><span className="text-[#6B665E]">{it.satuan}</span>
                {split ? (<>
                  <label className="text-[11px] text-[#6B665E]">PLN<input value={vals[g + i].pln} onChange={(e) => setV(g + i, 'pln', e.target.value)} className="w-full h-8 px-1 text-right text-[13px] bg-white border-b border-[#D9DDE9] outline-none focus:border-[#3A62B0] num" /></label>
                  <label className="text-[11px] text-[#6B665E]">Pemb<input value={vals[g + i].pemb} onChange={(e) => setV(g + i, 'pemb', e.target.value)} className="w-full h-8 px-1 text-right text-[13px] bg-white border-b border-[#D9DDE9] outline-none focus:border-[#3A62B0] num" /></label>
                </>) : (<>
                  <label className="text-[11px] text-[#6B665E] col-span-2">Jumlah<input value={vals[g + i].jumlah} onChange={(e) => setV(g + i, 'jumlah', e.target.value)} className="w-full h-8 px-1 text-right text-[13px] bg-white border-b border-[#D9DDE9] outline-none focus:border-[#3A62B0] num" /></label>
                </>)}
              </div>
            ))}
          </div>
        ))}
        <div className="flex gap-2 justify-end mt-2">
          <UI.Btn onClick={onClose}>Batal</UI.Btn>
          <UI.Btn kind="primary" onClick={() => onSave(vals)}>Simpan koreksi</UI.Btn>
        </div>
      </div>
    );
  }

  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, mei: 4, may: 4, jun: 5, jul: 6, agu: 7, agt: 7, aug: 7, sep: 8, okt: 9, oct: 9, nov: 10, des: 11, dec: 11 };
  const dateOf = (s) => {
    s = String(s || '').trim(); let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2] - 1, +m[3]).getTime();

                      const rec = kind === 'missing' ? (kosong ? (recMaster(master, it.nama) && { ...recMaster(master, it.nama), dariMaster: true }) : recAny(kontrak, master, it.sec, it.nama)) : null;
                      const bad = notInMaster(master, it.orig || it.nama);

                      // "sama" = huruf persis sama (besar-kecil huruf dan spasi ikut dihitung). Selisih huruf besar, spasi ganda, atau spasi tak terlihat TETAP ditawarkan Ubah di LH agar tulisan di LH menjadi persis tulisan Master data.
                      const sama = !!rec && rec.nama === String(it.orig || it.nama).trim();

                      return (
                        <div key={i} className="grid gap-3 items-center py-1.5 border-b border-[#EEF0F7] last:border-b-0" style={{ gridTemplateColumns: 'minmax(0,1fr) 50px 100px 100px 400px' }}>

                            {(bad || sama || noHrg) && <div className="text-[12px] flex flex-wrap items-center gap-x-2" data-testid="ktk-catatan-item">
                              {bad && <span className="text-[#B42318]">Bukan nama Master data</span>}
                              {noHrg && <span className="text-[#C77700]" data-testid="ktk-tanpa-harga">Tanpa harga</span>}
                              <button onClick={() => setInf({ ...inf, [kunciBk]: !inf[kunciBk] })} aria-expanded={!!inf[kunciBk]} className="text-[#3A62B0] hover:underline" data-testid="ktk-info-item">{inf[kunciBk] ? 'tutup keterangan' : 'keterangan'}</button>
                            </div>}
                            {inf[kunciBk] && <div className="text-[12px] text-[#6B665E] mt-0.5 space-y-0.5" data-testid="ktk-keterangan-item">
                              {bad && <div>Nama ini tidak ada di Master data. Ganti nama di LH (ikon pensil) dengan nama dari Master data.</div>}

                          <span className="text-[#6B665E]">{it.sat}</span>

        {nIn > 0 && (

                  <span className="num text-[#2F8F9D]">{fmtD(r.t)}</span>
                  <div className="min-w-0"><div className="truncate" title={r.pekerjaan}>{r.pekerjaan || r.p.nama || '-'}</div><div className="text-[11px] text-[#3A62B0]">{r.l.id}{takenMap[String(r.l.id)] && <span className="ml-2 text-[#B42318]">juga dipakai KTK {takenMap[String(r.l.id)]}. Keluarkan dari salah satu.</span>}</div></div>

  }

  // ====================== LAPORAN: pembantu bersama (RAB, Rekapitulasi, Lembar KTK) ======================
  // Cetak / simpan PDF dokumen KTK lewat iframe tersembunyi yang berisi SALINAN area cetak (.print-area) beserta gaya halaman.
  // Cara lama (menyembunyikan seluruh halaman lewat CSS lalu window.print) menghasilkan halaman kosong karena tata letak layar aplikasi ikut campur.
  // Isian yang sedang diketik (input, textarea, pilihan) ikut disalin nilainya; tombol dan elemen no-print tidak ikut tercetak.
  const cetakArea = () => {
    const el = document.querySelector('.print-area');
    if (!el) { Swal.fire({ icon: 'info', title: 'Belum ada dokumen untuk dicetak', text: 'Buka tab dokumennya dulu, tunggu sampai tampil, lalu klik Cetak.' }); return; }
    const salinan = el.cloneNode(true);
    const asli = el.querySelectorAll('input, textarea, select'), baru = salinan.querySelectorAll('input, textarea, select');
    asli.forEach((s, i) => {
      const d = baru[i]; if (!d) return;
      if (s.tagName === 'TEXTAREA') d.textContent = s.value;
      else if (s.tagName === 'SELECT') Array.from(d.options).forEach((o, j) => { if (j === s.selectedIndex) o.setAttribute('selected', 'selected'); else o.removeAttribute('selected'); });
      else if (s.type === 'checkbox' || s.type === 'radio') { if (s.checked) d.setAttribute('checked', 'checked'); else d.removeAttribute('checked'); }
      else d.setAttribute('value', s.value);
    });
    salinan.querySelectorAll('.no-print, button').forEach((n) => n.remove());
    let gaya = '';
    Array.from(document.styleSheets).forEach((sh) => {
      const on = sh.ownerNode;
      if (on && on.tagName === 'LINK' && on.href) { gaya += '<link rel="stylesheet" href="' + on.href + '">'; return; }
      try { gaya += '<style>' + Array.from(sh.cssRules).map((r) => r.cssText).join('\n') + '</style>'; } catch (e) { if (on && on.outerHTML) gaya += on.outerHTML; }
    });
    const potret = el.getAttribute('data-orientasi') === 'portrait';
    const html = '<!doctype html><html><head><meta charset="utf-8"><title>' + String(document.title || 'Dokumen KTK').replace(/[<>&]/g, '') + '</title>' + gaya
      + '<style>@page{size:A4 ' + (potret ? 'portrait' : 'landscape') + ';margin:8mm}html,body{background:#fff!important;margin:0;padding:0;height:auto!important;overflow:visible!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}'
      + '.print-area{position:static!important;width:100%!important;border:0!important;box-shadow:none!important;padding:0!important;overflow:visible!important;border-radius:0!important}'
      + '.print-area table{page-break-inside:auto}.print-area tr{page-break-inside:avoid}.print-area thead{display:table-header-group}'
      + '.print-area input,.print-area textarea,.print-area select{border:0!important;background:transparent!important;box-shadow:none!important;outline:0!important;appearance:none;-webkit-appearance:none;padding:0!important;resize:none}'
      + '</style></head><body>' + salinan.outerHTML + '</body></html>';
    const fr = document.createElement('iframe');
    fr.setAttribute('aria-hidden', 'true'); fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(fr);
    const dd = fr.contentWindow.document; dd.open(); dd.write(html); dd.close();
    const jalan = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (err) { /* dialog dibatalkan */ } setTimeout(() => { try { fr.remove(); } catch (err) { /* abaikan */ } }, 60000); };
    setTimeout(() => { try { const f = fr.contentWindow.document.fonts; if (f && f.ready) f.ready.then(jalan, jalan); else jalan(); } catch (err) { jalan(); } }, 500);
  };
  const PRINT_CSS = '@media print { body * { visibility: hidden !important; } .print-area, .print-area * { visibility: visible !important; } .print-area { position: absolute !important; left: 0; top: 0; width: 100% !important; border: 0 !important; padding: 0 !important; overflow: visible !important; } .print-area table { page-break-inside: auto; } .print-area tr { page-break-inside: avoid; } .print-area thead { display: table-header-group; } @page { size: A4 landscape; margin: 8mm; } }';
  const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  const SATUAN_KATA = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const terbilang = (n) => {
    n = Math.floor(Math.abs(n)); if (n === 0) return 'nol';
    const tb = (x) => {
      if (x < 12) return SATUAN_KATA[x];
      if (x < 20) return tb(x - 10) + ' belas';
      if (x < 100) return tb(Math.floor(x / 10)) + ' puluh' + (x % 10 ? ' ' + tb(x % 10) : '');
      if (x < 200) return 'seratus' + (x - 100 ? ' ' + tb(x - 100) : '');
      if (x < 1000) return tb(Math.floor(x / 100)) + ' ratus' + (x % 100 ? ' ' + tb(x % 100) : '');
      if (x < 2000) return 'seribu' + (x - 1000 ? ' ' + tb(x - 1000) : '');
      if (x < 1e6) return tb(Math.floor(x / 1e3)) + ' ribu' + (x % 1e3 ? ' ' + tb(x % 1e3) : '');
      if (x < 1e9) return tb(Math.floor(x / 1e6)) + ' juta' + (x % 1e6 ? ' ' + tb(x % 1e6) : '');
      if (x < 1e12) return tb(Math.floor(x / 1e9)) + ' miliar' + (x % 1e9 ? ' ' + tb(x % 1e9) : '');
      return tb(Math.floor(x / 1e12)) + ' triliun' + (x % 1e12 ? ' ' + tb(x % 1e12) : '');
    };
    return tb(n);
  };
  const sortLh = (lhs) => (lhs || []).slice().sort((a, b) => dateOf(a.tanggal) - dateOf(b.tanggal) || String(a.id).localeCompare(String(b.id)));
  // Isian header laporan (RAB, Rekapitulasi, Lembar KTK) bisa diedit langsung di lembar dan disimpan bersama KTK (tombol Simpan).
  // Nilai awal diambil dari data KTK; yang diubah admin disimpan per kontrak dan menggantikan nilai awal itu.
  const hdrOf = (doc) => {
    const now = new Date(); const o = (doc && doc.header) || {};
    const def = {
      unit1: 'PT PLN (Persero) Unit Induk Distribusi Bali', unit2: 'Unit Pelaksana Pelayanan Pelanggan Bali Selatan',
      pekerjaan: (doc && doc.nama) || '', lokasi: 'Wilayah Kerja PT PLN (Persero) UP3 Bali Selatan', vendor: (doc && doc.vendor) || 'PT. NANDA NIRWANA ELEKTRIK',
      kontrak: (doc && doc.no) || '', pos: '6.1',
      pihakKedua: 'I KADEK DODYK DARMAPUTRA', pihakPertama: 'ALEXANDER J. MANUHUWA',
      tglRekap: 'Denpasar, ' + BULAN[now.getMonth()] + ' ' + now.getFullYear(), jabatanRekap: 'Manager,', namaRekap: '...........................................',
      tglNaskah: '', tglKontrak: '', nilaiAwal: ''   // naskah kontrak: tanggal naskah (kosong = hari ini), tanggal kontrak (kosong = tanggal SPK), nilai kontrak awal isian admin
    };
    const h = {}; Object.keys(def).forEach((k) => { h[k] = Object.prototype.hasOwnProperty.call(o, k) ? o[k] : def[k]; }); return h;
  };
  const HdrIn = ({ k, h, setH, upper, bold, w, className }) => (
    <LazyInput value={h[k]} onChange={(v) => setH(k, v)} title="Klik untuk mengubah. Perubahan disimpan dengan tombol Simpan."
      className={'bg-transparent outline-none border-b border-dashed border-transparent hover:border-[#9AA0AE] focus:border-[#3A62B0] print:border-transparent ' + (bold === false ? '' : 'font-bold ') + (className || '')}
      style={{ textTransform: upper ? 'uppercase' : undefined, width: w || Math.max(120, String(h[k] || '').length * 8 + 24) }} />);
  // Kepala laporan PLN (sama untuk RAB, Rekapitulasi, dan Lembar KTK)
  const LapHead = ({ judul, h, setH, upper, pos }) => (
    <div>
      <div><HdrIn k="unit1" h={h} setH={setH} upper={upper} w="100%" /></div>
      <div className="mb-3"><HdrIn k="unit2" h={h} setH={setH} upper={upper} w="100%" /></div>
      <div className="font-bold text-center underline text-[13px] mb-1">{judul}</div>
      <table className="mb-3 mx-auto" style={{ borderCollapse: 'collapse' }}><tbody>
        {[['Pekerjaan', 'pekerjaan'], ['Lokasi', 'lokasi'], ['Vendor', 'vendor'], [pos ? 'Kontrak Rinci' : 'Kontrak Rinci No.', 'kontrak']].concat(pos ? [['Pos Anggaran', 'pos']] : []).map(([l, k]) => (
          <tr key={l}><td className="font-bold text-right pr-1 py-[1px] whitespace-nowrap">{l}</td><td className="px-1">:</td><td className="py-[1px]"><HdrIn k={k} h={h} setH={setH} /></td></tr>))}
      </tbody></table>
    </div>);
  // ====================== LEMBAR KTK ======================
  // Bentuk mengikuti laporan PLN "Lampiran Kerja Tambah Kurang". Volume = kontrak PLN. Realisasi = rekap volume semua LH yang dipilih (sama dengan RAB):
  // PLN + Pemb. Realisasi > volume -> selisihnya Kerja (+); realisasi < volume -> selisihnya Kerja (-).
  // Nilai akhir: bagian material = Pemb x harga material, bagian jasa = (PLN + Pemb) x harga jasa (sama dengan RAB, jadi total sama dengan RAB).
  // Nama material LH yang 99% mirip dengan baris KTK otomatis dihitung ke baris itu. Sisanya masuk grup "Kerja tambah" di bawah.
  // Data Lembar KTK (dipakai tampilan dan Export Excel): grup, baris, total, nama yang dicocokkan otomatis, baris tanpa LH, kerja tambah.
  const buildKtkData = (doc, lhs, kontrak, alias, master, nSel) => {

  // ====================== KTK 62: LEMBAR GABUNGAN PER SPK ======================
  // Tiap PK punya paket dan volume sendiri (lembar 5, satu per pelanggan). Lembar gabungan ini menjumlah volume baris yang sama dari semua PK
  // (paket digabung menurut nama paket), lalu realisasi diambil dari semua LH PK di SPK itu. Dipakai RAB SPK, Material terpasang,
  // Laporan fisik, Realisasi biaya, dan Rekap realisasi biaya.
  const mergePaket62 = (doc) => {
    const order = [], by = {};
    doc.paket.forEach((p) => {
      if (!p.dipakai) return;
      let g = by[p.nama]; if (!g) { g = by[p.nama] = { id: p.id, nama: p.nama, dipakai: true, kustom: !!p.kustom, pkId: '', items: [], idx: {} }; order.push(g); }
      const occ = {};
      p.items.forEach((it) => {
        const nm = it.tipe === 'sub' ? String(it.nama) : norm(it.nama);
        const ok = it.tipe + '|' + nm; occ[ok] = (occ[ok] || 0) + 1;
        const key = ok + '#' + occ[ok];
        if (g.idx[key] !== undefined) { if (it.tipe !== 'sub') { const t = g.items[g.idx[key]]; t.vol = K.toSheetV(K.parseV(t.vol) + K.parseV(it.vol)); } return; }
        g.idx[key] = g.items.length;
        g.items.push(it.tipe === 'sub' ? { ...it } : { ...it, vol: K.toSheetV(K.parseV(it.vol)) });
      });
    });
    return order.map((g) => ({ id: g.id, nama: g.nama, dipakai: true, kustom: g.kustom, pkId: '', items: g.items }));
  };

            {extra.rows.length > 0 && (<React.Fragment>
              <tr><td colSpan={14} className={cell + ' font-bold text-center bg-[#FFF3D6]'}>KERJA TAMBAH (BELUM ADA DI KTK)</td></tr>

              <tr className="font-bold bg-[#D6E2F3]"><td colSpan={8} className={cell + ' text-center'}>JUMLAH</td><td className={num}>-</td><td className={num}>-</td><td className={num}>-</td><td className={num}>{f2(extra.bm)}</td><td className={num}>{f2(extra.bj)}</td><td className={num}>{f2(extra.bm + extra.bj)}</td></tr>
            </React.Fragment>)}
          </tbody>
        </table>
        <SpkTotal62 T={T} H={H} setH={setH} cell={cell} num={num} />
      </SpkFrame62>);
  }

  // ====================== REKAPITULASI RINCIAN BIAYA ======================
  // Satu baris per LH yang dipilih (urut sama dengan RAB), kolom lokasi LH. Jumlah, DPP nilai lain, PPN, total, pembulatan di bawah.
  // KTK jenis 62 (pkList diisi): satu baris per PK (nomor PK + tanggal, nama pelanggan, lokasi), bentuk "Rekap PK".
  function RekapLhTab({ doc, H, setH, lhs, kontrak, alias, master, nSel, pkOf }) {
    const pkList = useMemo(() => pkOf ? (doc.pkIds || []).map((id) => ({ pk: pkOf(id), lhs: (lhs || []).filter((l) => String(l.pk_id).trim() === String(id).trim()), kontrak: buildContract({ ...doc, paket: doc.paket.filter((p) => String(p.pkId) === String(id)) }) })) : null, [pkOf ? doc.pkIds : null, pkOf ? doc.paket : null, lhs, !!pkOf]);

        ? pkList.map((x) => { const rab = buildRab(x.lhs, x.kontrak, alias, master); th += rab.th; ti += rab.ti; return { pk: x.pk, n: x.lhs.length, rab }; })
        : sortLh(lhs).map((lh) => { const rab = buildRab([lh], kontrak, alias, master); th += rab.th; ti += rab.ti; return { lh, rab }; });

              <LapHead judul={pkList ? 'REKAP PK' : 'REKAPITULASI RINCIAN BIAYA'} h={H} setH={setH} pos />
              <table style={{ borderCollapse: 'collapse', width: '100%' }}>
                <colgroup><col style={{ width: 44 }} /><col /><col style={{ width: 150 }} /><col style={{ width: 150 }} /><col style={{ width: 150 }} /></colgroup>
                <thead><tr><th className={head}>NO</th><th className={head}>{pkList ? 'PK NO. / NAMA PELANGGAN / LOKASI' : 'LOKASI'}</th><th className={head}>MATERIAL<br />(RP)</th><th className={head}>JASA<br />(RP)</th><th className={head}>TOTAL<br />(RP)</th></tr></thead>
                <tbody>

                      <td className={num}>{f2(rab.th)}</td><td className={num}>{f2(rab.ti)}</td><td className={num}>{f2(rab.th + rab.ti)}</td>
                    </tr>) : (
                    <tr key={lh.id}>
                      <td className={cell + ' text-center'}>{i + 1}</td>
                      <td className={cell}>{String((lh.data && lh.data.lokasi_lh) || lh.uraian || '').toUpperCase()}<span className="ml-3 text-[11px] text-[#8A93A3] print:hidden">{lh.id}</span></td>
                      <td className={num}>{f2(rab.th)}</td><td className={num}>{f2(rab.ti)}</td><td className={num}>{f2(rab.th + rab.ti)}</td>
                    </tr>))}
                  {ft('Jumlah', f2(B.th), f2(B.ti), f2(B.th + B.ti))}
                  {ft('Nilai Dpp Lain', f2(TM.dpp), f2(TJ.dpp), f2(TT.dpp))}
                  {ft('PPN 12%', f2(TM.ppn), f2(TJ.ppn), f2(TT.ppn))}
                  {ft('TOTAL', f2(TM.gross), f2(TJ.gross), f2(TT.gross))}

              <div className="mt-6 ml-auto font-bold" style={{ width: 260 }}>
                <div><HdrIn k="tglRekap" h={H} setH={setH} w="100%" /></div>
                <div className="text-center" style={{ width: 150 }}><HdrIn k="jabatanRekap" h={H} setH={setH} w="100%" className="text-center" /></div>
                <div className="mt-16"><HdrIn k="namaRekap" h={H} setH={setH} w="100%" /></div>
              </div>
            </div>
          </section>)}
      </div>
    );
  }
  // ====================== TAB RAB ======================
  // RAB (Rincian Anggaran Biaya) dirinci per LH yang dipilih, bentuk mengikuti lembar RAB Excel/PDF:
  // tiap LH satu blok bernomor: nama pekerjaan, lokasi, fungsi distribusi, material utama (MDU), material konstruksi (uraian pasang),
  // jasa dan lain-lain (uraian bongkar), retour, jumlah. Di bawah: jumlah total, DPP nilai lain, PPN 12%, jumlah + PPN, dibulatkan.
  // Harga satuan dari kontrak; bila material belum ada di kontrak, dari Master data. Bagian material = Pemb x harga material, bagian jasa = (PLN + Pemb) x harga jasa.
  function RabTab({ doc, H, setH, lhs, kontrak, alias, master, nSel }) {
    const B = useMemo(() => {
      const list = sortLh(lhs);
      let th = Z, ti = Z;
      const out = list.map((lh) => { const rab = buildRab([lh], kontrak, alias, master); th += rab.th; ti += rab.ti; return { lh, rab }; });
      return { out, th, ti };
    }, [lhs, kontrak, alias, master]);
    const cell = 'border border-[#B8BDC9] px-1.5 py-[3px]';
    const head = cell + ' bg-[#F2F2F2] font-bold text-center align-middle';
    const num = cell + ' text-right whitespace-nowrap';
    const f2 = (x) => x === null || x === Z ? '-' : K.fmt2(x);
    const mv = (x) => x === Z ? '' : K.fmtVol(x);
    const lab = (txt, key) => (<tr key={key}><td className={cell}></td><td colSpan={9} className={cell + ' font-bold'}>{txt}</td></tr>);
    const itemRows = (arr, retur, key) => arr.map((r, i) => (
      <tr key={key + i}>
        <td className={cell}></td>
        <td className={cell}>{r.nama}{!retur && !r.inKontrak && (r.dariMaster ? <span className="ml-2 text-[11px] text-[#8A93A3] print:hidden">harga dari Master data</span> : <span className="ml-2 text-[11px] text-[#C77700] print:hidden">tidak ada harga</span>)}</td>
        <td className={cell + ' text-center'}>{r.sat}</td>
        <td className={cell + ' text-center'}>{mv(r.d)}</td><td className={cell + ' text-center'}>{mv(r.e)}</td>
        <td className={num}>{retur ? '' : f2(r.pm)}</td><td className={num}>{retur ? '' : f2(r.pj)}</td>
        <td className={num}>{retur ? '' : f2(r.h)}</td><td className={num}>{retur ? '' : f2(r.i)}</td><td className={num}>{retur ? '' : f2(r.j)}</td>
      </tr>));
    const TM = K.hitung(B.th, Z), TJ = K.hitung(Z, B.ti), TT = K.hitung(B.th, B.ti);
    const ft = (label, a, b, c, strong) => (<tr key={label} className={strong ? 'font-bold' : ''}><td colSpan={7} className={cell + ' text-right'}>{label}</td><td className={num}>{a}</td><td className={num}>{b}</td><td className={num}>{c}</td></tr>);
    const rb = (x) => K.fmtRp(x) + ',00';
    return (
      <div className="space-y-3">
        <style>{PRINT_CSS}</style>
        <div className="flex flex-wrap items-center gap-x-8 gap-y-1 text-[13px]">

          <span className="flex-1"></span>
          <UI.Btn onClick={cetakArea} data-testid="tombol-cetak">Cetak</UI.Btn>
        </div>
        {B.out.length === 0 && <UI.Empty>Belum ada LH yang dipilih. Pilih LH di langkah 2, lalu RAB-nya terurai di sini.</UI.Empty>}
        {B.out.length > 0 && (
          <section className="print-area bg-white border border-[#E6E9F2] rounded-xl overflow-x-auto p-5">
            <div style={{ minWidth: 1180, fontFamily: 'Arial, Helvetica, sans-serif', fontSize: 12, color: '#000' }}>
              <LapHead judul="RINCIAN ANGGARAN BIAYA" h={H} setH={setH} pos />
              <table style={{ borderCollapse: 'collapse', width: '100%' }}>
                <colgroup><col style={{ width: 38 }} /><col /><col style={{ width: 52 }} /><col style={{ width: 56 }} /><col style={{ width: 56 }} /><col style={{ width: 104 }} /><col style={{ width: 112 }} /><col style={{ width: 112 }} /><col style={{ width: 118 }} /><col style={{ width: 124 }} /></colgroup>
                <thead>
                  <tr><th rowSpan={3} className={head}>No</th><th rowSpan={3} className={head}>URAIAN PEKERJAAN</th><th rowSpan={3} className={head}>SATUAN</th><th colSpan={2} className={head}>VOLUME</th><th colSpan={2} className={head}>HARGA SATUAN</th><th colSpan={2} className={head}>HARGA BAGIAN</th><th rowSpan={3} className={head}>JUMLAH</th></tr>
                  <tr><th className={head}>PLN</th><th className={head}>PEMB</th><th className={head}>MATERIAL</th><th className={head}>JASA</th><th className={head}>MATERIAL</th><th className={head}>JASA</th></tr>
                  <tr></tr>
                </thead>
                <tbody>
                  {B.out.map(({ lh, rab }, bi) => {
                    const d = (lh.data) || {}; const s = rab.secs;

                    return (<React.Fragment key={lh.id}>
                      <tr><td className={cell + ' text-center font-bold align-top'}>{bi + 1}</td><td colSpan={9} className={cell + ' font-bold'}>{String(d.nama_pekerjaan_lh || lh.uraian || 'Pekerjaan harian').toUpperCase()}<span className="ml-3 font-normal text-[11px] text-[#8A93A3] print:hidden">{lh.id} · {lh.tanggal}</span></td></tr>
                      <tr><td className={cell}></td><td colSpan={9} className={cell + ' font-bold'}>{String(d.lokasi_lh || '').toUpperCase() || '\u00a0'}</td></tr>
                      <tr><td className={cell}></td><td colSpan={9} className={cell}>&nbsp;</td></tr>
                      <tr><td className={cell}></td><td colSpan={9} className={cell + ' font-bold'}>FUNGSI DISTRIBUSI</td></tr>
                      {utama.length > 0 && lab('MATERIAL UTAMA', 'u' + lh.id)}{itemRows(utama, false, 'u' + lh.id)}
                      {kons.length > 0 && lab('MATERIAL KONSTRUKSI', 'k' + lh.id)}{itemRows(kons, false, 'k' + lh.id)}
                      {jasa.length > 0 && lab('JASA DAN LAIN - LAIN', 'j' + lh.id)}{itemRows(jasa, false, 'j' + lh.id)}
                      {retur.length > 0 && lab('RETOUR', 'r' + lh.id)}{itemRows(retur, true, 'r' + lh.id)}
                      {utama.length + kons.length + jasa.length + retur.length === 0 && <tr><td className={cell}></td><td colSpan={9} className={cell + ' text-[#8A93A3]'}>LH ini belum punya material bervolume.</td></tr>}
                      <tr><td className={cell}></td><td colSpan={9} className={cell}>&nbsp;</td></tr>
                      <tr className="font-bold"><td className={cell}></td><td colSpan={6} className={cell}>JUMLAH</td><td className={num}>{f2(rab.th)}</td><td className={num}>{f2(rab.ti)}</td><td className={num}>{f2(rab.th + rab.ti)}</td></tr>
                    </React.Fragment>);
                  })}
                  {ft('JUMLAH TOTAL', f2(B.th), f2(B.ti), f2(B.th + B.ti), true)}
                  {ft('DPP NILAI LAIN', f2(TM.dpp), f2(TJ.dpp), f2(TT.dpp), true)}
                  {ft('PPN 12 %', f2(TM.ppn), f2(TJ.ppn), f2(TT.ppn), true)}
                  {ft('JUMLAH+PPN', f2(TM.gross), f2(TJ.gross), f2(TT.gross), true)}
                  {ft('DIBULATKAN', rb(TM.bulat), rb(TJ.bulat), rb(TT.bulat), true)}
                </tbody>
              </table>
            </div>
          </section>)}
        <p className="text-[12px] leading-[18px] text-[#6B665E]">RAB ini hanya berisi LH yang dipilih di langkah 2, diurutkan dari tanggal terlama. Material utama dan bongkar yang hanya diisi jumlah dibaca sebagai volume PLN. Material konstruksi (uraian pasang) memakai kolom PLN dan Pemb dari LH. Retour hanya volume, tanpa nilai. Perhitungan memakai angka penuh, tampil 2 desimal.</p>
      </div>
    );
  }
  // ====================== EXPORT EXCEL ======================
  // Tiga lembar (RAB, Rekapitulasi, Lampiran KTK) dengan bentuk yang sama seperti laporan PLN.
  // Semua total memakai rumus (SUM / SUMIF), nilai tiap sel disimpan dengan angka penuh (tidak dibulatkan, sampai 10 desimal harga),
  // dan hasil hitung awal dari KtkMath (BigInt) ikut ditulis sebagai nilai tersimpan, jadi angkanya sama persis dengan di aplikasi.
  let _xlLoad = null;
  const loadExcelJs = () => {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (_xlLoad) return _xlLoad;
    _xlLoad = new Promise((ok, no) => {
      const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js';
      s.onload = () => ok(window.ExcelJS); s.onerror = () => { _xlLoad = null; no(new Error('Pustaka Excel gagal dimuat. Periksa koneksi internet.')); };
      document.head.appendChild(s);
    });
    return _xlLoad;
  };
  const buildExcel = (ExcelJS, { doc, H, lhs, kontrak, alias, master, nSel }) => {
    const NP = (x) => (x === null || x === undefined) ? 0 : Number(K.toSheetP(x));   // BigInt skala 1e10 -> angka (teks desimal penuh -> double terdekat); harga tak ada = 0
    const NV = (x) => Number(K.toSheetV(x));
    const wb = new ExcelJS.Workbook(); wb.creator = 'Sistem Manajemen SPK'; wb.calcProperties = { fullCalcOnLoad: true };
    const FONT = { name: 'Arial', size: 10 };
    const thin = { style: 'thin', color: { argb: 'FF7F7F7F' } }; const BR = { top: thin, left: thin, bottom: thin, right: thin };
    const FILL = (c) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: c } });
    const F2 = '#,##0.00', F0 = '#,##0';
    const col = (n) => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
    const mk = (name, widths) => { const ws = wb.addWorksheet(name, { pageSetup: { paperSize: 9, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.3, right: 0.3, top: 0.4, bottom: 0.4, header: 0.2, footer: 0.2 } } }); ws.columns = widths.map((w) => ({ width: w })); return ws; };
    // tulis sel: v = nilai, atau { f: rumus, r: hasil awal }
    const put = (ws, r, c, v, o) => {
      const cell = ws.getCell(r, c); o = o || {};
      if (v !== null && v !== undefined && v !== '') cell.value = (typeof v === 'object' && v.f !== undefined) ? { formula: v.f, result: v.r } : v;
      cell.font = { ...FONT, bold: !!o.bold, italic: !!o.italic, underline: !!o.underline, color: o.color ? { argb: o.color } : undefined };

        const vm = K.mul(K.parseP(it.pm), v), vj = K.mul(K.parseP(it.pj), v);

        {tab === 'rekapb' && k62 && <SpkRekapBiayaTab doc={doc} H={H} setH={setH} lhs={lhsSel} alias={alias} master={master} />}
