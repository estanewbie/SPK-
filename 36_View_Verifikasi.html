<script type="text/babel">
// Menu: Pusat verifikasi = tempat Admin Code membuat dokumen Code 3, Code 7, dan AGO.
// Tampilan mengikuti standar aplikasi (DESIGN.md, pola daftar Antrean PK): huruf dan komponen yang sama dengan menu lain.
//
// Antrean hanya berisi LH yang sudah lolos audit (atau selesai direvisi) dan masih kekurangan dokumen (aturan di UiKit: lhTahap, lhDokumen).
// SKALA PRIORITAS (agar pekerjaan dikerjakan dari yang paling mendesak):
//   Prioritas 1: LH yang sudah masuk KTK (kontraknya sedang disusun), dikelompokkan per KTK dan SPK-nya.
//   Prioritas 2: LH di PK yang sudah masuk SPK, tetapi belum masuk KTK, dikelompokkan per SPK.
//   Prioritas 3: LH di PK yang belum masuk SPK, dikelompokkan per PK.
// Di dalam satu prioritas, kelompok yang paling lama menunggu tampil paling atas (KTK yang sudah Final lebih dulu).
//
// KEAMANAN UNGGAH: file diperiksa dulu di layar (tipe, ukuran), dikonfirmasi, lalu dikirim lewat window.safeRun (layar terkunci, ada batas waktu).
// Server (lhUnggahDokumen) memeriksa ulang semuanya, menulis, lalu MEMBACA ULANG Sheet. LH baru berubah di layar bila server menjawab "terverifikasi".
// CATATAN BERKAS: simpan sebagai UTF-8. Jangan membaca/menulis berkas ini lewat PowerShell Get-Content/Set-Content (merusak karakter).
(() => {
  const { useState, useMemo, useEffect, useDeferredValue, useRef } = React;
  const UI = window.UI;
  const lower = (s) => String(s == null ? '' : s).toLowerCase();
  const DAY = 86400000;
  const C = { ink: '#2B2F3A', mute: '#7A8190', line: '#E6E9F2', blue: '#3A62B0', purple: '#7E57C2', ago: '#5A7FD0', ok: '#3C8A5E', warn: '#B7791F', bad: '#B5524F' };
  const btn = 'h-8 px-3.5 rounded-lg border bg-white hover:border-[#9FB0D2] disabled:opacity-40 disabled:cursor-not-allowed';
  const inp = 'h-9 px-3 rounded-[10px] border bg-white outline-none text-[13px] focus:border-[#3A62B0] focus:ring-2 focus:ring-[#3A62B0]/20';
  const parseTgl = (s) => {
    s = String(s || '').trim(); let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/))) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)).getTime();
    return window.Periode.waktu({ tanggal: s });   // format lain (dd/mm/yyyy, "16 Nov 2026") diterjemahkan oleh UiKit
  };
  const fmtPendek = (t) => t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
  const DOK = { c3: { nama: 'Code 3', tipe: 'code3', file: 'File_Code3', col: C.blue }, c7: { nama: 'Code 7', tipe: 'code7', file: 'File_Code7', col: C.purple }, ago: { nama: 'AGO', tipe: 'ago', file: 'File_AGO', col: C.ago } };
  const PRIO = {
    1: { judul: 'Prioritas 1', sub: 'Sudah masuk KTK', hint: 'Kontraknya sedang disusun, kerjakan lebih dulu', color: C.bad, bg: '#FDF6F5' },
    2: { judul: 'Prioritas 2', sub: 'Sudah masuk SPK, belum masuk KTK', hint: 'Sudah punya SPK, siap masuk KTK berikutnya', color: C.warn, bg: '#FFF9EC' },
    3: { judul: 'Prioritas 3', sub: 'PK belum masuk SPK', hint: 'Belum terhubung ke SPK, kerjakan setelah yang lain', color: '#5B6475', bg: '#F4F5F8' }
  };
  // file yang boleh diunggah (sama dengan server: Dokumen.js)
  const MAKS_BYTE = 8 * 1024 * 1024;
  const MIME_OK = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
  const EKSTENSI = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', doc: 'application/msword', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xls: 'application/vnd.ms-excel', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
  const mimeOf = (f) => { const t = String(f.type || '').toLowerCase(); if (MIME_OK.indexOf(t) >= 0) return t; const e = String(f.name || '').split('.').pop().toLowerCase(); return EKSTENSI[e] || ''; };
  const bacaFile = (f) => new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result || '')); r.onerror = () => reject(new Error('File tidak bisa dibaca. Pilih ulang file.')); r.onabort = () => reject(new Error('Pembacaan file dibatalkan.')); r.readAsDataURL(f); });
  const mb = (b) => (b / 1048576).toFixed(b >= 1048576 ? 1 : 2).replace('.', ',') + ' MB';

  // Kelola daftar nomor normalisasi (tab Daftar_Normalisasi di database). Hanya Super Admin dan Admin Code; server memeriksa ulang dan membaca ulang hasil tulisan.
  function NormPanel({ auth, showToast, onTutup }) {
    const [rows, setRows] = useState(null);
    const [pesan, setPesan] = useState('');
    const [q, setQ] = useState('');
    const dq = useDeferredValue(q);
    const [f, setF] = useState({ kodeLama: '', kode: '', deskripsi: '', pendek: '' });
    const [busy, setBusy] = useState(false);
    const [impor, setImpor] = useState(false);
    const [teks, setTeks] = useState('');
    const [lim, setLim] = useState(100);
    const muat = async () => {
      const out = await window.safeRun('code37NormDaftar', [auth], { label: 'Memuat daftar nomor normalisasi' });
      if (out.ok && out.res && out.res.status === 'success' && Array.isArray(out.res.rows)) { setRows(out.res.rows); setPesan(''); }
      else { setRows([]); setPesan((out.res && out.res.message) || out.message || 'Server tidak menjawab.'); }
    };
    useEffect(() => { muat(); }, []);
    const ws = lower(dq).split(/\s+/).filter(Boolean);
    const tampil = useMemo(() => (rows || []).filter((r) => ws.every((w) => lower(r.kode + ' ' + r.deskripsi + ' ' + r.pendek).indexOf(w) >= 0)), [rows, dq]);
    const kosongF = { kodeLama: '', kode: '', deskripsi: '', pendek: '' };
    const kirim = async (fn, args, label, ok) => {
      if (busy) return; setBusy(true);
      try {
        const out = await window.safeRun(fn, args, { label });
        if (!out.ok || !out.res || out.res.status !== 'success' || out.res.terverifikasi !== true) { showToast('Tidak tersimpan', (out.res && out.res.message) || out.message || 'Server tidak mengonfirmasi.', 'error'); return; }
        setRows(out.res.rows); ok(out.res);
      } catch (e) { showToast('Terjadi kesalahan', String((e && e.message) || e), 'error'); }
      finally { setBusy(false); }
    };
    const simpan = () => {
      if (!/^\d{7}$/.test(f.kode.trim())) { showToast('Nomor belum benar', 'Nomor normalisasi harus 7 angka.', 'error'); return; }
      if (!f.deskripsi.trim() && !f.pendek.trim()) { showToast('Isi nama material', 'Isi deskripsi atau nama pendek.', 'error'); return; }
      kirim('code37NormSimpan', [auth, { kodeLama: f.kodeLama, kode: f.kode.trim(), deskripsi: f.deskripsi, pendek: f.pendek }], 'Menyimpan nomor normalisasi', (r) => { setF(kosongF); showToast(r.baru ? 'Nomor ditambahkan' : 'Nomor diperbarui', r.kode, 'success'); });
    };
    const hapus = async (r) => {
      const c = await Swal.fire({ icon: 'question', title: 'Hapus nomor ' + r.kode + '?', text: (r.pendek || r.deskripsi) + '. Bon yang sudah dicetak tidak berubah; pencarian nomor berikutnya tidak lagi memakai baris ini.', showCancelButton: true, confirmButtonText: 'Ya, hapus', cancelButtonText: 'Batal' });
      if (!c.isConfirmed) return;
      kirim('code37NormHapus', [auth, r.kode], 'Menghapus nomor normalisasi', () => { if (f.kodeLama === r.kode) setF(kosongF); showToast('Nomor dihapus', r.kode, 'success'); });
    };
    const doImpor = () => {
      if (!teks.trim()) { showToast('Tempelan kosong', 'Tempel baris dari Excel dulu.', 'error'); return; }
      kirim('code37NormImpor', [auth, teks], 'Mengimpor nomor normalisasi', (r) => { setTeks(''); setImpor(false); showToast('Impor selesai', r.ditambah + ' ditambah, ' + r.diubah + ' diperbarui' + (r.dilewati ? ', ' + r.dilewati + ' baris dilewati' : '') + '.', r.dilewati ? 'info' : 'success'); });
    };
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(35,33,30,.35)' }} data-testid="panel-norm" role="dialog" aria-modal="true">
        <div className="bg-white rounded-[14px] border w-full max-w-[1000px] max-h-[92vh] flex flex-col" style={{ borderColor: C.line }}>
          <div className="px-5 py-3 border-b flex items-start justify-between gap-4" style={{ borderColor: C.line }}>
            <div><div className="text-[16px] font-medium" style={{ color: C.ink }}>Daftar nomor normalisasi</div>
              <div style={{ color: C.mute }}>{rows ? rows.length + ' material' : 'Memuat...'} · dipakai mencocokkan nama material di bon Code 3 dan Code 7, dibantu Convert material.</div></div>
            <button className={btn} style={{ borderColor: '#8E99B5' }} onClick={onTutup} data-testid="norm-tutup">Tutup</button>
          </div>
          {pesan && <div className="px-5 py-2 text-[12px]" style={{ background: '#FDF3F2', color: C.bad }}>{pesan}</div>}
          <div className="px-5 py-3 border-b space-y-2" style={{ borderColor: C.line }}>
            <div className="flex flex-wrap items-end gap-2">
              <label><span className="block text-[11px] mb-0.5" style={{ color: C.mute }}>Nomor (7 angka)</span><input value={f.kode} inputMode="numeric" maxLength={7} onChange={(e) => setF({ ...f, kode: e.target.value.replace(/\D/g, '') })} className={inp + ' w-[110px] num'} style={{ borderColor: '#8E99B5' }} data-testid="norm-kode" /></label>
              <label className="flex-1 min-w-[220px]"><span className="block text-[11px] mb-0.5" style={{ color: C.mute }}>Deskripsi (nama di SAP)</span><input value={f.deskripsi} maxLength={150} onChange={(e) => setF({ ...f, deskripsi: e.target.value })} className={inp + ' w-full'} style={{ borderColor: '#8E99B5' }} data-testid="norm-deskripsi" /></label>
              <label className="flex-1 min-w-[180px]"><span className="block text-[11px] mb-0.5" style={{ color: C.mute }}>Nama pendek</span><input value={f.pendek} maxLength={100} onChange={(e) => setF({ ...f, pendek: e.target.value })} className={inp + ' w-full'} style={{ borderColor: '#8E99B5' }} data-testid="norm-pendek" /></label>
              <button className="h-9 px-4 rounded-lg text-white font-medium bg-[#3A62B0] hover:bg-[#2F5399] disabled:opacity-40" disabled={busy} onClick={simpan} data-testid="norm-simpan">{f.kodeLama ? 'Simpan perubahan' : 'Tambah'}</button>
              {f.kodeLama && <button className={btn + ' !h-9'} style={{ borderColor: '#8E99B5' }} onClick={() => setF(kosongF)}>Batal ubah</button>}
              <button className={btn + ' !h-9'} style={{ borderColor: '#8E99B5' }} onClick={() => setImpor(!impor)} data-testid="norm-buka-impor">{impor ? 'Tutup impor' : 'Impor dari Excel'}</button>
            </div>
            {impor && <div data-testid="norm-impor"><div className="text-[12px] mb-1" style={{ color: C.mute }}>Tempel baris dari Excel: Nomor (7 angka), Deskripsi, Nama pendek (dipisah tab atau titik koma). Nomor yang sudah ada diperbarui, yang belum ada ditambahkan. Maksimal 2000 baris sekali impor.</div>
              <textarea value={teks} onChange={(e) => setTeks(e.target.value)} rows={5} className="w-full px-3 py-2 rounded-[10px] border outline-none text-[13px] focus:border-[#3A62B0]" style={{ borderColor: '#8E99B5' }} data-testid="norm-teks" />
              <div className="mt-1"><button className="h-8 px-4 rounded-lg text-white font-medium bg-[#3A62B0] hover:bg-[#2F5399] disabled:opacity-40" disabled={busy || !teks.trim()} onClick={doImpor} data-testid="norm-kirim-impor">Impor</button></div></div>}
            <input value={q} onChange={(e) => { setQ(e.target.value); setLim(100); }} placeholder="Cari nomor, deskripsi, atau nama pendek" className={inp + ' w-full'} style={{ borderColor: '#8E99B5' }} data-testid="norm-cari" />
          </div>
          <div className="overflow-auto flex-1">
            <div className="grid gap-3 px-5 py-1.5 text-[11px] sticky top-0 bg-white border-b" style={{ gridTemplateColumns: '90px minmax(0,2fr) minmax(0,1.2fr) 110px', color: C.mute, borderColor: '#EEF0F7' }}><span>Nomor</span><span>Deskripsi</span><span>Nama pendek</span><span></span></div>
            {rows === null && <div className="px-5 py-4" style={{ color: C.mute }}>Memuat...</div>}
            {rows && tampil.length === 0 && <div className="px-5 py-6 text-center" style={{ color: C.mute }}>{ws.length ? 'Tidak ada yang cocok.' : 'Daftar kosong.'}</div>}
            {tampil.slice(0, lim).map((r) => (
              <div key={r.kode} data-testid="norm-baris" className="grid gap-3 items-start px-5 py-1.5 border-b" style={{ gridTemplateColumns: '90px minmax(0,2fr) minmax(0,1.2fr) 110px', borderColor: '#EEF0F7' }}>
                <span className="num" style={{ color: C.purple }}>{r.kode}</span><span className="break-words">{r.deskripsi || '-'}</span><span className="break-words">{r.pendek || '-'}</span>
                <span className="flex justify-end gap-3 whitespace-nowrap"><button className="hover:underline" style={{ color: C.blue }} onClick={() => setF({ kodeLama: r.kode, kode: r.kode, deskripsi: r.deskripsi, pendek: r.pendek })}>Ubah</button><button className="hover:underline" style={{ color: C.bad }} disabled={busy} onClick={() => hapus(r)}>Hapus</button></span>
              </div>))}
            {tampil.length > lim && <button onClick={() => setLim(lim + 100)} className="w-full py-2 hover:bg-[#F9FAFD]" style={{ color: C.blue }}>Tampilkan 100 berikutnya ({tampil.length - lim} lagi)</button>}
          </div>
        </div>
      </div>);
  }

  function VerifikasiDesk({ ctx }) {
    const { lhs, pks, spks, currentUser, showToast, setLhs, fetchMainAppData } = ctx;
    const role = currentUser && currentUser.role;
    const canUpload = role === 'Super Admin' || role === 'Admin Code';
    const auth = { t: (currentUser && currentUser.token) || '', as: (currentUser && currentUser.asUser) || '' };
    const [prio, setPrio] = useState({ state: 'muat', kontrak: {}, lh: {}, pk: {}, pesan: '' });
    const [q, setQ] = useState('');
    const dq = useDeferredValue(q);
    const [spkF, setSpkF] = useState('');
    const [dokF, setDokF] = useState('');
    const [pF, setPF] = useState('');
    const [open, setOpen] = useState({});
    const [detail, setDetail] = useState({});
    const [limit, setLimit] = useState(10);
    const [busy, setBusy] = useState(false);
    const [draf, setDraf] = useState(null);   // tabel bon yang sedang disunting sebelum dicetak
    const [sedang, setSedang] = useState('');   // "idLH|dokumen" yang sedang diunggah
    const [pd, setPd] = useState({ rows: [], muat: false });   // daftar penandatangan cetakan (Daftar_Penanda_Code), dikelola Admin Code
    const [man, setMan] = useState({ rows: [], state: 'idle', pesan: '', buka: false });   // Code 3/7 manual (di luar LH), dipisah dari data LH
    const [periode, setPeriode] = useState(() => window.Periode.baca('verifikasi'));

    const muatPrioritas = () => {
      setPrio((p) => ({ ...p, state: 'muat' }));
      window.safeRun('lhPrioritasKtk', [auth], { timeout: 30000, tanpaBlokir: true }).then((out) => {
        if (out.ok) setPrio({ state: 'ok', kontrak: out.res.kontrak || {}, lh: out.res.lh || {}, pk: out.res.pk || {}, pesan: '' });
        else setPrio((p) => ({ ...p, state: 'gagal', pesan: out.message || 'Tidak diketahui.' }));
      });
    };
    useEffect(() => { muatPrioritas(); }, []);

    const safeLhs = lhs || [], safePks = pks || [], safeSpks = spks || [];
    const pkBy = useMemo(() => { const m = {}; safePks.forEach((p) => { m[String(p.id).trim()] = p; }); return m; }, [safePks]);
    const spkBy = useMemo(() => { const m = {}; safeSpks.forEach((s) => { m[String(s.id).trim()] = s; }); return m; }, [safeSpks]);

    // semua LH yang sudah lolos audit dan butuh dokumen (lengkap maupun belum), lengkap dengan prioritasnya
    const itemsSemua = useMemo(() => {
      const out = [];
      safeLhs.forEach((l) => {
        if (window.lhTahap(l) !== 'lolos') return;
        const dok = window.lhDokumen(l); if (!dok.need.ago) return;
        const pk = pkBy[String(l.pk_id).trim()] || {};
        const kid = prio.lh[String(l.id)] || prio.pk[String(l.pk_id).trim()] || '';
        const ktk = kid ? prio.kontrak[kid] : null;
        const spkId = String((ktk && ktk.idSpk) || pk.spk_id || '').trim();
        const spk = spkId ? spkBy[spkId] : null;
        const p = ktk ? 1 : (spk ? 2 : 3);
        const since = parseTgl(l.audit_tgl) || parseTgl(l.tanggal);
        const d = l.data || {};
        out.push({ l, dok, pk, ktk, spkId, spk, p, since, selesai: dok.kurang.length === 0,
          nama: String(d.nama_pekerjaan_lh || l.uraian || '').trim(), lokasi: d.lokasi_lh || pk.lokasi || '',
          key: p === 1 ? 'K:' + ktk.id : p === 2 ? 'S:' + spkId : 'P:' + String(l.pk_id).trim() });
      });
      return out;
    }, [safeLhs, pkBy, spkBy, prio]);
    // PERIODE: bawaan sejak 1 November 2026 (UiKit: Periode). Yang di luar periode tidak hilang: jumlahnya ditampilkan dan bisa dibuka.
    const items = useMemo(() => itemsSemua.filter((it) => window.Periode.cocok(periode, window.Periode.waktu(it.l))), [itemsSemua, periode]);
    const diluar = useMemo(() => itemsSemua.filter((it) => !it.selesai && !window.Periode.cocok(periode, window.Periode.waktu(it.l))), [itemsSemua, periode]);
    const opsiPeriode = useMemo(() => window.Periode.opsi(safeLhs), [safeLhs]);
    const ubahPeriode = (v) => { setPeriode(v); window.Periode.simpan('verifikasi', v); setLimit(10); };
    const tertahan = useMemo(() => safeLhs.filter((l) => window.lhTahap(l) !== 'lolos' && window.lhDokumen(l).kurang.length > 0 && window.Periode.cocok(periode, window.Periode.waktu(l))), [safeLhs, periode]);

    const now = Date.now();
    const groups = useMemo(() => {
      const m = {};
      items.forEach((it) => { const g = m[it.key] || (m[it.key] = { key: it.key, p: it.p, ktk: it.ktk, spkId: it.spkId, spk: it.spk, pk: it.pk, items: [] }); g.items.push(it); });
      return Object.keys(m).map((k) => m[k]);
    }, [items]);

    const ws = lower(dq).split(/\s+/).filter(Boolean);
    const cocok = (it) => !it.selesai && (!dokF || it.dok.st[dokF] === 'kurang') && (!spkF || it.spkId === spkF) &&
      ws.every((w) => lower([it.l.id, it.nama, it.lokasi, it.pk.id, it.pk.nama, it.spkId, it.ktk && it.ktk.no, it.ktk && it.ktk.nama].join(' ')).indexOf(w) >= 0);
    const tampil = useMemo(() => groups.map((g) => ({ ...g, pend: g.items.filter(cocok).sort((a, b) => (a.since || 1e15) - (b.since || 1e15)), total: g.items.length, selesaiN: g.items.filter((i) => i.selesai).length }))
      .filter((g) => g.pend.length > 0 && (!pF || String(g.p) === String(pF))), [groups, dq, spkF, dokF, pF]);
    const hari = (g) => { const t = Math.min(...g.pend.map((i) => i.since || now)); return Math.max(0, Math.floor((now - t) / DAY)); };
    const urut = (a, b) => (a.ktk && b.ktk ? ((b.ktk.status === 'Final') - (a.ktk.status === 'Final')) : 0) || hari(b) - hari(a) || b.pend.length - a.pend.length || String(a.key).localeCompare(String(b.key));
    const perPrio = { 1: [], 2: [], 3: [] }; tampil.forEach((g) => perPrio[g.p].push(g)); [1, 2, 3].forEach((p) => perPrio[p].sort(urut));
    const nLh = { 1: 0, 2: 0, 3: 0 }, nGrup = { 1: 0, 2: 0, 3: 0 };
    groups.forEach((g) => { const n = g.items.filter((i) => !i.selesai).length; nLh[g.p] += n; if (n) nGrup[g.p]++; });
    const spkOptions = useMemo(() => Array.from(new Set(items.filter((i) => !i.selesai && i.spkId).map((i) => i.spkId))).sort(), [items]);
    const firstKey = (perPrio[1][0] || perPrio[2][0] || perPrio[3][0] || {}).key;
    const isOpen = (g) => open[g.key] !== undefined ? open[g.key] : g.key === firstKey;
    const nTotal = nLh[1] + nLh[2] + nLh[3];
    const unit = (p) => p === 1 ? 'KTK' : p === 2 ? 'SPK' : 'PK';

    const namaKelompok = (g) => g.p === 1
      ? { t: 'KTK ' + g.ktk.no, s: [g.ktk.nama, g.spk ? 'SPK ' + g.spk.id + (g.spk.vendor ? ' · ' + g.spk.vendor : '') : (g.spkId ? 'SPK ' + g.spkId : 'KTK belum dikaitkan ke SPK')].filter(Boolean).join(' · ') }
      : g.p === 2 ? { t: 'SPK ' + g.spkId, s: [g.spk && g.spk.nama, g.spk && g.spk.vendor].filter(Boolean).join(' · ') }
      : { t: 'PK ' + g.pk.id + (g.pk.nama ? ' · ' + g.pk.nama : ''), s: g.pk.lokasi || '' };

    const unduh = () => {
      try {
        const lines = [['Prioritas', 'Kelompok', 'KTK', 'SPK', 'No. PK', 'Nama PK', 'ID LH', 'Tanggal LH', 'Pekerjaan LH', 'Code 3', 'Code 7', 'AGO', 'Menunggu (hari)']];
        const kata = { ada: 'Ada', kurang: 'Belum ada', tidak: '-' };

          <button className={btn} style={{ borderColor: '#8E99B5' }} onClick={() => { const o = {}; [1, 2, 3].forEach((p) => perPrio[p].forEach((g) => { o[g.key] = false; })); setOpen(o); }}>Tutup semua</button>
          <button className={btn} style={{ borderColor: '#8E99B5' }} onClick={unduh}>Unduh daftar prioritas</button>
          {canUpload && <button className={btn} style={{ borderColor: '#8E99B5' }} disabled={busy} data-testid="kelola-normalisasi" onClick={() => setNormBuka(true)} title="Tambah, ubah, atau impor nomor normalisasi material">Nomor normalisasi</button>}
          {canUpload && <button className="h-8 px-3.5 rounded-lg text-white font-medium bg-[#3A62B0] hover:bg-[#2F5399] disabled:opacity-40" disabled={busy} data-testid="buat-code-manual" onClick={bukaManualBaru} title="Buat Code 3 atau Code 7 untuk pekerjaan di luar LH">Buat Code 3/7 manual</button>}
        </section>
        {!canUpload && <div className="rounded-lg px-4 py-2" style={{ background: '#FFF6E3', color: '#6B4A00' }}>Peran Anda hanya bisa melihat. Unggah dokumen dilakukan Admin Code atau Super Admin.</div>}
        {canUpload && (
          <section className="bg-white border rounded-xl overflow-hidden" style={{ borderColor: C.line }} data-testid="daftar-code-manual">
            <button className="w-full flex items-center gap-3 px-4 py-2 text-left hover:bg-[#F9FAFD]" onClick={() => setMan((m) => ({ ...m, buka: !m.buka }))}>
              <span className="font-medium" style={{ color: C.ink }}>Code 3/7 manual (di luar LH)</span>
              <span style={{ color: C.mute }}>{man.state === 'muat' ? 'memuat…' : man.state === 'gagal' ? 'tidak bisa dimuat' : man.rows.length + ' dokumen'} · terpisah dari LH, PK, dan SPK</span>
              <span className="flex-1"></span><span style={{ color: C.blue }}>{man.buka ? 'Tutup' : 'Buka'}</span>
            </button>
            {man.buka && (man.state === 'gagal'
              ? <div className="px-4 py-3 border-t flex items-center gap-3" style={{ borderColor: '#EEF0F7', color: C.bad }}><span className="flex-1">{man.pesan}</span><button className={btn} style={{ borderColor: '#8E99B5' }} onClick={muatManual}>Coba lagi</button></div>
              : man.rows.length === 0 ? <div className="px-4 py-3 border-t" style={{ borderColor: '#EEF0F7', color: C.mute }}>Belum ada Code manual. Klik Buat Code 3/7 manual untuk pekerjaan di luar LH.</div>
              : man.rows.map((e) => (
                <div key={e.jenis + e.id} className="grid items-center gap-3 px-4 py-2 border-t" style={{ gridTemplateColumns: '70px 90px 70px minmax(0,1.6fr) minmax(0,1.2fr) 60px 130px 90px', borderColor: '#EEF0F7' }}>
                  <span className="font-medium" style={{ color: e.jenis === 'code3' ? C.blue : C.purple }}>{e.jenis === 'code3' ? 'Code 3' : 'Code 7'}</span>
                  <span className="num" style={{ color: C.mute }}>{e.id}</span><span className="num">No. {e.bon}</span>
                  <span className="truncate" title={e.nama}>{e.nama}</span><span className="truncate" style={{ color: C.mute }} title={e.alamat}>{e.alamat || '-'}</span>
                  <span className="num text-right">{e.n} brg</span><span className="num" style={{ color: C.mute }}>{e.waktu}</span>
                  <button className={btn} style={{ borderColor: '#8E99B5' }} disabled={busy} onClick={() => bukaManualLama(e)}>Buka</button>
                </div>)))}
          </section>)}

        {nTotal === 0
          ? <div className="bg-white border rounded-[14px] py-12 text-center" style={{ borderColor: C.line, color: C.mute }}>Tidak ada LH yang menunggu dokumen. Semuanya aman.</div>
          : tampil.length === 0 ? <div className="bg-white border rounded-[14px] py-12 text-center" style={{ borderColor: C.line, color: C.mute }}>Tidak ada LH yang cocok dengan saringan ini.</div>
          : <section className="bg-white border rounded-[14px] overflow-hidden" style={{ borderColor: C.line }}>
            {[1, 2, 3].map((p) => perPrio[p].length === 0 ? null : (
              <React.Fragment key={p}>
                <div className="flex items-center gap-2.5 px-5 h-8 border-t first:border-t-0" style={{ borderColor: C.line, background: PRIO[p].bg }}>
                  <span className="w-[3px] h-4 rounded-full" style={{ background: PRIO[p].color }}></span>
                  <span className="font-medium" style={{ color: PRIO[p].color }}>{PRIO[p].judul} · {PRIO[p].sub}</span>
                  <span style={{ color: C.mute }}>{perPrio[p].length} {unit(p)}</span>
                </div>
                {perPrio[p].slice(0, limit).map((g) => { const nm = namaKelompok(g), o = isOpen(g), hr = hari(g), pct = g.total ? Math.round(g.selesaiN / g.total * 100) : 0;
                  const c = { c3: g.pend.filter((i) => i.dok.st.c3 === 'kurang').length, c7: g.pend.filter((i) => i.dok.st.c7 === 'kurang').length, ago: g.pend.filter((i) => i.dok.st.ago === 'kurang').length };
                  return (
                  <React.Fragment key={g.key}>
                    <div role="button" tabIndex={0} className="grid items-center gap-4 px-5 py-2.5 border-t cursor-pointer border-l-[3px] border-l-transparent hover:bg-[#F4F2FB] hover:border-l-[#7E57C2] transition-colors"
                      style={{ gridTemplateColumns: '16px minmax(0,2.4fr) minmax(0,1.4fr) 220px', borderTopColor: '#EEF0F7' }}
                      onClick={() => setOpen((s) => ({ ...s, [g.key]: !isOpen(g) }))} onKeyDown={(e) => { if (e.key === 'Enter') setOpen((s) => ({ ...s, [g.key]: !isOpen(g) })); }}>
                      <span style={{ color: C.mute }}>{o ? '▾' : '▸'}</span>
                      <div className="min-w-0">
                        <div className="flex items-center gap-2"><span className="text-[14px] leading-5 font-medium truncate" style={{ color: C.ink }}>{nm.t}</span>
                          {g.ktk && <UI.Status tone={g.ktk.status === 'Final' ? 'ok' : 'warn'}>{g.ktk.status || 'Draf'}</UI.Status>}{g.ktk && <span className="text-[11px]" style={{ color: C.mute }}>KTK jenis {g.ktk.jenis}</span>}</div>
                        <div className="truncate" style={{ color: C.mute }}>{nm.s || '-'}</div>
                      </div>
                      <div><div className="font-medium" style={{ color: C.ink }}>{g.pend.length} LH menunggu dokumen</div><div className="text-[11px]" style={{ color: C.mute }}>{[c.c3 && 'Code 3: ' + c.c3, c.c7 && 'Code 7: ' + c.c7, c.ago && 'AGO: ' + c.ago].filter(Boolean).join(' · ')}</div></div>
                      <div title={g.selesaiN + ' dari ' + g.total + ' LH sudah lengkap'}>
                        <div className="text-[11px]" style={{ color: C.mute }}>Terlama menunggu {hr} hari · {g.selesaiN} dari {g.total} LH lengkap</div>
                        <div className="h-[5px] rounded-full mt-1 overflow-hidden" style={{ background: C.line }}><div className="h-full" style={{ width: pct + '%', background: C.ok }}></div></div>
                      </div>
                    </div>
                    {o && <div style={{ background: '#F8F9FD' }}>
                      <div className="grid items-center gap-4 px-5 h-8 text-[11px] border-t" style={{ gridTemplateColumns: GRID, color: C.mute, borderTopColor: '#EEF0F7' }}><span>LH</span><span>Pekerjaan dan lokasi</span><span style={{ color: C.blue }}>Code 3</span><span style={{ color: C.purple }}>Code 7</span><span style={{ color: C.ago }}>AGO</span><span></span></div>
                      {g.pend.map((it) => (
                        <React.Fragment key={it.l.id}>
                          <div className="grid items-center gap-4 px-5 py-2 border-t" style={{ gridTemplateColumns: GRID, borderTopColor: '#EEF0F7' }}>
                            <div><div className="num" style={{ color: C.purple }}>{it.l.id}</div><div className="num text-[11px]" style={{ color: '#2F8F9D' }}>{fmtPendek(parseTgl(it.l.tanggal))}</div></div>
                            <div className="min-w-0"><div className="break-words" style={{ color: C.ink }} title={it.nama}>{it.nama || 'Pekerjaan LH belum diberi nama'}</div><div className="text-[11px] break-words" style={{ color: C.mute }}>PK {it.pk.id || it.l.pk_id}{it.pk.nama && lower(it.pk.nama) !== lower(it.nama) ? ' · ' + it.pk.nama : ''}{it.lokasi ? ' · ' + it.lokasi : ''}</div></div>
                            <div><SelDok it={it} k="c3" /></div><div><SelDok it={it} k="c7" /></div><div><SelDok it={it} k="ago" /></div>
                            <div className="text-right"><button className="h-7 px-2.5 rounded-lg border bg-white hover:border-[#9FB0D2]" style={{ borderColor: '#8E99B5' }} onClick={() => setDetail((s) => ({ ...s, [it.l.id]: !s[it.l.id] }))}>{detail[it.l.id] ? 'Tutup' : 'Alasan'}</button></div>
                          </div>
                          {detail[it.l.id] && <div className="px-5 pb-2.5 pt-0.5 border-l-[3px]" style={{ borderLeftColor: C.purple }}><Alasan it={it} /><div className="mt-2"><UI.RiwayatLh id={it.l.id} auth={auth} ringkasLokal={{ dibuatOleh: it.l.dibuat_oleh, dibuatTgl: it.l.dibuat_tgl, diubahOleh: it.l.diubah_oleh, diubahTgl: it.l.diubah_tgl, auditOleh: it.l.audit_oleh, auditTgl: it.l.audit_tgl }} /></div></div>}
                        </React.Fragment>))}
                    </div>}
                  </React.Fragment>); })}
                {perPrio[p].length > limit && <button className="w-full py-2 border-t hover:bg-[#F9FAFD]" style={{ borderColor: C.line, color: C.blue }} onClick={() => setLimit(limit + 10)}>Tampilkan {Math.min(10, perPrio[p].length - limit)} {unit(p)} berikutnya ({perPrio[p].length - limit} lagi)</button>}
              </React.Fragment>))}
          </section>}
      </div>
    );
  }

  window.Views.Verifikasi = (ctx) => <UI.Guard nama="Pusat verifikasi"><VerifikasiDesk ctx={ctx} /></UI.Guard>;
})();
</script>
