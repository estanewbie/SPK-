<script type="text/babel">
// Menu samping (standar desain: DESIGN.md). Terang, 208 px, bisa diciutkan jadi 64 px berisi ikon saja.
// Status ciut disimpan di App.html (sidebarCollapsed) dan di localStorage. Hak akses per role tidak berubah.
const sbMemo = { ref: undefined, code: 0, audit: 0, rev: 0 };
window.Sidebar = (ctx) => {
  const { currentUser, currentView, handleLogout, pendingPKs, pks, lhs, setCurrentView, sidebarCollapsed, toggleSidebar } = ctx;
  const role = currentUser?.role;
  const open = !sidebarCollapsed;
  // Lencana mengikuti alur LH (UiKit lhAlur): Pusat verifikasi = LH yang sudah lolos audit dan masih kurang dokumen; Radar audit = LH menunggu audit.
  // dihitung ulang hanya bila daftar LH berubah (bukan tiap render)
  if (sbMemo.ref !== lhs) { const alur = (lhs || []).map((l) => window.lhAlur(l).key); sbMemo.code = alur.filter((k) => k === 'dokumen').length; sbMemo.audit = alur.filter((k) => k === 'audit').length; sbMemo.rev = alur.filter((k) => k === 'revisi').length; sbMemo.ref = lhs; }
  const pendingCode = sbMemo.code, pendingAudit = sbMemo.audit;
  const pendingRevisi = ['Super Admin', 'Admin PK', 'Admin SPK'].includes(role) ? sbMemo.rev : 0;   // LH yang perlu direvisi (untuk admin yang merevisi)

  // Ikon garis tipis (sama dengan mock up). Path gaya Lucide, 24x24.
  const P = {
    dash: 'M12 3v9h9M21 12a9 9 0 1 1-9-9',
    list: 'M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01',
    brief: 'M3 8h18v11H3zM9 8V5h6v3',
    inv: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h6',
    tbl: 'M3 5h18v14H3zM3 10h18M9 5v14',
    shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
    file: 'M6 3h9l4 4v14H6zM9 14h6',
    radar: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.5-4.5',
    log: 'M9 4h6l1 2h3v14H5V6h3zM9 11h6M9 15h6',
    out: 'M9 21H5V3h4M16 17l5-5-5-5M21 12H9',
    fold: 'm14 7-5 5 5 5M19 4v16'
  };
  const Ico = ({ n, flip }) => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"
      style={{ flexShrink: 0, transform: flip ? 'scaleX(-1)' : 'none' }}><path d={P[n]}></path></svg>
  );
  const Item = ({ view, icon, label, badge, warn, also = [] }) => {
    const on = currentView === view || also.includes(currentView);
    return (
      <button
        onClick={() => setCurrentView(view)}
        title={label}
        className={`relative w-full flex items-center ${open ? 'gap-3 px-2.5' : 'justify-center px-0'} h-8 mb-0.5 rounded-lg text-[13px] transition-colors ${on ? 'bg-[#E9EEFA] text-[#3A62B0] font-medium' : 'text-[#4A463F] hover:bg-[#EEF0F7]'}`}>
        <Ico n={icon} />
        {open && <span className="flex-1 text-left truncate">{label}</span>}
        {open && warn > 0 && <span className="text-[11px] px-1.5 rounded-full bg-[#FBE9E7] text-[#9B2C2C]" title={warn + ' LH perlu direvisi'}>{warn} revisi</span>}
        {open && badge > 0 && <span className="text-[12px] text-[#B42318]">{badge}</span>}
        {!open && (badge > 0 || warn > 0) && <span className="absolute top-1.5 right-2 w-[7px] h-[7px] rounded-full bg-[#E11D48]"></span>}
      </button>
    );
  };
  const Group = ({ title, first, children }) => {
    const kids = React.Children.toArray(children).filter(Boolean);
    if (!kids.length) return null;
    return (
      <div>
        {open
          ? <p className={`px-2.5 mb-1 text-[12px] text-[#6B665E] ${first ? 'mt-1' : 'mt-5'}`}>{title}</p>
          : (!first && <div className="h-px mx-2 my-3 bg-[#E6E9F2]"></div>)}
        {kids}
      </div>
    );
  };

  const isAdminSpk = ['Super Admin', 'Admin SPK'].includes(role);
  const isKeuangan = ['Super Admin', 'Admin PK', 'Admin SPK'].includes(role);

  return (
    <aside onDoubleClick={toggleSidebar} style={{ width: open ? 200 : 60, flex: `0 0 ${open ? 200 : 60}px`, height: '100vh', position: 'sticky', top: 0, userSelect: 'none' }} className="bg-white border-r border-[#E6E9F2] flex flex-col z-20 no-print transition-[width] duration-200">
      {/* merek: logo N tetap merah magenta */}
      <div className={`h-11 flex items-center gap-2.5 ${open ? 'px-[18px]' : 'justify-center'}`}>
        <div className="w-7 h-7 rounded-[7px] bg-rose-600 text-white flex items-center justify-center font-medium text-[14px] shrink-0">N</div>
        {open && (
          <div className="leading-4 min-w-0">
            <div className="text-[14px] font-medium text-[#23211E] truncate">Nanda Nirwana</div>
            <div className="text-[12px] text-[#6B665E]">Manajemen SPK</div>
          </div>
        )}
      </div>

      <nav className="flex-1 overflow-y-auto custom-scrollbar px-2.5 pt-2 pb-4">
        <Group title="Operasional" first>
          <Item view="dashboard" icon="dash" label="Dashboard" />
          <Item view="monitor_pk" icon="list" label="Antrean PK" badge={(pendingPKs || []).length} warn={pendingRevisi} />
          {isAdminSpk && <Item view="spk_list" also={['spk_detail']} icon="brief" label="Ruangan SPK" />}
        </Group>
        <Group title="Keuangan">
          {isKeuangan && <Item view="arsip_rab" icon="inv" label="Laporan dan RAB" />}
          {isKeuangan && <Item view="ktk" icon="tbl" label="KTK" />}
        </Group>
        <Group title="Kontrol">
          {(role === 'Super Admin' || role === 'Admin Code') && <Item view="verifikasi" icon="shield" label="Pusat verifikasi" badge={pendingCode} />}
          {role === 'Super Admin' && <Item view="arsip_dokumen" icon="file" label="Arsip Code 3 dan 7" />}
          {(role === 'Super Admin' || role === 'Admin Audit') && <Item view="radar_audit" icon="radar" label="Radar audit" badge={pendingAudit} />}
          {(role === 'Super Admin' || role === 'Admin Audit') && <Item view="riwayat" icon="list" label="Riwayat aktivitas" />}
          {role === 'Super Admin' && <Item view="pengelolaan" icon="shield" label="Pengelolaan" />}
        </Group>
      </nav>

      <div className="p-2.5 border-t border-[#E6E9F2]">
        <button onClick={handleLogout} title="Keluar"
          className={`w-full flex items-center ${open ? 'gap-3 px-2.5' : 'justify-center'} h-8 rounded-lg text-[13px] text-[#6B665E] hover:bg-[#EEF0F7]`}>
          <Ico n="out" />
          {open && <span>Keluar</span>}
        </button>
        <button onClick={toggleSidebar} title={open ? 'Ciutkan menu (atau klik dua kali di menu)' : 'Perluas menu (atau klik dua kali di menu)'} aria-label={open ? 'Ciutkan menu' : 'Perluas menu'} aria-expanded={open}
          className={`w-full flex items-center ${open ? 'justify-end px-2.5' : 'justify-center'} h-8 rounded-lg text-[#8A857C] hover:bg-[#EEF0F7] hover:text-[#23211E]`}>
          <Ico n="fold" flip={!open} />
        </button>
      </div>
    </aside>
  );
};
</script>
